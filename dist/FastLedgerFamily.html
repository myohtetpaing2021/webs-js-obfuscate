    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            color-scheme: dark; /* Forces native dropdowns and datepickers to dark mode */
        }

        /* Fix Browser Autofill White Background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: #f8fafc !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Remove Spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Hardware Accelerated Classes for better mobile performance */
        .gpu-accelerated {
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-2px) translateZ(0);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .input-field { transition: border-color 0.2s ease, background-color 0.2s ease; }
        .input-field:focus {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
            outline: none;
        }

        select.input-field option, select option { background-color: #0f172a; color: #fff; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
        
        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        
        .text-neon-cyan { text-shadow: 0 0 8px rgba(6, 182, 212, 0.4); }
        .text-neon-emerald { text-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
        .text-neon-rose { text-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }
    </style>
