    <style>
        body {
            background-color: #050505;
            color: #e5e5e5;
            -webkit-tap-highlight-color: transparent;
        }

        /* Tech Grid Background - Optimized CSS Pattern */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* Glass Cards with Performance Focus */
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Premium Inputs */
        .input-tech {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-tech:focus {
            background: rgba(59, 130, 246, 0.05);
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Mobile Optimization */
        input { font-size: 16px !important; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Ambient Background Effects (Fixed & Optimized) -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <!-- Grid Pattern -->
        <div class="absolute inset-0 bg-grid opacity-60"></div>
        <!-- Top Blue Glow -->
        <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-blue-600/20 blur-[100px] rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-white/5 bg-[#050505]/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-violet-600 flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/10">
                    <i data-lucide="activity" class="text-white w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white font-num tracking-tight flex items-center gap-2">
                        WACC <span class="text-blue-500 bg-blue-500/10 px-1.5 py-0.5 rounded text-xs tracking-wider border border-blue-500/20">PRO</span>
                    </h1>
                </div>
            </div>
            
            <button onclick="addSource()" class="group relative px-5 py-2.5 rounded-xl bg-white/5 border border-white/10 overflow-hidden active:scale-95 transition-all hover:bg-white/10 hover:border-white/20">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/10 to-violet-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="flex items-center gap-2 relative z-10">
                    <i data-lucide="plus" class="w-4 h-4 text-blue-400"></i>
                    <span class="text-sm font-semibold text-slate-200 hidden sm:block">Add Capital</span>
                    <span class="text-sm font-semibold text-slate-200 sm:hidden">Add</span>
                </div>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 lg:p-8 grid lg:grid-cols-12 gap-6 relative z-10">

        <!-- Left Column: Source List (7 Cols) -->
        <section class="lg:col-span-7 flex flex-col gap-4 animate-slide-up">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="layers" class="w-4 h-4 text-blue-500"></i> Active Sources
                </h2>
                <span class="text-[10px] font-mono text-emerald-500 flex items-center gap-1.5">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    Sync Active
                </span>
            </div>

            <!-- List Container -->
            <div id="sourcesContainer" class="space-y-3 min-h-[200px]">
                <!-- Rows injected here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden py-12 flex flex-col items-center justify-center border border-dashed border-white/10 rounded-2xl bg-white/[0.01]">
                <div class="w-14 h-14 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/5">
                    <i data-lucide="bar-chart-4" class="w-6 h-6 text-slate-600"></i>
                </div>
                <p class="text-slate-400 text-sm font-medium">No capital sources added</p>
                <p class="text-slate-600 text-xs mt-1">Add sources to calculate WACC</p>
                <button onclick="addSource()" class="mt-4 text-blue-400 text-xs hover:text-blue-300 font-bold tracking-wider uppercase border-b border-blue-400/30 pb-0.5 hover:border-blue-400">Add First Source</button>
            </div>
        </section>

        <!-- Right Column: Dashboard (5 Cols) -->
        <section class="lg:col-span-5 space-y-5 animate-slide-up" style="animation-delay: 0.1s;">
            
            <!-- Hero WACC Card -->
            <div class="glass-card rounded-3xl p-6 relative overflow-hidden group">
                <!-- Background Mesh -->
                <div class="absolute inset-0 bg-gradient-to-br from-blue-500/5 via-transparent to-violet-500/5 group-hover:from-blue-500/10 transition-colors duration-500"></div>
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-500/20 blur-[60px] rounded-full pointer-events-none"></div>

                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-2 rounded-lg bg-white/5 border border-white/10">
                            <i data-lucide="percent" class="w-5 h-5 text-slate-300"></i>
                        </div>
                        <span class="text-[10px] font-bold bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full border border-emerald-500/20">LIVE CALC</span>
                    </div>

                    <div class="text-center py-2">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">WACC Result</h3>
                        <div class="flex items-baseline justify-center gap-1">
                            <span id="waccPercent" class="text-6xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-slate-400 font-num tracking-tighter drop-shadow-lg">0.0</span>
                            <span class="text-2xl text-blue-500 font-bold">%</span>
                        </div>
                    </div>
                </div>

                <!-- Footer Stats -->
                <div class="grid grid-cols-2 gap-px bg-white/10 mt-6 rounded-xl overflow-hidden border border-white/5">
                    <div class="bg-[#0A0A0A]/80 p-3 text-center backdrop-blur-sm group-hover:bg-[#0A0A0A]/60 transition-colors">
                        <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Total Capital</p>
                        <p class="text-sm font-bold text-white font-num truncate"><span id="totalCapital">0</span> <span class="text-[10px] text-slate-500 font-normal">Ks</span></p>
                    </div>
                    <div class="bg-[#0A0A0A]/80 p-3 text-center backdrop-blur-sm group-hover:bg-[#0A0A0A]/60 transition-colors">
                        <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Yearly Cost</p>
                        <p class="text-sm font-bold text-emerald-400 font-num truncate"><span id="yearlyCost">0</span> <span class="text-[10px] text-slate-500 font-normal">Ks</span></p>
                    </div>
                </div>
            </div>

            <!-- Breakdown -->
            <div class="glass-card rounded-2xl p-5 border border-white/5">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Weight Distribution</h3>
                    <i data-lucide="pie-chart" class="w-4 h-4 text-slate-600"></i>
                </div>
                <div id="breakdownDetails" class="space-y-3 max-h-[300px] overflow-y-auto no-scrollbar custom-fade-mask">
                    <!-- Bars injected here -->
                </div>
            </div>

            <!-- Actions Row -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="exportReport()" class="glass-card p-3.5 rounded-xl flex items-center justify-center gap-2 bg-gradient-to-br from-emerald-500/10 to-green-600/10 hover:from-emerald-500/20 hover:to-green-600/20 border-emerald-500/20 hover:border-emerald-500/40 text-emerald-400 transition-all group shadow-lg shadow-emerald-900/10">
                    <i data-lucide="file-down" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold font-num uppercase tracking-wider">Export Report</span>
                </button>
                <button onclick="openResetModal()" class="glass-card p-3.5 rounded-xl flex items-center justify-center gap-2 bg-gradient-to-br from-rose-500/10 to-red-600/10 hover:from-rose-500/20 hover:to-red-600/20 border-rose-500/20 hover:border-rose-500/40 text-rose-400 transition-all group shadow-lg shadow-rose-900/10">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 group-hover:-rotate-180 transition-transform duration-500"></i>
                    <span class="text-xs font-bold font-num uppercase tracking-wider">Reset</span>
                </button>
            </div>

        </section>
    </main>

    <!-- Custom Reset Modal -->
    <div id="resetModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 border border-white/10 shadow-2xl transform scale-100 transition-all">
            <div class="text-center">
                <div class="w-12 h-12 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20">
                    <i data-lucide="alert-triangle" class="w-6 h-6 text-rose-500"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-2">Reset Calculator?</h3>
                <p class="text-sm text-slate-400 mb-6">လက်ရှိတွက်ချက်ထားသော စာရင်းများအားလုံး ပျက်သွားပါမည်။ မူလအစအတိုင်း ပြန်ထားရန် သေချာပါသလား?</p>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="closeResetModal()" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 text-sm font-semibold transition-colors">
                        မလုပ်တော့ပါ
                    </button>
                    <button onclick="confirmReset()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold shadow-lg shadow-rose-900/20 transition-colors">
                        Reset လုပ်မည်
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Row Template (Mobile Optimized) -->
    <template id="sourceTemplate">
        <div class="glass-card rounded-2xl p-4 md:p-5 relative group transition-all hover:border-blue-500/30 hover:bg-white/[0.03] source-row animate-slide-up">
            <div class="flex flex-col sm:flex-row gap-4 sm:items-center">
                
                <!-- Name -->
                <div class="flex-1 relative">
                    <label class="text-[10px] text-slate-500 font-bold uppercase mb-1.5 block sm:hidden">Source Name</label>
                    <div class="relative group/input">
                        <i data-lucide="tag" class="w-4 h-4 absolute left-3 top-3 text-slate-500 group-focus-within/input:text-blue-400 transition-colors"></i>
                        <input type="text" class="source-name input-tech w-full rounded-xl py-2.5 pl-10 pr-3 text-sm font-medium placeholder-slate-600" placeholder="Source Name">
                    </div>
                </div>

                <!-- Values -->
                <div class="grid grid-cols-2 gap-3 sm:w-[280px]">
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase mb-1.5 block sm:hidden">Amount (Ks)</label>
                        <div class="relative group/input">
                            <input type="number" oninput="calculateWACC()" class="source-amount input-tech w-full rounded-xl py-2.5 px-3 text-sm text-right font-num placeholder-slate-600" placeholder="Amount">
                             <div class="absolute right-3 top-2.5 text-slate-600 text-[10px] font-bold pointer-events-none hidden sm:block">Ks</div>
                        </div>
                    </div>
                    <div class="relative">
                        <label class="text-[10px] text-slate-500 font-bold uppercase mb-1.5 block sm:hidden">Interest (%)</label>
                        <div class="relative group/input">
                             <input type="number" oninput="calculateWACC()" class="source-rate input-tech w-full rounded-xl py-2.5 px-3 pr-8 text-sm text-right text-emerald-400 font-bold font-num placeholder-slate-600" placeholder="Rate">
                             <span class="absolute right-3 top-2.5 text-slate-500 text-xs font-bold">%</span>
                        </div>
                    </div>
                </div>

                <!-- Delete Btn -->
                <button onclick="removeRow(this)" class="absolute -top-2 -right-2 sm:relative sm:top-0 sm:right-0 sm:ml-2 bg-[#0A0A0A] sm:bg-transparent text-slate-500 hover:text-red-400 p-2 rounded-full border border-white/10 sm:border-transparent shadow-lg sm:shadow-none transition-all hover:bg-white/5 active:scale-90 z-10">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </template>
