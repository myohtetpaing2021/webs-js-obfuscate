    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, background 0.2s ease;
            position: relative;
            overflow: hidden;
            will-change: transform; 
            transform: translateZ(0); 
        }

        .glass-card:active {
            transform: scale(0.98);
        }

        .input-field:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
            background: rgba(30, 41, 59, 0.95);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: white !important;
            caret-color: white;
            transition: background-color 5000s ease-in-out 0s;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        body.paused * {
            animation-play-state: paused !important;
        }

                        </button>
                        <button onclick="triggerImport()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-violet-400 hover:bg-violet-500/10 transition-colors">
                            <i data-lucide="upload-cloud" class="w-4 h-4"></i><span class="text-sm">Restore</span>
                        </button>
                        <button onclick="clearAllData()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-colors">

                                </div>

                                <div class="grid grid-cols-2 gap-3">

                                    </div>
                                    <div>

                                        <input type="text" id="expenseRemark" placeholder="2D..." class="input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white mt-1 focus:outline-none">

                                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
