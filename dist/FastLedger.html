    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, background 0.2s ease;
            position: relative;
            overflow: hidden;
            will-change: transform; 
            transform: translateZ(0); 
        }

        .glass-card:active {
            transform: scale(0.98);
        }

        .input-field:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
            background: rgba(30, 41, 59, 0.95);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: white !important;
            caret-color: white;
            transition: background-color 5000s ease-in-out 0s;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        body.paused * {
            animation-play-state: paused !important;
        }
    </style>

                </div>
                <nav class="space-y-2">
                    <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white/5 text-white border border-white/5 shadow-sm">
                        <i data-lucide="layout-dashboard" class="w-5 h-5 text-cyan-400"></i>
                        <span class="font-medium text-sm">Dashboard</span>
                    </button>
                    
                    <div class="pt-4 mt-4 border-t border-white/5 space-y-2">
                        <p class="text-[10px] uppercase text-slate-500 font-bold px-2 mb-1">Data Tools</p>
                        
                        <button onclick="exportReport()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 transition-colors">
                            <i data-lucide="file-text" class="w-4 h-4"></i><span class="text-sm">Export Report</span>
                        </button>

                        <button onclick="exportDataJSON()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-cyan-500/10 transition-colors">
                            <i data-lucide="download-cloud" class="w-4 h-4"></i><span class="text-sm">Backup (JSON)</span>
                        </button>
                        <button onclick="triggerImport()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-violet-400 hover:bg-violet-500/10 transition-colors">
                            <i data-lucide="upload-cloud" class="w-4 h-4"></i><span class="text-sm">Restore</span>
                        </button>
                        <button onclick="clearAllData()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i><span class="text-sm">Reset</span>
                        </button>
                    </div>
                </nav>
            </div>
        </aside>

        <!-- MOBILE HEADER (Updated) -->
        <div class="md:hidden fixed top-0 left-0 right-0 z-40 bg-[#020617]/90 backdrop-blur-md border-b border-white/5 px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-cyan-600 to-blue-700 rounded-lg flex items-center justify-center">
                    <i data-lucide="zap" class="text-white w-4 h-4"></i>
                </div>
                <span class="font-bold text-lg text-white font-num">Fast<span class="text-cyan-400">Ledger</span></span>
            </div>
            <div class="flex gap-2">

                 <button onclick="exportReport()" class="w-9 h-9 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-emerald-400 active:scale-95 transition-transform">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                </button>

                <button onclick="openMobileMenu()" class="w-9 h-9 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-cyan-400 active:scale-95 transition-transform">

                </button>
            </div>
        </div>

            <div class="max-w-7xl mx-auto px-4 md:px-8 space-y-5 animate-slide-up">
                
                <!-- STATS ROW -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="glass-card p-4 rounded-2xl flex flex-col">
                        <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">လက်ရှိငွေ</span>
                        <span class="text-2xl font-bold text-white font-num" id="totalCurrent">0</span>
                    </div>
                    <div class="glass-card p-4 rounded-2xl flex flex-col">
                        <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">သုံးငွေ</span>
                        <span class="text-2xl font-bold text-rose-400 font-num" id="totalExpense">0</span>
                    </div>
                    <div class="glass-card p-4 rounded-2xl flex flex-col">
                        <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">လက်ကျန်</span>
                        <span class="text-2xl font-bold text-emerald-400 font-num" id="totalBalance">0</span>

                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

                            <h3 class="text-white font-bold text-base mb-4 flex items-center gap-2">
                                <i data-lucide="plus-circle" class="w-4 h-4 text-cyan-400"></i> စာရင်းသစ်
                            </h3>
                            
                            <form id="ledgerForm" onsubmit="addRecord(event)" class="space-y-4">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">အမည်</label>
                                    <input type="text" id="name" placeholder="မောင်မောင်" required class="input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white mt-1 focus:outline-none">
                                </div>

                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">မှတ်ချက်</label>
                                    <input type="text" id="generalRemark" class="input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white mt-1 focus:outline-none">

                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-[10px] font-bold text-cyan-400 uppercase">လက်ရှိငွေ</label>
                                        <input type="number" id="currentMoney" placeholder="0" class="input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white mt-1 font-num focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-emerald-400 uppercase">ရငွေ/အနိုင်</label>
                                        <input type="number" id="income" placeholder="0" class="input-field w-full bg-emerald-900/10 border border-emerald-500/20 rounded-lg px-3 py-2.5 text-sm text-white mt-1 font-num focus:outline-none">
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-[10px] font-bold text-rose-400 uppercase">သုံးငွေ</label>
                                        <input type="number" id="expense" placeholder="0" class="input-field w-full bg-rose-900/10 border border-rose-500/20 rounded-lg px-3 py-2.5 text-sm text-white mt-1 font-num focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-slate-400 uppercase">မှတ်ချက်</label>
                                        <input type="text" id="expenseRemark" placeholder="2D..." class="input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white mt-1 focus:outline-none">
                                    </div>
                                </div>

                                <div class="pt-2 flex gap-3">
                                    <button type="submit" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white py-2.5 rounded-lg font-bold text-sm shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                                        <i data-lucide="save" class="w-4 h-4"></i> သိမ်းမည်
                                    </button>
                                    <button type="button" onclick="resetForm()" class="px-3 rounded-lg bg-slate-800 text-slate-400 hover:bg-slate-700">
                                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- LIST/TABLE -->
                    <div class="lg:col-span-2">
                        <div class="glass-card rounded-2xl overflow-hidden border border-white/5 flex flex-col h-full min-h-[500px]">

                                <div class="relative flex-1">
                                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-500"></i>
                                    <input type="text" id="searchInput" oninput="debounceSearch()" placeholder="ရှာရန်..."

                                </div>
                            </div>

                            <div id="listContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
                                <!-- JS Injected Content -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- MOBILE MENU MODAL (New) -->
        <div id="mobile-menu-modal" class="fixed inset-0 z-[80] hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">

                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="settings-2" class="w-5 h-5 text-cyan-400"></i> Data Tools

                    <button onclick="closeMobileMenu()" class="p-2 rounded-full bg-white/5 text-slate-400 hover:text-white">

                <div class="space-y-3">
                    <button onclick="exportReport(); closeMobileMenu()" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl bg-slate-800/50 hover:bg-emerald-500/10 border border-white/5 text-slate-300 hover:text-emerald-400 transition-all group">
                        <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400 group-hover:scale-110 transition-transform"><i data-lucide="file-text" class="w-5 h-5"></i></div>
                        <span class="font-medium">Export Report</span>
                    </button>

                    <button onclick="exportDataJSON(); closeMobileMenu()" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl bg-slate-800/50 hover:bg-cyan-500/10 border border-white/5 text-slate-300 hover:text-cyan-400 transition-all group">
                        <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-400 group-hover:scale-110 transition-transform"><i data-lucide="download-cloud" class="w-5 h-5"></i></div>
                        <span class="font-medium">Backup Data</span>
                    </button>
                    
                    <button onclick="triggerImport(); closeMobileMenu()" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl bg-slate-800/50 hover:bg-violet-500/10 border border-white/5 text-slate-300 hover:text-violet-400 transition-all group">
                        <div class="p-2 rounded-lg bg-violet-500/10 text-violet-400 group-hover:scale-110 transition-transform"><i data-lucide="upload-cloud" class="w-5 h-5"></i></div>
                        <span class="font-medium">Restore Data</span>
                    </button>
                    
                    <button onclick="clearAllData(); closeMobileMenu()" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl bg-slate-800/50 hover:bg-rose-500/10 border border-white/5 text-slate-300 hover:text-rose-400 transition-all group">

                <span id="toast-message">Success</span>
            </div>
