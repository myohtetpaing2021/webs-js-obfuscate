    <style>
        body {
            background-color: #020203;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Animated Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.08), transparent 25%);
            pointer-events: none;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--neo-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--neo-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Tech Input */
        .input-neo {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .input-neo:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            outline: none;
        }

        /* Neo Button */
        .btn-neo {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .btn-neo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: width 0.3s ease;
            z-index: -1;
        }
        .btn-neo:hover::before { width: 100%; }
        .btn-neo:active { transform: scale(0.98); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2ff; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .text-glow { text-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
    </style>
</head>
<body class="antialiased min-h-screen pb-20 selection:bg-neo-primary/30 selection:text-white">

    <!-- Background Ambience -->
    <div class="bg-mesh"></div>
    <div class="orb w-96 h-96 bg-neo-primary/20 top-[-10%] left-[-10%] animate-orb-float"></div>
    <div class="orb w-[500px] h-[500px] bg-neo-secondary/20 bottom-[-10%] right-[-10%] animate-orb-float-delayed"></div>

    <!-- Preloader -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020203] flex flex-col items-center justify-center transition-all duration-700">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-t-2 border-neo-primary rounded-full animate-spin shadow-glow"></div>
            <div class="absolute inset-3 border-r-2 border-neo-secondary rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 2s;"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="cpu" class="w-8 h-8 text-neo-primary animate-pulse"></i>
            </div>
        </div>
        <div class="text-sm font-tech tracking-[0.5em] text-neo-primary/80 animate-pulse">SYSTEM LOADING</div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 z-[90] hidden items-center justify-center bg-black/80 backdrop-blur-md px-4 opacity-0 transition-opacity duration-300">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 text-center transform scale-95 transition-all duration-300 border-neo-accent/30 shadow-glow-accent">
            <div class="w-16 h-16 bg-neo-accent/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-neo-accent/30">
                <i data-lucide="alert-octagon" class="w-8 h-8 text-neo-accent animate-pulse"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2 font-tech tracking-wide">CONFIRM WIPE</h3>
            <p class="text-sm text-neo-muted mb-6 font-sans">Data အားလုံး ဖျက်ပစ်မှာ သေချာပါသလား?</p>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 rounded-xl border border-white/10 hover:bg-white/5 text-gray-300 font-bold transition-all text-sm">CANCEL</button>
                <button onclick="executeReset()" class="flex-1 py-3 rounded-xl bg-neo-accent hover:bg-red-600 text-white font-bold transition-all shadow-lg shadow-neo-accent/20 text-sm">WIPE DATA</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[95] hidden transition-all duration-300">
        <div class="glass-card px-6 py-3 rounded-full flex items-center gap-3 border border-neo-success/30 shadow-glow">
            <div class="w-2 h-2 rounded-full bg-neo-success animate-pulse"></div>
            <span class="text-sm font-bold text-white font-tech tracking-wide" id="toastMessage">ACTION COMPLETED</span>
        </div>
    </div>

    <!-- App Container -->
    <main class="container mx-auto px-4 py-8 max-w-7xl relative z-10">
        
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-6 animate-slide-up-fade">
            <div class="flex items-center gap-5 group">
                <div class="w-14 h-14 bg-gradient-to-br from-gray-900 to-black rounded-2xl flex items-center justify-center border border-neo-primary/30 shadow-glow group-hover:scale-105 transition-transform duration-500">
                    <i data-lucide="bar-chart-big" class="w-7 h-7 text-neo-primary"></i>
                </div>
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-white font-tech tracking-wide">SEASONAL <span class="text-neo-primary text-glow">INDEX</span></h1>
                    <p class="text-xs text-neo-muted font-tech tracking-[0.2em] uppercase mt-1">Sales Intelligence System v4.0</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="glass-card px-4 py-2 rounded-full flex items-center gap-2">
                    <i data-lucide="calendar" class="w-4 h-4 text-neo-secondary"></i>
                    <span id="currentDate" class="text-xs font-bold text-gray-300 font-num"></span>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 animate-slide-up-fade" style="animation-delay: 0.1s;">
            
            <!-- LEFT PANEL -->
            <div class="xl:col-span-8 space-y-6">
                
                <!-- Controls -->
                <div class="glass-card rounded-3xl p-6 md:p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-neo-primary/5 rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                    
                    <div class="flex flex-col lg:flex-row gap-8 items-end relative z-10">
                        <!-- Input -->
                        <div class="w-full lg:w-5/12">
                            <label class="text-xs font-bold text-neo-primary mb-3 block tracking-widest uppercase font-tech flex items-center gap-2">
                                <i data-lucide="target" class="w-3 h-3"></i> Annual Target
                            </label>
                            <div class="relative group">
                                <input type="number" id="annualTarget" value="3000" 
                                    class="input-neo w-full rounded-2xl py-4 px-5 text-xl font-bold font-num placeholder-gray-600"
                                    placeholder="0">
                                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 text-xs font-bold font-tech tracking-wider">MMK</span>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="w-full lg:w-7/12 grid grid-cols-2 sm:flex sm:flex-wrap gap-3 justify-end">
                            <button onclick="fillSampleData()" class="btn-neo py-3 px-5 rounded-xl border border-white/10 text-gray-400 hover:text-white hover:border-white/30 font-bold text-xs flex items-center justify-center gap-2">
                                <i data-lucide="database" class="w-4 h-4"></i> Sample
                            </button>
                            
                            <button onclick="openResetModal()" class="btn-neo py-3 px-5 rounded-xl border border-white/10 hover:border-neo-accent/50 text-gray-400 hover:text-neo-accent font-bold text-xs flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                            </button>

                            <button onclick="calculateTargets()" class="col-span-2 sm:w-auto py-3 px-8 rounded-xl bg-gradient-to-r from-neo-primary to-blue-600 text-black font-bold text-sm shadow-glow hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="calculator" class="w-4 h-4"></i> CALCULATE
                            </button>
                            
                             <button onclick="exportReport()" class="col-span-2 sm:col-span-1 sm:w-auto py-3 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-neo-success font-bold flex items-center justify-center transition-all">
                                <i data-lucide="download" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="glass-card rounded-3xl flex flex-col min-h-[400px]">
                    <div class="p-5 border-b border-white/5 flex items-center justify-between bg-black/20">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-neo-secondary/20">
                                <i data-lucide="table-2" class="w-4 h-4 text-neo-secondary"></i>
                            </div>
                            <h3 class="text-sm font-bold text-white font-tech tracking-wider">
                                DATA INPUT (<span id="yearCountDisplay" class="text-neo-primary">3</span> YRS)
                            </h3>
                        </div>
                        <button onclick="addYear()" class="text-xs px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded-lg font-bold border border-white/10 flex items-center gap-2 transition-all active:scale-95">
                            <i data-lucide="plus" class="w-3 h-3"></i> ADD YEAR
                        </button>
                    </div>
                    
                    <div class="overflow-auto flex-1 custom-scrollbar">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead class="bg-[#0a0a0f] text-gray-500 text-[10px] font-bold tracking-[0.15em] sticky top-0 z-20 shadow-lg backdrop-blur-md">
                                <tr id="tableHeaderRow">
                                    <!-- JS Generated -->
                                </tr>
                            </thead>
                            <tbody id="inputTableBody" class="divide-y divide-white/5">
                                <!-- JS Generated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="xl:col-span-4 space-y-6">
                
                <!-- Chart -->
                <div class="glass-card p-6 rounded-3xl relative">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xs font-bold text-neo-muted font-tech tracking-[0.2em] uppercase">Trends Analysis</h3>
                        <div class="flex items-center gap-2 px-2 py-1 rounded bg-neo-primary/10 border border-neo-primary/20">
                            <span class="w-1.5 h-1.5 rounded-full bg-neo-primary animate-pulse"></span>
                            <span class="text-[10px] text-neo-primary font-bold">LIVE</span>
                        </div>
                    </div>
                    <div class="h-[220px] w-full">
                        <canvas id="seasonalChart"></canvas>
                    </div>
                </div>

                <!-- KPI Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-20 h-20 bg-neo-secondary/20 rounded-full blur-2xl group-hover:bg-neo-secondary/30 transition-all"></div>
                        <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-1">Avg Demand</p>
                        <h3 class="text-2xl font-bold text-white font-num tracking-tight group-hover:scale-105 transition-transform origin-left" id="grandAverageDisplay">0</h3>
                    </div>
                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-20 h-20 bg-neo-success/20 rounded-full blur-2xl group-hover:bg-neo-success/30 transition-all"></div>
                        <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-1">Base Target</p>
                        <h3 class="text-2xl font-bold text-white font-num tracking-tight group-hover:scale-105 transition-transform origin-left" id="baseTargetDisplay">0</h3>
                    </div>
                </div>

                <!-- Results List -->
                <div id="resultSection" class="glass-card rounded-3xl border-t-2 border-t-neo-success opacity-0 transition-all duration-700 transform translate-y-4">
                    <div class="p-4 bg-neo-success/10 flex items-center justify-between border-b border-white/5">
                        <h3 class="text-xs font-bold text-white font-tech tracking-[0.2em]">CALCULATION RESULTS</h3>
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-neo-success"></i>
                    </div>
                    
                    <div class="max-h-[350px] overflow-y-auto custom-scrollbar">
                        <div id="resultListView" class="divide-y divide-white/5">
                            <!-- JS Generated -->
                        </div>
                    </div>
                    
                    <div class="p-4 bg-black/30 border-t border-white/10 flex justify-between items-center">
                        <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">Annual Total</span>
                        <span class="font-bold text-neo-success font-num text-lg" id="totalTargetCheck">0</span>
                    </div>
                </div>

            </div>

        </div>

        <footer class="mt-12 text-center pb-8 border-t border-white/5 pt-8">
            <p class="text-[10px] text-gray-600 font-tech tracking-[0.3em]">SECURE SYSTEM • V4.0</p>
        </footer>

    </main>
