    <style>
        /* Hardware Acceleration for Performance */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow: hidden; /* Prevent body scroll */
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                        background 0.2s ease,
                        border-color 0.2s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(56, 189, 248, 0.3); /* Sky 400 */
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        textarea, input { font-size: 16px; }
        .number-badge { font-variant-numeric: tabular-nums; }

        .smooth-transition {
            transition-property: transform, opacity, background-color, border-color;
            transition-duration: 300ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh]">

    <!-- Header -->
    <header class="h-16 shrink-0 glass-panel flex justify-between items-center px-4 md:px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i data-lucide="calculator" class="text-white w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white font-num tracking-tight leading-none">2D/3D <span class="text-cyan-400">Pro</span></h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Fast & Accurate</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/50 border border-white/5">
            <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] animate-pulse"></div>
            <span class="text-[10px] text-slate-300 font-num hidden md:inline">SYSTEM ONLINE</span>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative z-10 p-2 md:p-4 gap-2 md:gap-4">
        
        <!-- Input Section -->
        <section class="flex-1 md:flex-[0.4] flex flex-col glass-card rounded-2xl md:rounded-3xl overflow-hidden animate-slide-up">
            <div class="p-3 md:p-4 border-b border-white/5 flex justify-between items-center bg-slate-800/30">
                <div class="flex items-center gap-2 text-slate-300 text-sm font-bold">
                    <i data-lucide="keyboard" class="w-4 h-4 text-cyan-400"></i>
                    <span>Input</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-mono text-slate-400 bg-slate-900 px-2 py-1 rounded" id="lineCount">L: 0</span>
                    <button onclick="clearData()" class="p-1.5 rounded-lg hover:bg-rose-500/10 text-rose-400 transition-colors" title="Clear">
                        <i data-lucide="eraser" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 relative bg-slate-900/40">
                <textarea id="inputData" 
                    class="w-full h-full bg-transparent text-slate-200 p-4 font-mono text-sm leading-relaxed focus:outline-none resize-none placeholder-slate-600 font-num"
                    placeholder="// Data ရိုက်ထည့်ပါ...
667 R 500
513 - 1000R500"></textarea>
            </div>
            
            <div class="py-1.5 px-3 bg-slate-800/50 border-t border-white/5 text-[10px] text-slate-500 text-center font-sans">
                Type freely. System auto-saves & calculates.
            </div>
        </section>

        <!-- Output Section -->
        <section class="flex-1 md:flex-[0.6] flex flex-col gap-2 md:gap-4 h-[50%] md:h-auto animate-slide-up" style="animation-delay: 0.1s;">
            
            <!-- Total Card (Figma Style) -->
            <div class="glass-card rounded-2xl md:rounded-3xl p-4 md:p-6 relative overflow-hidden shrink-0 bg-gradient-to-br from-slate-800/50 to-slate-900/50">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="w-full sm:w-auto">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Total Amount</p>
                        <div class="flex items-baseline gap-2">
                            <h2 class="text-3xl md:text-5xl font-bold text-white font-num tracking-tight number-badge" id="grandTotal">0</h2>
                            <span class="text-cyan-500 text-sm md:text-lg font-bold">MMK</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-end gap-2 w-full sm:w-auto">
                         <div class="bg-slate-950/30 px-3 py-1 rounded-lg border border-white/5 text-right w-full sm:w-auto">
                             <span class="block text-lg font-bold text-white font-num leading-none" id="itemCount">0</span>
                             <span class="text-[9px] text-slate-500 uppercase">Items</span>
                         </div>
                         
                         <!-- Action Buttons -->
                         <div class="flex gap-2 w-full sm:w-auto">
                            <button onclick="copyTotal()" class="smooth-transition flex-1 sm:flex-none flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg shadow-cyan-900/20 active:scale-95" title="Copy Total">
                                <i data-lucide="copy" class="w-3 h-3"></i> <span class="sm:hidden lg:inline">Copy</span>
                            </button>
                            <button onclick="exportReport()" class="smooth-transition flex-1 sm:flex-none flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg shadow-indigo-900/20 active:scale-95" title="Export Report">
                                <i data-lucide="file-text" class="w-3 h-3"></i> <span class="sm:hidden lg:inline">Export</span>
                            </button>
                         </div>
                    </div>
                </div>
            </div>

            <!-- List (Virtual Scroller Feel) -->
            <div class="glass-card rounded-2xl md:rounded-3xl flex-1 flex flex-col overflow-hidden relative">
                <div class="p-3 bg-slate-800/80 border-b border-white/5 backdrop-blur-md flex justify-between items-center z-10">
                    <span class="text-xs font-bold text-slate-300 flex items-center gap-2">
                        <i data-lucide="list-checks" class="w-4 h-4 text-emerald-400"></i> Result List
                    </span>
                </div>
                
                <div class="flex-1 overflow-y-auto custom-scrollbar bg-slate-900/20">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="bg-slate-900/90 text-slate-500 text-[10px] font-bold uppercase tracking-widest sticky top-0 z-10 backdrop-blur-sm shadow-sm">
                            <tr>
                                <th class="py-3 px-4 md:px-6 font-mono font-medium">Number</th>
                                <th class="py-3 px-4 md:px-6 text-right font-mono font-medium">Amount</th>
                                <th class="py-3 px-4 md:px-6 text-center font-mono font-medium">Type</th>
                            </tr>
                        </thead>
                        <tbody id="resultTableBody" class="divide-y divide-white/5 text-slate-300">
                            <!-- JS injects here -->
                            <tr>
                                <td colspan="3" class="text-center py-12 text-slate-600">
                                    <div class="flex flex-col items-center gap-2">
                                        <i data-lucide="inbox" class="w-8 h-8 opacity-20"></i>
                                        <span class="text-xs font-mono opacity-40">Ready to calculate</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 z-[100] translate-x-[150%] transition-transform duration-300 cubic-bezier(0.175, 0.885, 0.32, 1.275) pointer-events-none">
        <div class="bg-slate-800/90 backdrop-blur-xl px-4 py-3 rounded-xl border border-white/10 flex items-center gap-3 shadow-2xl">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                <i data-lucide="check" class="w-3 h-3"></i>
            </div>
            <p id="toastMsg" class="text-xs font-bold text-white">Action successful!</p>
        </div>
    </div>
