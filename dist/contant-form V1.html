<!DOCTYPE html>
<html lang="en"> <!-- Changed language to en -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us (Dark Mode)</title> <!-- Translated title -->
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Font (Using Inter for English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Changed to a dark gradient background */
            background: linear-gradient(135deg, #2c3e50 0%, #1a202c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* padding: 20px; */ /* Removed fixed padding */
            font-family: 'Inter', sans-serif; /* Changed font */
            color: #e2e8f0; /* Default text color light */
        }

        .form-container {
            /* Dark glass effect */
            background-color: rgba(45, 55, 72, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom styled button (already good for dark mode) */
        .btn-primary {
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 0, 224, 0.3);
        }
        
        /* Custom styles for form inputs */
        .form-control {
            background-color: #2d3748;
            color: #ffffff;
            border-radius: 0.5rem;
            border: 1px solid #4a5568;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #718096;
        }

        .form-control:focus {
            background-color: #2d3748;
            color: #ffffff;
            border-color: #805ad5;
            box-shadow: 0 0 0 0.25rem rgba(128, 90, 213, 0.3);
        }

        /* Override file input text color */
        .form-control[type="file"] {
            color: #a0aec0;
        }
        .form-control[type="file"]:focus {
            color: #a0aec0;
        }

        .progress {
            height: 10px;
            margin-top: 20px;
            border-radius: 0.5rem;
            background-color: #2d3748; /* Dark background for progress */
        }

        #spinner {
            display: none;
            margin-top: 20px;
            text-align: center;
            color: #805ad5; /* Purple spinner color */
        }

        .center-text {
            text-align: center;
            margin-top: 20px;
        }

        .form-description {
            color: #a0aec0; /* Light gray for description */
            font-weight: 400;
            font-size: 0.95rem;
        }

        .required::after {
            content: " *";
            color: #f56565; /* Brighter red for dark mode */
        }

        .form-label {
            font-weight: 600;
            color: #cbd5e0; /* Light text for labels */
        }

        h2 {
            font-weight: 700;
            color: #ffffff; /* White heading */
        }
        
        .form-text {
            color: #a0aec0 !important; /* Light gray helper text */
        }
        
        .text-muted {
            color: #718096 !important; /* Dark mode muted text */
        }

        /* Custom Dark Mode Alerts */
        .alert-success {
            background-color: #2f5a3a;
            color: #c6f6d5;
            border-color: #38a169;
        }
        .alert-danger {
            background-color: #632424;
            color: #fed7d7;
            border-color: #e53e3e;
        }
        .alert-warning {
            background-color: #6b4a20;
            color: #feebc8;
            border-color: #dd6b20;
        }

    </style>
</head>
