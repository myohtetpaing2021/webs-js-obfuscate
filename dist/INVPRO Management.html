    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Remove Spinners from Number Inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Premium Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.6) 100%);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(56, 189, 248, 0.1);
        }
        
        .glass-card:hover::before { opacity: 1; }

        /* Input Styling */
        .input-field { transition: all 0.3s ease; }
        .input-field:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        
        .text-neon-blue { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    </style>

                </div>
            </div>
            <div class="w-64 space-y-4">
                <div class="text-center">
                    <h2 class="text-3xl font-bold tracking-[0.2em] text-white font-num mb-1">INVENTORY<span class="text-cyan-400">PRO</span></h2>
                    <p class="text-[10px] text-cyan-500/70 font-num tracking-[0.4em] uppercase">System Initializing</p>
                </div>
                <div class="h-1 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 relative">

                <div class="p-6 pb-4 flex items-center gap-4 shrink-0">
                    <div class="w-12 h-12 shrink-0 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] border border-white/10 relative overflow-hidden group">
                        <i data-lucide="layers" class="text-white w-6 h-6 relative z-10"></i>
                    </div>
                    <div class="opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 whitespace-nowrap">

                        </button>

                        <button onclick="exportDataJSON()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-cyan-600/10 to-blue-600/10 hover:from-cyan-600/20 hover:to-blue-600/20 text-xs font-bold text-cyan-400 border border-cyan-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">

                            </div>

                        <button onclick="triggerImport()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-violet-600/10 to-purple-600/10 hover:from-violet-600/20 hover:to-purple-600/20 text-xs font-bold text-violet-400 border border-violet-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">
                                <i data-lucide="upload-cloud" class="w-5 h-5 group-hover/action:scale-110 transition-transform"></i>
                            </div>
                            <span class="whitespace-nowrap opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 relative z-10">Restore Data</span>

                        <button onclick="resetData()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-rose-600/10 to-red-600/10 hover:from-rose-600/20 hover:to-red-600/20 text-xs font-bold text-rose-400 border border-rose-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden mt-1">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">
                                <i data-lucide="trash-2" class="w-5 h-5 group-hover/action:rotate-12 transition-transform"></i>

                        </button>
                    </div>

                </div>
            </aside>
