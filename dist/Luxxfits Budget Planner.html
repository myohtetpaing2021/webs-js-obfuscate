<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxxfits Budget Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #8b5e3c;
            --primary-light: #a67c52;
            --bg-light: #fdfbf7;
            --card-light: #ffffff;
            --text-light: #2d241e;
            
            --bg-dark: #1a1614;
            --card-dark: #2d241e;
            --text-dark: #fdfbf7;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .dark {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .light {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        .card {
            transition: transform 0.2s;
        }
        
        .dark .card {
            background-color: var(--card-dark);
            border: 1px solid #4a3f35;
        }
        
        .light .card {
            background-color: var(--card-light);
            border: 1px solid #e5e7eb;
        }

        .nav-item.active {
            background-color: var(--primary);
            color: white;
        }

        /* Wheel Chart Styles */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        
        .wheel-segment {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .wheel-segment:hover {
            opacity: 0.8;
        }

        /* Piggy Bank Grid */
        .piggy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px;
        }
        
        .piggy-icon {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .piggy-icon:hover {
            transform: scale(1.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
    </style>
</head>
<body class="light min-h-screen pb-20">
    <!-- Header -->
    <header class="sticky top-0 z-50 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="wallet" class="text-[#8b5e3c]"></i>
            <h1 class="text-xl font-bold tracking-tight">Luxxfits <span class="font-light">Planner</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6" id="app">
