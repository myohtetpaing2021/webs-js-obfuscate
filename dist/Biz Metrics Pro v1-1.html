        body {
            background-color: #030712;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Prevent body scroll, everything scrolls inside containers */
        }

        /* Tech Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Premium Glass Effects */
        .glass-header {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 10px 40px -10px rgba(6, 182, 212, 0.15), inset 0 0 20px rgba(6, 182, 212, 0.05);
        }

        /* Result Container Styling */
        .result-hud {
            background: repeating-linear-gradient(
                45deg,
                rgba(15, 23, 42, 0.8),
                rgba(15, 23, 42, 0.8) 10px,
                rgba(30, 41, 59, 0.8) 10px,
                rgba(30, 41, 59, 0.8) 20px
            );
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.1), 0 0 20px rgba(16, 185, 129, 0.05);
        }

        /* Input Styling */
        .input-wrapper {
            position: relative;
            z-index: 1;
        }
        .input-wrapper::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 0.75rem;
            background: linear-gradient(to right, rgba(6,182,212,0.5), rgba(59,130,246,0.5));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .input-wrapper:focus-within::before {
            opacity: 1;
        }
        .input-field {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(3, 7, 18, 0.9);
            border-color: transparent;
            box-shadow: inset 0 0 15px rgba(6,182,212,0.1);
        }

        /* Hover Sidebar Styles */
        .expanding-sidebar {
            width: 300px;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @media (min-width: 1024px) {
            .expanding-sidebar {
                width: 84px; /* Default collapsed width */
            }
            .expanding-sidebar:hover {
                width: 320px; /* Expanded width on hover */
            }
        }
