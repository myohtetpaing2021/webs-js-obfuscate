    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.05);
        }

        /* Input Styling */
        .input-field {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
            outline: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-bottom: 0.5rem; color: #fff; }
        .markdown-content p { margin-bottom: 0.8rem; line-height: 1.6; }
        .markdown-content strong { color: #38bdf8; }
        .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.8rem; }
        
        /* Perspective for Grid */
        .perspective-container {
            perspective: 500px;
        }
        .grid-floor {
            transform: rotateX(60deg);
            transform-origin: 50% 0;
        }
    </style>

<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <!-- PREMIUM PRELOADER -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020617] flex flex-col items-center justify-center transition-all duration-1000 ease-[cubic-bezier(0.76,0,0.24,1)] overflow-hidden">
        
        <!-- 3D Moving Grid Background -->
        <div class="absolute inset-0 perspective-container pointer-events-none">
            <div class="absolute inset-[-100%] grid-floor opacity-30 animate-grid-move" 
                 style="background-image: linear-gradient(rgba(56, 189, 248, 0.3) 1px, transparent 1px),
                 linear-gradient(90deg, rgba(56, 189, 248, 0.3) 1px, transparent 1px);
                 background-size: 50px 50px;">
            </div>
            <!-- Vignette Fade -->
            <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-[#020617]"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-[#020617] via-transparent to-[#020617]"></div>
        </div>

        <!-- Central Reactor Core -->
        <div class="relative flex flex-col items-center z-10 scale-100 transition-transform duration-700" id="preloader-core">
            
            <!-- Spinner Container -->
            <div class="relative w-48 h-48 flex items-center justify-center mb-10">
                <!-- Ambient Glow -->
                <div class="absolute inset-0 bg-cyan-500/10 blur-[50px] rounded-full animate-pulse-slow"></div>

                <!-- Ring 1 (Slow Outer) -->
                <div class="absolute inset-0 border border-cyan-500/20 rounded-full border-dashed animate-[spin_12s_linear_infinite]"></div>
                
                <!-- Ring 2 (Fast Inner) -->
                <div class="absolute inset-3 border-t-2 border-r-2 border-cyan-400/80 rounded-full animate-[spin_3s_linear_infinite] shadow-[0_0_15px_rgba(34,211,238,0.5)]"></div>
                
                <!-- Ring 3 (Reverse) -->
                <div class="absolute inset-6 border-b-2 border-l-2 border-violet-500/80 rounded-full animate-[spin_4s_linear_infinite_reverse]"></div>

                <!-- Core Icon -->
                <div class="relative w-24 h-24 bg-[#020617] rounded-full flex items-center justify-center border border-white/10 shadow-[0_0_40px_rgba(6,182,212,0.2)] z-20 overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/20 to-violet-500/20 animate-pulse"></div>
                    <!-- Using Brain Circuit for AI feel -->
                    <i data-lucide="brain-circuit" class="text-white w-10 h-10 relative z-30 drop-shadow-[0_0_15px_rgba(255,255,255,0.8)] animate-pulse"></i>
                </div>
            </div>
            
            <!-- Text & Progress -->
            <div class="text-center w-80 space-y-5">
                <!-- Title with Glitch Effect placeholder -->
                <h1 class="text-4xl font-bold tracking-[0.2em] text-white font-num relative group">
                    <span class="relative z-10">AIDA<span class="text-cyan-400">.AI</span></span>
                    <span class="absolute inset-0 blur-lg bg-cyan-500/30 opacity-50 z-0 group-hover:opacity-80 transition-opacity"></span>
                </h1>
                
                <!-- Advanced Progress Bar -->
                <div class="relative h-1 w-full bg-slate-800 rounded-full overflow-hidden border border-white/5">
                    <div id="progress-bar" class="absolute top-0 left-0 h-full w-0 bg-gradient-to-r from-cyan-400 via-blue-500 to-violet-500 shadow-[0_0_20px_rgba(56,189,248,0.8)] transition-all duration-100 ease-out">
                        <div class="absolute right-0 top-0 bottom-0 w-10 bg-white/80 blur-[4px]"></div>
                    </div>
                </div>
                
                <!-- Status Row -->
                <div class="flex justify-between items-center text-[10px] font-mono tracking-widest uppercase">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <span id="loading-status" class="text-cyan-400/90">Initializing System...</span>
                    </div>
                    <span id="progress-text" class="text-white font-bold">0%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 relative border border-white/10 shadow-2xl">
            <button onclick="toggleSettings()" class="absolute right-5 top-5 text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center border border-cyan-500/20">
                    <i data-lucide="key" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">API Settings</h3>
                    <p class="text-xs text-slate-400">Configure your Gemini AI Key</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider pl-1 mb-2 block">Gemini API Key</label>
                    <div class="relative">
                        <input id="api-key-input" type="password" placeholder="Paste your API key here..." class="input-field w-full rounded-xl pl-10 pr-4 py-3 text-sm font-sans">
                        <i data-lucide="lock" class="absolute left-3.5 top-3.5 w-4 h-4 text-slate-500"></i>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-2">
                        API Key မရှိသေးပါက <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-cyan-400 hover:underline">Google AI Studio</a> တွင် အခမဲ့ရယူပါ။
                    </p>
                </div>

                <div class="pt-2 flex gap-3">
                    <button onclick="saveApiKey()" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                        Save Key
                    </button>
                    <button onclick="resetApiKey()" class="px-4 py-2.5 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-bold text-sm transition-all">
                        Reset
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px] animate-float"></div>

                        <i data-lucide="bot" class="text-white w-6 h-6 relative z-10"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight font-num">AIDA<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">AI</span></h1>
                        <p class="text-[10px] text-slate-400 font-medium tracking-[0.2em] uppercase">Copywriting Tool</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2 mt-4" id="desktop-nav">
                <!-- Nav items injected by JS -->
            </nav>

            <div class="p-6 mt-auto">
                <button onclick="toggleSettings()" class="w-full glass-card p-4 rounded-2xl border border-cyan-500/20 bg-cyan-500/5 relative overflow-hidden group hover:bg-cyan-500/10 transition-all text-left">
                    <div class="flex items-center justify-between relative z-10">
                        <div class="flex items-center gap-3">
                            <div id="key-status-dot" class="w-2 h-2 rounded-full bg-slate-500 shadow-[0_0_10px_rgba(100,116,139,0.8)]"></div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-200 group-hover:text-white">API Config</h4>
                                <p id="key-status-text" class="text-[10px] text-slate-500 font-num">No Key Set</p>
                            </div>

                        <i data-lucide="settings" class="w-4 h-4 text-slate-400 group-hover:rotate-90 transition-transform duration-500"></i>
                    </div>
                </button>
            </div>
        </aside>

        <!-- MOBILE HEADER -->
        <div class="md:hidden fixed top-0 left-0 right-0 z-40 bg-[#020617]/80 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="bot" class="text-white w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg text-white font-num">AIDA<span class="text-cyan-400">AI</span></span>
            </div>
            <button onclick="toggleSettings()" class="w-9 h-9 rounded-full bg-slate-800/80 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700/80 transition-all">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative z-10 pt-20 md:pt-4 md:px-0 pb-28 md:pb-4 h-screen overflow-y-auto custom-scrollbar scroll-smooth">
            <div id="app-content" class="max-w-5xl mx-auto px-4 md:px-8 space-y-8 animate-slide-up pb-10">
