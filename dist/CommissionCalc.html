    <style>
        body {
            background-color: #020617; /* Slate 950 */
        }
        
        /* Hide Number Input Arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Modern Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group:focus-within i {
            color: white; 
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Animation Delays */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6 text-slate-200 selection:bg-cyan-500/30 relative font-sans overflow-x-hidden">

    <!-- Animated Background Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-500/20 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-cyan-500/20 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob" style="animation-delay: 2s"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-pink-500/20 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob" style="animation-delay: 4s"></div>
    </div>

    <!-- Main Container -->
    <div class="glass-panel w-full max-w-6xl rounded-[24px] md:rounded-[32px] relative z-10 overflow-hidden flex flex-col lg:flex-row shadow-2xl animate-fade-in">
        
        <!-- Left Side: Inputs -->
        <div class="w-full lg:w-5/12 p-6 md:p-10 border-b lg:border-b-0 lg:border-r border-white/5 bg-gradient-to-b from-white/5 to-transparent relative">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-8 md:mb-10">
                <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-3">
                    <div class="bg-gradient-to-br from-cyan-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-cyan-500/20">
                        <i data-lucide="calculator" class="w-5 h-5 text-white"></i>
                    </div>
                    <span class="tracking-wide font-num">PRICE<span class="text-cyan-400">CALC</span></span>
                </h1>
                <button onclick="resetCalculator()" class="group flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/50 hover:bg-slate-700 text-xs font-medium text-slate-400 hover:text-white transition-all border border-white/5 hover:border-white/20 active:scale-95">
                    <i data-lucide="refresh-ccw" class="w-3.5 h-3.5 group-hover:-rotate-180 transition-transform duration-500"></i>
                    RESET
                </button>
            </div>

            <!-- Inputs Form -->
            <div class="space-y-6 md:space-y-8">
                
                <!-- Cost Input -->
                <div class="group relative input-group animate-fade-in delay-100">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block flex items-center gap-2">
                        အရင်း (Cost)
                    </label>
                    <div class="relative transition-all duration-300 transform group-hover:-translate-y-1">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none transition-colors duration-300">
                            <i data-lucide="dollar-sign" class="w-5 h-5 text-cyan-400"></i>
                        </div>
                        <input type="number" id="inputCost" oninput="calculate()" placeholder="0" class="w-full bg-[#0f172a]/60 border border-slate-700/50 rounded-2xl py-4 pl-12 pr-16 text-xl font-bold text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500/50 focus:bg-[#0f172a] focus:ring-4 focus:ring-cyan-500/10 transition-all shadow-inner font-num">
                        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-xs md:text-sm font-bold text-slate-500 font-num bg-slate-800/50 px-2 py-1 rounded">MMK</span>
                    </div>
                </div>

                <!-- Profit Input -->
                <div class="group relative input-group animate-fade-in delay-200">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block flex items-center gap-2">
                        လိုချင်သည့် အမြတ်
                    </label>
                    <div class="relative transition-all duration-300 transform group-hover:-translate-y-1">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none transition-colors duration-300">
                            <i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i>
                        </div>
                        <input type="number" id="inputProfit" oninput="calculate()" placeholder="0" class="w-full bg-[#0f172a]/60 border border-slate-700/50 rounded-2xl py-4 pl-12 pr-16 text-xl font-bold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 focus:bg-[#0f172a] focus:ring-4 focus:ring-emerald-500/10 transition-all shadow-inner font-num">
                        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-xs md:text-sm font-bold text-slate-500 font-num bg-slate-800/50 px-2 py-1 rounded">MMK</span>
                    </div>
                </div>

                <!-- Commission Input -->
                <div class="group relative input-group animate-fade-in delay-300">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block flex items-center gap-2">
                        ကော်မရှင် (%)
                    </label>
                    <div class="relative transition-all duration-300 transform group-hover:-translate-y-1">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none transition-colors duration-300">
                            <i data-lucide="percent" class="w-5 h-5 text-pink-400"></i>
                        </div>
                        <input type="number" id="inputCommission" oninput="calculate()" placeholder="0" class="w-full bg-[#0f172a]/60 border border-slate-700/50 rounded-2xl py-4 pl-12 pr-16 text-xl font-bold text-white placeholder-slate-600 focus:outline-none focus:border-pink-500/50 focus:bg-[#0f172a] focus:ring-4 focus:ring-pink-500/10 transition-all shadow-inner font-num">
                        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-xs md:text-sm font-bold text-slate-500 font-num bg-slate-800/50 px-2 py-1 rounded">%</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Side: Results -->
        <div class="w-full lg:w-7/12 p-6 md:p-10 flex flex-col justify-between bg-black/20 relative">
            
            <!-- Mobile Separator -->
            <div class="lg:hidden w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent mb-6"></div>

            <div class="flex-grow flex flex-col justify-center">
                <h2 class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-widest mb-6 flex items-center gap-2 font-num justify-center lg:justify-start">
                    <i data-lucide="crown" class="w-5 h-5 text-yellow-500"></i>
                    Recommended Price
                </h2>

                <!-- Main Price Display -->
                <div class="relative group w-full">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-3xl blur opacity-20 group-hover:opacity-40 transition duration-1000"></div>
                    <div class="relative bg-[#0b1221] border border-slate-700/50 rounded-3xl p-8 md:p-12 flex flex-col items-center justify-center text-center shadow-2xl overflow-hidden">
                        
                        <!-- Decorative background grid -->
                        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')] opacity-20"></div>

                        <span class="text-slate-400 text-sm font-medium mb-4 relative z-10">ရောင်းရမည့် စျေးနှုန်း</span>
                        
                        <div class="flex flex-col md:flex-row items-baseline gap-2 mb-2 relative z-10">
                            <span id="displayPrice" class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white via-cyan-100 to-cyan-400 tracking-tight font-num drop-shadow-lg">0</span>
                            <span class="text-lg text-slate-500 font-bold font-num hidden md:inline-block">MMK</span>
                        </div>
                        <span class="text-sm text-slate-500 font-bold font-num md:hidden mb-2">MMK</span>

                        <!-- Copy Button (Hidden initially) -->
                        <button id="btnCopy" onclick="copyPrice()" class="mt-6 hidden items-center gap-2 px-5 py-2.5 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 hover:text-cyan-300 text-sm font-bold transition-all border border-cyan-500/20 hover:border-cyan-500/40 active:scale-95 z-10">
                            <i id="iconCopy" data-lucide="copy" class="w-4 h-4"></i>
                            <span id="textCopy">စျေးနှုန်း ကူးယူမည်</span>
                        </button>

                    </div>
                </div>
            </div>

            <!-- Breakdown Section -->
            <div class="mt-8 space-y-4">
                
                <!-- Visual Bars & Data -->
                <div class="bg-[#0f172a]/40 p-5 md:p-6 rounded-2xl border border-slate-700/30 backdrop-blur-sm">
                    <div class="flex justify-between text-[10px] md:text-xs font-bold text-slate-400 mb-3 uppercase font-num tracking-wider">
                        <span>Net Income</span>
                        <span>Commission</span>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="h-3 md:h-4 w-full bg-slate-800 rounded-full overflow-hidden flex relative shadow-inner">
                        <div id="barNet" class="h-full bg-gradient-to-r from-emerald-600 to-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all duration-700 ease-out" style="width: 100%"></div>
                        <div id="barComm" class="h-full bg-gradient-to-l from-pink-600 to-pink-400 shadow-[0_0_10px_rgba(236,72,153,0.5)] transition-all duration-700 ease-out" style="width: 0%"></div>
                    </div>

                    <!-- Detailed Numbers -->
                    <div class="grid grid-cols-2 gap-4 mt-6">
                        
                        <!-- Net Amount -->
                        <div class="flex flex-col p-3 rounded-xl hover:bg-white/5 transition-colors">
                            <div class="flex items-center gap-2 mb-1.5">
                                <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_5px_rgba(52,211,153,0.8)]"></div>
                                <span class="text-[10px] md:text-xs text-slate-400 font-bold font-num">YOU GET (NET)</span>
                            </div>
                            <span id="displayNet" class="text-lg md:text-xl font-bold text-white font-num">0</span>
                        </div>

                        <!-- Commission Amount -->
                        <div class="flex flex-col items-end text-right p-3 rounded-xl hover:bg-white/5 transition-colors">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="text-[10px] md:text-xs text-slate-400 font-bold font-num">COMMISSION</span>
                                <div class="w-2 h-2 rounded-full bg-pink-400 shadow-[0_0_5px_rgba(244,114,182,0.8)]"></div>
                            </div>
                            <span id="displayComm" class="text-lg md:text-xl font-bold text-pink-400 font-num">0</span>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl border border-slate-700 flex items-center gap-3 transition-all duration-300 translate-y-32 z-50">
        <div class="bg-green-500/20 p-1 rounded-full"><i data-lucide="check" class="w-4 h-4 text-green-400"></i></div>
        <span class="text-sm font-medium">Copied to clipboard!</span>
    </div>
