    <style>
        body {
            background-color: #0B0F19;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            /* Optimize rendering */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* Input Styling */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Optimized Glass Panel - Reduced Blur */
        .glass-panel {
            background: rgba(17, 24, 39, 0.85); /* More opacity for better performance */
            backdrop-filter: blur(12px); /* Reduced from 20px */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .hero-gradient-border {
            position: relative;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            z-index: 1;
        }

        .hero-gradient-border::before {
            content: "";
            position: absolute;
            inset: -1px; /* Thinner border for performance look */
            border-radius: 1.55rem; 
            padding: 1px; 
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6); 
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
            -webkit-mask-composite: xor; 
            mask-composite: exclude; 
            pointer-events: none;
            opacity: 0.6;
        }

        .input-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.2s, background-color 0.2s; /* Simplified transition */
        }
        
        .input-box:focus-within {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(6, 182, 212, 0.5);
        }

        .day-card {
            transition: transform 0.2s ease;
            will-change: transform; /* Hint to browser */
        }
        
        .day-card:hover {
            transform: translateY(-2px);
        }

        @media (min-width: 768px) {
            .grid-responsive {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans selection:bg-cyan-500/30">

    <!-- PRELOADER - Optimized -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#0B0F19] flex flex-col items-center justify-center transition-opacity duration-500 ease-out">
        <div class="relative flex flex-col items-center z-10">
            <!-- Central Tech Loader -->
            <div class="relative w-20 h-20 mb-8 flex items-center justify-center">
                <div class="absolute inset-0 border-2 border-slate-800 rounded-full"></div>
                <div class="absolute inset-0 border-t-2 border-r-2 border-cyan-500/50 rounded-full animate-spin-slow"></div>
                <div class="absolute inset-2 border-b-2 border-l-2 border-blue-500/50 rounded-full animate-spin-reverse"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                     <i data-lucide="cpu" class="w-6 h-6 text-cyan-400"></i>
                </div>
            </div>

            <h2 class="text-2xl font-bold tracking-[0.2em] text-white font-mono mb-6 flex items-center gap-2">
                LOTTERY<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">OS</span>
            </h2>
            
            <!-- Progress Bar -->
            <div class="w-48 h-1 bg-slate-800 rounded-full overflow-hidden relative">
                <div id="progress-bar" class="absolute top-0 left-0 h-full bg-cyan-500 w-0 transition-all duration-100 ease-out"></div>
            </div>
        </div>
    </div>

    <!-- Static Background - Optimized for Performance -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 bg-[#0B0F19]">
        <!-- Static gradients instead of heavy animations -->
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-[#0B0F19] via-[#0f172a] to-[#0B0F19]"></div>
        <div class="absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] bg-blue-900/10 rounded-full blur-[80px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-cyan-900/10 rounded-full blur-[80px]"></div>
        <div class="absolute inset-0 opacity-[0.15]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E'); mix-blend-mode: overlay;"></div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 relative z-10 w-full max-w-5xl mx-auto pb-12">
        
        <!-- HEADER -->
        <header class="pt-6 pb-4 px-4 flex justify-between items-center max-w-3xl mx-auto">
            <div class="flex flex-col">
                <div class="flex items-center gap-2 mb-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                    <span class="text-[10px] font-bold tracking-[0.3em] text-cyan-400 uppercase">Lottery Calc</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Ultimate <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Suite</span></h1>
            </div>
            <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center backdrop-blur-md shadow-sm">
                <i data-lucide="bar-chart-2" class="text-cyan-400 w-5 h-5"></i>
            </div>
        </header>

        <div class="px-4 space-y-5 max-w-3xl mx-auto">
            
            <!-- SUMMARY CARDS -->
            <div class="glass-panel rounded-2xl p-1 animate-slide-up relative group/panel">
                <div class="absolute -top-6 right-0 text-[10px] text-slate-500 font-mono opacity-0 group-hover/panel:opacity-100 transition-opacity">
                    <span class="bg-black/40 px-2 py-1 rounded border border-white/5">Tap values to copy</span>
                </div>
                <div class="grid grid-cols-4 divide-x divide-white/5">
                    <!-- Total Bet -->
                    <div class="p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 active:bg-white/10 transition-colors relative" onclick="copyToClipboard('grandTotalBet')">
                        <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-1">Bet</span>
                        <span class="text-xs md:text-sm font-bold text-white font-mono" id="grandTotalBet">0</span>
                    </div>
                    <!-- Total P -->
                    <div class="p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 active:bg-white/10 transition-colors relative" onclick="copyToClipboard('grandTotalP')">
                        <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-1">P</span>
                        <span class="text-xs md:text-sm font-bold text-cyan-400 font-mono" id="grandTotalP">0</span>
                    </div>
                    <!-- Net -->
                    <div class="p-3 flex flex-col items-center justify-center relative cursor-pointer hover:bg-emerald-500/5 active:bg-emerald-500/10 transition-colors" onclick="copyToClipboard('netAmount')">
                        <span class="text-[9px] text-emerald-400/80 uppercase font-bold tracking-wider mb-1">Net</span>
                        <span class="text-xs md:text-sm font-bold text-emerald-400 font-mono" id="netAmount">0</span>
                    </div>
                    <!-- Payout -->
                    <div class="p-3 flex flex-col items-center justify-center relative cursor-pointer hover:bg-rose-500/5 active:bg-rose-500/10 transition-colors" onclick="copyToClipboard('payoutAmount')">
                        <span class="text-[9px] text-rose-400/80 uppercase font-bold tracking-wider mb-1">Pay</span>
                        <span class="text-xs md:text-sm font-bold text-rose-400 font-mono" id="payoutAmount">0</span>
                    </div>
                </div>
            </div>

            <!-- HERO PROFIT CARD -->
            <div class="hero-gradient-border p-6 relative overflow-hidden animate-slide-up" style="animation-delay: 50ms;">
                <!-- Subtle Background Glow -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl -mr-16 -mt-16 pointer-events-none"></div>
                
                <!-- CLICKABLE PROFIT AREA -->
                <div class="relative z-10 flex flex-col items-center justify-center py-2 cursor-pointer active:scale-95 transition-transform duration-200" onclick="copyToClipboard('finalProfit')" title="Click to Copy">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] mb-3 flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full border border-white/5">
                        Net Profit Estimate <i data-lucide="copy" class="w-3 h-3 ml-1 opacity-50"></i>
                    </span>
                    
                    <div class="flex items-start gap-2">
                        <span class="text-sm text-slate-500 font-bold mt-3 md:mt-4">Ks</span>
                        <span id="finalProfit" class="text-5xl md:text-6xl font-black tracking-tighter text-white font-mono drop-shadow-lg transition-all duration-300">0</span>
                    </div>
                </div>
                
                <!-- Settings Bar -->
                <div class="mt-6 flex flex-col sm:flex-row items-center gap-3 pt-4 border-t border-white/5 relative z-20">
                    <div class="flex-1 w-full bg-black/20 rounded-xl p-2 flex items-center justify-between border border-white/5">
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 rounded-lg bg-cyan-500/10 text-cyan-400"><i data-lucide="percent" class="w-3 h-3"></i></div>
                            <span class="text-[10px] text-slate-400 font-bold uppercase">Commission</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <input type="number" id="commissionRate" value="13" class="w-12 bg-transparent text-right font-mono font-bold text-white text-sm outline-none focus:text-cyan-400 transition-colors">
                            <span class="text-xs text-slate-600 font-bold">%</span>
                        </div>
                    </div>
                    <div class="flex-1 w-full bg-black/20 rounded-xl p-2 flex items-center justify-between border border-white/5">
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 rounded-lg bg-rose-500/10 text-rose-400"><i data-lucide="x" class="w-3 h-3"></i></div>
                            <span class="text-[10px] text-slate-400 font-bold uppercase">Payout Ratio</span>
                        </div>
                        <input type="number" id="payoutRatio" value="80" class="w-16 bg-transparent text-right font-mono font-bold text-white text-sm outline-none focus:text-rose-400 transition-colors">
                    </div>
                </div>
            </div>

            <!-- INPUT LIST -->
            <div id="daysContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- JS Renders Inputs Here -->
            </div>

            <!-- ACTION BUTTONS -->
            <div class="grid grid-cols-3 gap-3 pt-2">
                <button onclick="openPasteModal()" class="py-3 rounded-xl border border-emerald-500/20 bg-emerald-500/5 text-emerald-400 font-bold text-xs uppercase tracking-wider hover:bg-emerald-500/10 transition-colors flex items-center justify-center gap-2 active:scale-95">
                    <i data-lucide="clipboard-paste" class="w-4 h-4"></i> Paste
                </button>
                
                <button onclick="openResetModal()" class="py-3 rounded-xl border border-rose-500/20 bg-rose-500/5 text-rose-400 font-bold text-xs uppercase tracking-wider hover:bg-rose-500/10 transition-colors flex items-center justify-center gap-2 active:scale-95">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset
                </button>
                
                <button onclick="exportReport()" class="py-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold text-xs uppercase tracking-wider hover:from-cyan-500 hover:to-blue-500 transition-colors flex items-center justify-center gap-2 active:scale-95 shadow-lg shadow-cyan-900/10">
                    <i data-lucide="download" class="w-4 h-4"></i> Export
                </button>
            </div>
            
            <div class="text-center pb-8 pt-4">
                <p class="text-[10px] text-slate-600 font-mono uppercase tracking-widest">v3.2 Lite</p>
            </div>
        </div>

    </main>

    <!-- CUSTOM PASTE MODAL -->
    <div id="pasteModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/90 backdrop-blur-sm p-4 animate-fade-in">
        <div class="glass-panel max-w-lg w-full rounded-2xl p-6 border border-white/10 shadow-xl transform scale-100 transition-all relative">
            <div class="text-center">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-500 flex items-center justify-center mx-auto mb-3 border border-emerald-500/20">
                    <i data-lucide="clipboard-paste" class="w-5 h-5"></i>
                </div>
                <h3 class="text-base font-bold text-white mb-2">Smart Data Import</h3>
                <p class="text-slate-400 text-xs mb-4">
                    Paste data format: "1. 62850 P 800" or just "62850 P 800"
                </p>
                
                <textarea id="pasteArea" class="w-full h-32 bg-black/40 border border-white/10 rounded-xl p-3 text-white font-mono text-sm focus:outline-none focus:border-emerald-500/50 mb-4 resize-none" placeholder="1. 62850 P.800..."></textarea>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="closePasteModal()" class="py-2.5 rounded-lg border border-white/10 bg-white/5 text-slate-300 font-bold text-xs">
                        Cancel
                    </button>
                    <button onclick="processPaste()" class="py-2.5 rounded-lg bg-emerald-600 text-white font-bold text-xs shadow-md">
                        Process Data
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CUSTOM RESET MODAL -->
    <div id="resetConfirmModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/90 backdrop-blur-sm p-4 animate-fade-in">
        <div class="glass-panel max-w-sm w-full rounded-2xl p-6 border border-white/10 shadow-xl transform scale-100 transition-all relative">
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center mx-auto mb-3 border border-rose-500/20">
                    <i data-lucide="trash-2" class="w-6 h-6"></i>
                </div>
                <h3 class="text-base font-bold text-white mb-2">Clear All Data?</h3>
                <p class="text-slate-400 text-xs mb-6 px-4">
                    This action cannot be undone.
                </p>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="closeResetModal()" class="py-2.5 rounded-lg border border-white/10 bg-white/5 text-slate-300 font-bold text-xs">
                        Cancel
                    </button>
                    <button onclick="executeReset()" class="py-2.5 rounded-lg bg-rose-600 text-white font-bold text-xs shadow-md">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[70] hidden pointer-events-none">
        <div class="glass-panel px-4 py-2 rounded-full border border-white/10 shadow-xl flex items-center gap-3 backdrop-blur-xl">
            <div class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <i data-lucide="check" class="w-3 h-3"></i>
            </div>
            <span class="text-xs font-bold text-white tracking-wide" id="toast-message">Copied!</span>
        </div>
    </div>
