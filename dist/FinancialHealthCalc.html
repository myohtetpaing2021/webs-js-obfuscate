    <style>
        /* Base Reset & Optimization */
        :root {
            color-scheme: dark;
        }
        
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevent bounce effect */
        }

        /* Hardware Accelerated Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px); /* Reduced blur for performance */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transform: translateZ(0); /* Force GPU */
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        background-color 0.3s ease, 
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
            transform: translateZ(0); /* Force GPU */
            will-change: transform;
        }

        .glass-card:active {
            transform: scale(0.98);
        }

        @media (hover: hover) {
            .glass-card:hover {
                transform: translateY(-2px);
                border-color: rgba(255, 255, 255, 0.1);
                background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.6) 100%);
                box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            }
        }

        /* Optimized Inputs */
        input[type=number] {
            -moz-appearance: textfield;
            appearance: none;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .input-field {
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .input-field:focus {
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
            border-color: rgba(6, 182, 212, 0.5);
            background: rgba(30, 41, 59, 0.9);
        }

        /* Safe Areas for Mobile */
        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: env(safe-area-inset-top); }

        /* Typography */
        .text-glow { text-shadow: 0 0 20px rgba(6, 182, 212, 0.4); }
        .text-glow-emerald { text-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Preloader Animation */
        .loader-ring {
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
