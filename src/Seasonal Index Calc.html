<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seasonal Sales Target Calculator - Neo Glass</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Padauk', 'sans-serif'],
                        num: ['Inter', 'sans-serif'],
                        tech: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        neo: {
                            bg: '#050505',
                            card: 'rgba(20, 20, 25, 0.6)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            primary: '#00f2ff',   // Electric Cyan
                            secondary: '#7000ff', // Deep Violet
                            accent: '#ff0055',    // Neon Pink
                            success: '#00ff9d',   // Matrix Green
                            text: '#e2e8f0',
                            muted: '#94a3b8'
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 242, 255, 0.15)',
                        'glow-accent': '0 0 20px rgba(255, 0, 85, 0.15)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.36)',
                    },
                    animation: {
                        'orb-float': 'orbFloat 10s ease-in-out infinite',
                        'orb-float-delayed': 'orbFloat 12s ease-in-out infinite reverse',
                        'pulse-glow': 'pulseGlow 3s infinite',
                        'slide-up-fade': 'slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        orbFloat: {
                            '0%, 100%': { transform: 'translate(0, 0)' },
                            '50%': { transform: 'translate(20px, -20px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.6 },
                            '50%': { opacity: 1 },
                        },
                        slideUpFade: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020203;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Animated Background Mesh */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.08), transparent 25%);
            pointer-events: none;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--neo-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--neo-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Tech Input */
        .input-neo {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .input-neo:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            outline: none;
        }

        /* Neo Button */
        .btn-neo {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .btn-neo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: width 0.3s ease;
            z-index: -1;
        }
        .btn-neo:hover::before { width: 100%; }
        .btn-neo:active { transform: scale(0.98); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2ff; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .text-glow { text-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
    </style>
</head>
<body class="antialiased min-h-screen pb-20 selection:bg-neo-primary/30 selection:text-white">

    <!-- Background Ambience -->
    <div class="bg-mesh"></div>
    <div class="orb w-96 h-96 bg-neo-primary/20 top-[-10%] left-[-10%] animate-orb-float"></div>
    <div class="orb w-[500px] h-[500px] bg-neo-secondary/20 bottom-[-10%] right-[-10%] animate-orb-float-delayed"></div>

    <!-- Preloader -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020203] flex flex-col items-center justify-center transition-all duration-700">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-t-2 border-neo-primary rounded-full animate-spin shadow-glow"></div>
            <div class="absolute inset-3 border-r-2 border-neo-secondary rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 2s;"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="cpu" class="w-8 h-8 text-neo-primary animate-pulse"></i>
            </div>
        </div>
        <div class="text-sm font-tech tracking-[0.5em] text-neo-primary/80 animate-pulse">SYSTEM LOADING</div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 z-[90] hidden items-center justify-center bg-black/80 backdrop-blur-md px-4 opacity-0 transition-opacity duration-300">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 text-center transform scale-95 transition-all duration-300 border-neo-accent/30 shadow-glow-accent">
            <div class="w-16 h-16 bg-neo-accent/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-neo-accent/30">
                <i data-lucide="alert-octagon" class="w-8 h-8 text-neo-accent animate-pulse"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2 font-tech tracking-wide">CONFIRM WIPE</h3>
            <p class="text-sm text-neo-muted mb-6 font-sans">Data အားလုံး ဖျက်ပစ်မှာ သေချာပါသလား?</p>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 rounded-xl border border-white/10 hover:bg-white/5 text-gray-300 font-bold transition-all text-sm">CANCEL</button>
                <button onclick="executeReset()" class="flex-1 py-3 rounded-xl bg-neo-accent hover:bg-red-600 text-white font-bold transition-all shadow-lg shadow-neo-accent/20 text-sm">WIPE DATA</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[95] hidden transition-all duration-300">
        <div class="glass-card px-6 py-3 rounded-full flex items-center gap-3 border border-neo-success/30 shadow-glow">
            <div class="w-2 h-2 rounded-full bg-neo-success animate-pulse"></div>
            <span class="text-sm font-bold text-white font-tech tracking-wide" id="toastMessage">ACTION COMPLETED</span>
        </div>
    </div>

    <!-- App Container -->
    <main class="container mx-auto px-4 py-8 max-w-7xl relative z-10">
        
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-6 animate-slide-up-fade">
            <div class="flex items-center gap-5 group">
                <div class="w-14 h-14 bg-gradient-to-br from-gray-900 to-black rounded-2xl flex items-center justify-center border border-neo-primary/30 shadow-glow group-hover:scale-105 transition-transform duration-500">
                    <i data-lucide="bar-chart-big" class="w-7 h-7 text-neo-primary"></i>
                </div>
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-white font-tech tracking-wide">SEASONAL <span class="text-neo-primary text-glow">INDEX</span></h1>
                    <p class="text-xs text-neo-muted font-tech tracking-[0.2em] uppercase mt-1">Sales Intelligence System v4.0</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="glass-card px-4 py-2 rounded-full flex items-center gap-2">
                    <i data-lucide="calendar" class="w-4 h-4 text-neo-secondary"></i>
                    <span id="currentDate" class="text-xs font-bold text-gray-300 font-num"></span>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 animate-slide-up-fade" style="animation-delay: 0.1s;">
            
            <!-- LEFT PANEL -->
            <div class="xl:col-span-8 space-y-6">
                
                <!-- Controls -->
                <div class="glass-card rounded-3xl p-6 md:p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-neo-primary/5 rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                    
                    <div class="flex flex-col lg:flex-row gap-8 items-end relative z-10">
                        <!-- Input -->
                        <div class="w-full lg:w-5/12">
                            <label class="text-xs font-bold text-neo-primary mb-3 block tracking-widest uppercase font-tech flex items-center gap-2">
                                <i data-lucide="target" class="w-3 h-3"></i> Annual Target
                            </label>
                            <div class="relative group">
                                <input type="number" id="annualTarget" value="3000" 
                                    class="input-neo w-full rounded-2xl py-4 px-5 text-xl font-bold font-num placeholder-gray-600"
                                    placeholder="0">
                                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 text-xs font-bold font-tech tracking-wider">MMK</span>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="w-full lg:w-7/12 grid grid-cols-2 sm:flex sm:flex-wrap gap-3 justify-end">
                            <button onclick="fillSampleData()" class="btn-neo py-3 px-5 rounded-xl border border-white/10 text-gray-400 hover:text-white hover:border-white/30 font-bold text-xs flex items-center justify-center gap-2">
                                <i data-lucide="database" class="w-4 h-4"></i> Sample
                            </button>
                            
                            <button onclick="openResetModal()" class="btn-neo py-3 px-5 rounded-xl border border-white/10 hover:border-neo-accent/50 text-gray-400 hover:text-neo-accent font-bold text-xs flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                            </button>

                            <button onclick="calculateTargets()" class="col-span-2 sm:w-auto py-3 px-8 rounded-xl bg-gradient-to-r from-neo-primary to-blue-600 text-black font-bold text-sm shadow-glow hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="calculator" class="w-4 h-4"></i> CALCULATE
                            </button>
                            
                             <button onclick="exportReport()" class="col-span-2 sm:col-span-1 sm:w-auto py-3 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-neo-success font-bold flex items-center justify-center transition-all">
                                <i data-lucide="download" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="glass-card rounded-3xl flex flex-col min-h-[400px]">
                    <div class="p-5 border-b border-white/5 flex items-center justify-between bg-black/20">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-neo-secondary/20">
                                <i data-lucide="table-2" class="w-4 h-4 text-neo-secondary"></i>
                            </div>
                            <h3 class="text-sm font-bold text-white font-tech tracking-wider">
                                DATA INPUT (<span id="yearCountDisplay" class="text-neo-primary">3</span> YRS)
                            </h3>
                        </div>
                        <button onclick="addYear()" class="text-xs px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded-lg font-bold border border-white/10 flex items-center gap-2 transition-all active:scale-95">
                            <i data-lucide="plus" class="w-3 h-3"></i> ADD YEAR
                        </button>
                    </div>
                    
                    <div class="overflow-auto flex-1 custom-scrollbar">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead class="bg-[#0a0a0f] text-gray-500 text-[10px] font-bold tracking-[0.15em] sticky top-0 z-20 shadow-lg backdrop-blur-md">
                                <tr id="tableHeaderRow">
                                    <!-- JS Generated -->
                                </tr>
                            </thead>
                            <tbody id="inputTableBody" class="divide-y divide-white/5">
                                <!-- JS Generated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="xl:col-span-4 space-y-6">
                
                <!-- Chart -->
                <div class="glass-card p-6 rounded-3xl relative">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xs font-bold text-neo-muted font-tech tracking-[0.2em] uppercase">Trends Analysis</h3>
                        <div class="flex items-center gap-2 px-2 py-1 rounded bg-neo-primary/10 border border-neo-primary/20">
                            <span class="w-1.5 h-1.5 rounded-full bg-neo-primary animate-pulse"></span>
                            <span class="text-[10px] text-neo-primary font-bold">LIVE</span>
                        </div>
                    </div>
                    <div class="h-[220px] w-full">
                        <canvas id="seasonalChart"></canvas>
                    </div>
                </div>

                <!-- KPI Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-20 h-20 bg-neo-secondary/20 rounded-full blur-2xl group-hover:bg-neo-secondary/30 transition-all"></div>
                        <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-1">Avg Demand</p>
                        <h3 class="text-2xl font-bold text-white font-num tracking-tight group-hover:scale-105 transition-transform origin-left" id="grandAverageDisplay">0</h3>
                    </div>
                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-20 h-20 bg-neo-success/20 rounded-full blur-2xl group-hover:bg-neo-success/30 transition-all"></div>
                        <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-1">Base Target</p>
                        <h3 class="text-2xl font-bold text-white font-num tracking-tight group-hover:scale-105 transition-transform origin-left" id="baseTargetDisplay">0</h3>
                    </div>
                </div>

                <!-- Results List -->
                <div id="resultSection" class="glass-card rounded-3xl border-t-2 border-t-neo-success opacity-0 transition-all duration-700 transform translate-y-4">
                    <div class="p-4 bg-neo-success/10 flex items-center justify-between border-b border-white/5">
                        <h3 class="text-xs font-bold text-white font-tech tracking-[0.2em]">CALCULATION RESULTS</h3>
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-neo-success"></i>
                    </div>
                    
                    <div class="max-h-[350px] overflow-y-auto custom-scrollbar">
                        <div id="resultListView" class="divide-y divide-white/5">
                            <!-- JS Generated -->
                        </div>
                    </div>
                    
                    <div class="p-4 bg-black/30 border-t border-white/10 flex justify-between items-center">
                        <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">Annual Total</span>
                        <span class="font-bold text-neo-success font-num text-lg" id="totalTargetCheck">0</span>
                    </div>
                </div>

            </div>

        </div>

        <footer class="mt-12 text-center pb-8 border-t border-white/5 pt-8">
            <p class="text-[10px] text-gray-600 font-tech tracking-[0.3em]">SECURE SYSTEM • V4.0</p>
        </footer>

    </main>

    <script>
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const monthsFull = [
            "Jan (ဇန်)", "Feb (ဖေ)", "Mar (မတ်)", "Apr (ဧပြီ)", "May (မေ)", "Jun (ဇွန်)", 
            "Jul (ဇူ)", "Aug (သြ)", "Sep (စက်)", "Oct (အောက်)", "Nov (နို)", "Dec (ဒီ)"
        ];

        const sampleData = {
            y1: [100, 90, 110, 120, 200, 350, 400, 380, 250, 150, 120, 110],
            y2: [110, 95, 115, 130, 220, 370, 420, 390, 260, 160, 125, 115],
            y3: [105, 100, 120, 140, 240, 390, 450, 410, 270, 170, 130, 120]
        };

        let chartInstance = null;
        let isCalculated = false;
        let yearCount = 3;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB');
            
            // Preloader fade out
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                preloader.style.opacity = '0';
                preloader.style.pointerEvents = 'none';
                setTimeout(() => preloader.remove(), 700);
            }, 800);

            renderTable();
            renderChart([], []);
        });

        // --- Logic ---
        function getTableState() {
            let headers = [];
            let values = [];
            for(let y=1; y<=yearCount; y++) {
                const headerInput = document.getElementById(`header_y${y}`);
                headers.push(headerInput ? headerInput.value : `Y${y}`);
            }
            for(let m=0; m<12; m++) {
                let rowValues = [];
                for(let y=1; y<=yearCount; y++) {
                    const input = document.getElementById(`y${y}_${m}`);
                    rowValues.push(input ? input.value : '');
                }
                values.push(rowValues);
            }
            return { headers, values };
        }

        function renderTable(preservedState = null) {
            const theadRow = document.getElementById('tableHeaderRow');
            const tbody = document.getElementById('inputTableBody');
            document.getElementById('yearCountDisplay').innerText = yearCount;

            // Headers
            let headerHtml = `<th class="py-4 px-4 text-left min-w-[100px] text-gray-500 bg-[#0a0a0f] sticky left-0 z-20 shadow-[4px_0_12px_rgba(0,0,0,0.5)] border-b border-white/5">MONTH</th>`;
            const colors = ['text-neo-primary', 'text-neo-secondary', 'text-neo-success', 'text-neo-accent', 'text-yellow-400'];

            for (let y = 1; y <= yearCount; y++) {
                const colorClass = colors[(y-1) % colors.length];
                const headerValue = preservedState && preservedState.headers[y-1] ? preservedState.headers[y-1] : `Y${y}`;
                
                headerHtml += `
                    <th class="py-2 px-2 text-center min-w-[90px] border-b border-white/5">
                        <input type="text" id="header_y${y}" value="${headerValue}" 
                            class="w-full bg-transparent text-center ${colorClass} font-bold font-tech text-sm uppercase tracking-wider focus:outline-none focus:border-b focus:border-white/30 transition-all placeholder-white/10">
                    </th>
                `;
            }
            theadRow.innerHTML = headerHtml;

            // Body
            let bodyHtml = '';
            monthsFull.forEach((month, mIndex) => {
                let rowCells = `<td class="py-3 px-4 border-b border-white/5 font-medium text-gray-400 text-sm sticky left-0 bg-[#08080c] z-10 shadow-[4px_0_12px_rgba(0,0,0,0.5)] font-sans">${month}</td>`;
                
                for (let y = 1; y <= yearCount; y++) {
                    const value = preservedState && preservedState.values[mIndex] && preservedState.values[mIndex][y-1] 
                                  ? preservedState.values[mIndex][y-1] : '';
                    
                    rowCells += `
                        <td class="py-2 px-2 border-b border-white/5">
                            <input type="number" id="y${y}_${mIndex}" value="${value}" 
                                class="input-neo w-full py-2.5 px-3 rounded-lg text-right font-num text-sm placeholder-gray-700" placeholder="-">
                        </td>
                    `;
                }
                bodyHtml += `<tr class="hover:bg-white/[0.02] transition-colors group">${rowCells}</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        function addYear() {
            const state = getTableState();
            yearCount++;
            renderTable(state);
            showToast(`YEAR ${yearCount} DATABASE INITIALIZED`);
        }

        function fillSampleData() {
            for(let i=0; i<12; i++) {
                const y1 = document.getElementById(`y1_${i}`);
                if(y1) y1.value = sampleData.y1[i];
                const y2 = document.getElementById(`y2_${i}`);
                if(y2) y2.value = sampleData.y2[i];
                const y3 = document.getElementById(`y3_${i}`);
                if(y3) y3.value = sampleData.y3[i];
            }
            document.getElementById('annualTarget').value = 4000;
            
            // Ripple Effect
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach((input, i) => {
                if(input.value) {
                    setTimeout(() => {
                        input.style.borderColor = '#00f2ff';
                        input.style.boxShadow = '0 0 10px rgba(0,242,255,0.2)';
                        setTimeout(() => {
                            input.style.borderColor = '';
                            input.style.boxShadow = '';
                        }, 400);
                    }, i * 10);
                }
            });
            
            calculateTargets();
            showToast("SAMPLE DATA LOADED");
        }

        function openResetModal() {
            const m = document.getElementById('confirmModal');
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.remove('opacity-0'); m.querySelector('div').classList.remove('scale-95'); }, 10);
        }
        function closeResetModal() {
            const m = document.getElementById('confirmModal');
            m.classList.add('opacity-0');
            m.querySelector('div').classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        }
        function executeReset() {
            closeResetModal();
            yearCount = 3;
            renderTable();
            document.getElementById('annualTarget').value = '3000';
            document.getElementById('grandAverageDisplay').innerText = '0';
            document.getElementById('baseTargetDisplay').innerText = '0';
            document.getElementById('resultListView').innerHTML = '';
            document.getElementById('totalTargetCheck').innerText = '0';
            
            const rs = document.getElementById('resultSection');
            rs.classList.remove('translate-y-0', 'opacity-100');
            rs.classList.add('translate-y-4', 'opacity-0');

            renderChart([], []);
            isCalculated = false;
            showToast("SYSTEM WIPED");
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = message;
            
            toast.classList.remove('hidden');
            toast.classList.add('top-6');
            
            setTimeout(() => {
                toast.classList.remove('top-6');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        function calculateTargets() {
            const annualTarget = parseFloat(document.getElementById('annualTarget').value) || 0;
            let avgDemands = [];
            let totalAvgDemand = 0;

            for(let i=0; i<12; i++) {
                let sum = 0;
                for(let y=1; y<=yearCount; y++) {
                    const val = parseFloat(document.getElementById(`y${y}_${i}`).value);
                    if (!isNaN(val)) sum += val;
                }
                const avg = sum / yearCount;
                avgDemands.push(avg);
                totalAvgDemand += avg;
            }

            const grandAverage = totalAvgDemand / 12;

            animateNum("grandAverageDisplay", grandAverage);
            animateNum("baseTargetDisplay", annualTarget / 12);

            const resultList = document.getElementById('resultListView');
            let listHtml = '';
            let indices = [];
            let targets = [];
            let checkTotalTarget = 0;

            monthsFull.forEach((month, i) => {
                let seasonalIndex = grandAverage === 0 ? 0 : (avgDemands[i] / grandAverage);
                let monthlyTarget = (annualTarget / 12) * seasonalIndex;
                
                indices.push(seasonalIndex);
                targets.push(monthlyTarget);
                checkTotalTarget += monthlyTarget;

                // Index color logic
                let indexColor = seasonalIndex >= 1.1 ? 'text-neo-success' : (seasonalIndex <= 0.9 ? 'text-neo-accent' : 'text-gray-500');
                
                listHtml += `
                    <div class="p-4 hover:bg-white/[0.02] transition-colors flex items-center justify-between group cursor-default">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-lg bg-[#0a0a0f] border border-white/5 flex items-center justify-center font-bold text-gray-400 text-xs shadow-inner">
                                ${months[i]}
                            </div>
                            <div>
                                <div class="text-[10px] text-gray-500 uppercase tracking-wider font-tech">Index</div>
                                <div class="font-mono text-sm font-bold ${indexColor}">${seasonalIndex.toFixed(3)}</div>
                            </div>
                        </div>
                        <div class="text-right">
                             <div class="text-[10px] text-gray-500 uppercase tracking-wider font-tech">Target</div>
                             <div class="font-num font-bold text-lg text-white group-hover:text-neo-primary transition-colors text-glow">
                                ${Math.round(monthlyTarget).toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;
            });

            resultList.innerHTML = listHtml;
            animateNum("totalTargetCheck", checkTotalTarget);
            
            const rs = document.getElementById('resultSection');
            rs.classList.remove('translate-y-4', 'opacity-0');
            rs.classList.add('translate-y-0', 'opacity-100');
            
            renderChart(indices, targets);
            isCalculated = true;
            showToast("CALCULATION COMPLETE");
        }

        function exportReport() {
            if (!isCalculated) { showToast("NO DATA AVAILABLE"); return; }
            
            const annualTarget = document.getElementById('annualTarget').value;
            const date = new Date().toLocaleDateString('en-GB');

            let content = `SEASONAL SALES TARGET REPORT [SECURE EXPORT]\n`;
            content += `Date: ${date} | Target: ${annualTarget} Ks\n`;
            content += `--------------------------------------------------\n`;
            content += `Month   | Index   | Target Sales\n`;
            content += `--------|---------|--------------\n`;

            // Simple re-calc for text gen to avoid DOM scraping issues
             let avgDemands = [];
            let totalAvgDemand = 0;
            for(let i=0; i<12; i++) {
                let sum = 0;
                for(let y=1; y<=yearCount; y++) {
                    const val = parseFloat(document.getElementById(`y${y}_${i}`).value);
                    if (!isNaN(val)) sum += val;
                }
                avgDemands.push(sum / yearCount);
                totalAvgDemand += (sum/yearCount);
            }
            const grandAverage = totalAvgDemand / 12;

            months.forEach((m, i) => {
                 let sIndex = grandAverage === 0 ? 0 : (avgDemands[i] / grandAverage);
                 let mTarget = (annualTarget / 12) * sIndex;
                 content += `${m.padEnd(8)}| ${sIndex.toFixed(3).padEnd(8)}| ${Math.round(mTarget).toLocaleString()}\n`;
            });
            content += `--------------------------------------------------\n`;
            content += `Total Check: ${document.getElementById('totalTargetCheck').innerText} Ks\n`;

            const blob = new Blob([content], {type: 'text/plain'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `TargetReport_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
            showToast("REPORT DOWNLOADED");
        }

        function animateNum(id, endValue) {
            const el = document.getElementById(id);
            const start = parseFloat(el.innerText.replace(/,/g, '')) || 0;
            const duration = 1500;
            let startTime = null;
            
            const step = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const current = start + (endValue - start) * (1 - Math.pow(1 - progress, 5));
                el.innerText = current.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function renderChart(indices, targets) {
            const ctx = document.getElementById('seasonalChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            Chart.defaults.font.family = 'Rajdhani';
            Chart.defaults.color = '#64748b';

            // Neo Gradient
            let gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(0, 242, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 242, 255, 0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Index',
                        data: indices,
                        borderColor: '#00f2ff',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#000',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 8,
                        pointHoverBackgroundColor: '#00f2ff',
                        pointHoverBorderColor: '#fff',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 2000, easing: 'easeOutQuart' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(5, 5, 5, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#00f2ff',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            cornerRadius: 12,
                            callbacks: {
                                label: function(context) { return `INDEX: ${context.raw.toFixed(3)}`; }
                            }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { font: { size: 11, family: 'Inter' } },
                            beginAtZero: false
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 12, weight: 'bold' } }
                        }
                    }
                }
            });
        }
    </script>
</body>
