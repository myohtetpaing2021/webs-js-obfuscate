<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Gearing Ratio Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Padauk', 'Plus Jakarta Sans', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Premium Dark Gradient Mesh */
        .bg-midnight-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(244, 63, 94, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Dark Glass Card */
        .glass-card-dark {
            background: rgba(30, 41, 59, 0.4); /* Slate 800 with opacity */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card-dark:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        /* Custom Range Slider (Dark Mode) */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #0f172a; /* Slate 900 */
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            border: 2px solid currentColor;
            cursor: pointer;
            margin-top: -8px;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            border-radius: 999px;
            background: #334155; /* Slate 700 */
        }

        /* Remove default number input spin buttons (Increase/Decrease Arrows) */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Chart Animation & Glow */
        .chart-circle {
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            filter: drop-shadow(0 0 4px currentColor);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .input-number-dark {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        .input-number-dark:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-midnight-mesh">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        // Lucide Icon Helper
        const Icon = ({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    ref.current.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: { width: size, height: size, class: className, "stroke-width": 2 }
                    });
                }
            }, [name, size, className]);
            return <span ref={ref} className="inline-flex items-center justify-center"></span>;
        };

        // Glowing Donut Chart
        const DonutChart = ({ value, total, colorClass, size = 160 }) => {
            const radius = 40;
            const circumference = 2 * Math.PI * radius;
            const percent = total > 0 ? (value / total) : 0;
            const offset = circumference - (percent * circumference);
            const strokeColor = colorClass.includes('rose') ? '#f43f5e' : '#10b981'; 

            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg width="100%" height="100%" viewBox="0 0 100 100">
                        {/* Background Track */}
                        <circle cx="50" cy="50" r={radius} fill="transparent" stroke="#1e293b" strokeWidth="6" />
                        {/* Value Path */}
                        <circle cx="50" cy="50" r={radius} fill="transparent" stroke={strokeColor} strokeWidth="6"
                                strokeDasharray={circumference}
                                strokeDashoffset={offset}
                                strokeLinecap="round"
                                className="chart-circle" 
                                style={{color: strokeColor}} />
                    </svg>
                    <div className="absolute flex flex-col items-center">
                        <span className="text-3xl font-bold text-white tracking-tighter shadow-black drop-shadow-lg">
                            {(percent * 100).toFixed(0)}<span className="text-sm text-slate-400">%</span>
                        </span>
                    </div>
                </div>
            );
        };

        // Input Control Component
        const InputGroup = ({ label, value, onChange, min, max, theme, icon }) => {
            const isRose = theme === 'rose';
            const accentColor = isRose ? 'text-rose-400' : 'text-emerald-400';
            const iconBg = isRose ? 'bg-rose-500/10' : 'bg-emerald-500/10';
            const sliderColor = isRose ? '#fb7185' : '#34d399';

            return (
                <div className="glass-card-dark p-5 rounded-2xl group relative overflow-hidden">
                    <div className={`absolute -right-10 -top-10 w-24 h-24 rounded-full blur-3xl opacity-0 group-hover:opacity-20 transition-opacity duration-500 ${isRose ? 'bg-rose-500' : 'bg-emerald-500'}`}></div>

                    <div className="flex justify-between items-start mb-4 relative z-10">
                        <div className="flex items-center gap-3">
                            <div className={`p-2.5 rounded-xl ${iconBg} ${accentColor} border border-white/5`}>
                                <Icon name={icon} size={20} />
                            </div>
                            <span className="text-sm font-bold text-slate-300 uppercase tracking-wide">{label}</span>
                        </div>
                        <div className="text-right">
                             <span className={`block text-lg font-bold font-mono ${accentColor}`}>
                                {Number(value).toLocaleString()}
                            </span>
                             <span className="text-[10px] text-slate-500 font-bold">MMK</span>
                        </div>
                    </div>

                    <input 
                        type="range" min={min} max={max} step="100" value={value} onChange={onChange}
                        className="w-full h-2 mb-4 rounded-lg appearance-none cursor-pointer"
                        style={{color: sliderColor}}
                    />

                    <div className="relative z-10">
                        <input
                            type="number"
                            value={value}
                            onChange={onChange}
                            className="w-full input-number-dark rounded-xl px-4 py-2.5 text-sm font-semibold transition-all outline-none"
                        />
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [longTermDebt, setLongTermDebt] = useState(1000);
            const [shortTermDebt, setShortTermDebt] = useState(500);
            const [ownerEquity, setOwnerEquity] = useState(500);
            const [shareholderEquity, setShareholderEquity] = useState(500);

            const totalDebt = parseFloat(longTermDebt || 0) + parseFloat(shortTermDebt || 0);
            const totalEquity = parseFloat(ownerEquity || 0) + parseFloat(shareholderEquity || 0);
            const totalCapital = totalDebt + totalEquity;
            const ratio1 = totalEquity > 0 ? (totalDebt / totalEquity).toFixed(2) : 0;

            const getAnalysis = () => {
                if (ratio1 > 1) {
                    return {
                        status: "High Risk",
                        color: "rose",
                        bg: "bg-rose-500",
                        text: "text-rose-400",
                        border: "border-rose-500/30",
                        icon: "AlertTriangle",
                        desc: "Equity ထက် အကြွေးပမာဏ များပြားနေပါသည်။"
                    };
                } else if (ratio1 > 0.5) {
                    return {
                        status: "Moderate",
                        color: "amber",
                        bg: "bg-amber-500",
                        text: "text-amber-400",
                        border: "border-amber-500/30",
                        icon: "Scale",
                        desc: "အကြွေးနှင့် Equity အချိုးအစား မျှတပါသည်။"
                    };
                } else {
                    return {
                        status: "Low Risk",
                        color: "emerald",
                        bg: "bg-emerald-500",
                        text: "text-emerald-400",
                        border: "border-emerald-500/30",
                        icon: "ShieldCheck",
                        desc: "ဘဏ္ဍာရေး အခြေအနေ ခိုင်မာမှုရှိပါသည်။"
                    };
                }
            };

            const analysis = getAnalysis();

            const handleExport = () => {
                const date = new Date().toLocaleDateString();
                const reportContent = `
GEARING RATIO ANALYSIS REPORT
Date: ${date}
----------------------------------------

[ FINANCIAL INPUTS ]

LIABILITIES (DEBT)
- Long Term Debt:    ${Number(longTermDebt).toLocaleString()} MMK
- Short Term Debt:   ${Number(shortTermDebt).toLocaleString()} MMK
> TOTAL DEBT:        ${totalDebt.toLocaleString()} MMK

EQUITY (OWNERSHIP)
- Owner's Equity:      ${Number(ownerEquity).toLocaleString()} MMK
- Shareholder's Equity: ${Number(shareholderEquity).toLocaleString()} MMK
> TOTAL EQUITY:         ${totalEquity.toLocaleString()} MMK

----------------------------------------

[ ANALYSIS RESULTS ]

GEARING RATIO (Debt/Equity):  ${ratio1}x
RISK ASSESSMENT:              ${analysis.status}
DESCRIPTION:                  ${analysis.desc}

DEBT RATIO (Debt/Capital):    ${totalCapital > 0 ? ((totalDebt/totalCapital)*100).toFixed(0) : 0}% of Total Assets

----------------------------------------
Generated by Premium Gearing Ratio Dashboard
`.trim();

                const blob = new Blob([reportContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Gearing_Ratio_Report_${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            return (
                <div className="max-w-[1600px] mx-auto p-4 lg:p-8">
                    
                    {/* Navbar / Header */}
                    <nav className="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                <Icon name="BarChart3" size={24} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">
                                    Gearing Ratio <span className="text-indigo-400">Pro</span>
                                </h1>
                                <p className="text-slate-400 text-xs font-medium tracking-wide">FINANCIAL ANALYSIS DASHBOARD</p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button 
                                onClick={handleExport}
                                className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full text-sm font-bold shadow-lg shadow-indigo-500/30 flex items-center gap-2 transition cursor-pointer"
                            >
                                <Icon name="Download" size={16} /> Export Report
                            </button>
                        </div>
                    </nav>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        
                        {/* LEFT COLUMN: Inputs */}
                        <div className="lg:col-span-8 space-y-8">
                            
                            {/* Mobile Summary Card (Dark Mode) */}
                            <div className="lg:hidden bg-slate-800/50 backdrop-blur-md border border-white/10 rounded-3xl p-6 shadow-xl mb-6 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl translate-x-1/2 -translate-y-1/2"></div>
                                <div className="flex justify-between items-center relative z-10">
                                    <div>
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Current Ratio</p>
                                        <div className="text-4xl font-bold text-white">{ratio1} <span className="text-lg text-slate-500">x</span></div>
                                    </div>
                                    <div className={`px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 border ${analysis.border} ${analysis.text} flex items-center gap-2`}>
                                        <div className={`w-2 h-2 rounded-full ${analysis.bg} animate-pulse`}></div>
                                        {analysis.status}
                                    </div>
                                </div>
                            </div>

                            {/* Debt Section */}
                            <section>
                                <div className="flex items-center justify-between mb-4 px-2">
                                    <h3 className="text-lg font-bold text-slate-200 flex items-center gap-2">
                                        Liabilities (အကြွေး)
                                    </h3>
                                    <span className="text-rose-400 font-bold bg-rose-500/10 px-3 py-1 rounded-lg text-sm border border-rose-500/20">
                                        {totalDebt.toLocaleString()}
                                    </span>
                                </div>
                                <div className="grid md:grid-cols-2 gap-5">
                                    <InputGroup 
                                        label="Long Term Debt" value={longTermDebt} onChange={e => setLongTermDebt(e.target.value)}
                                        min="0" max="10000" theme="rose" icon="CalendarClock"
                                    />
                                    <InputGroup 
                                        label="Short Term Debt" value={shortTermDebt} onChange={e => setShortTermDebt(e.target.value)}
                                        min="0" max="5000" theme="rose" icon="Hourglass"
                                    />
                                </div>
                            </section>

                            {/* Equity Section */}
                            <section>
                                <div className="flex items-center justify-between mb-4 px-2">
                                    <h3 className="text-lg font-bold text-slate-200 flex items-center gap-2">
                                        <Icon name="PieChart" className="text-emerald-400" /> Equity (ပိုင်ဆိုင်မှု)
                                    </h3>
                                    <span className="text-emerald-400 font-bold bg-emerald-500/10 px-3 py-1 rounded-lg text-sm border border-emerald-500/20">
                                        {totalEquity.toLocaleString()}
                                    </span>
                                </div>
                                <div className="grid md:grid-cols-2 gap-5">
                                    <InputGroup 
                                        label="Owner's Equity" value={ownerEquity} onChange={e => setOwnerEquity(e.target.value)}
                                        min="0" max="10000" theme="emerald" icon="User"
                                    />
                                    <InputGroup 
                                        label="Shareholder's Equity" value={shareholderEquity} onChange={e => setShareholderEquity(e.target.value)}
                                        min="0" max="10000" theme="emerald" icon="Users"
                                    />
                                </div>
                            </section>

                            {/* Info Card (Dark) */}
                            <div className="bg-slate-800/40 border border-white/5 rounded-2xl p-6">
                                <h4 className="font-bold text-slate-300 mb-4 flex items-center gap-2 text-sm">
                                    <Icon name="BookOpen" size={16} className="text-indigo-400" />
                                    Quick Guide
                                </h4>
                                <div className="grid sm:grid-cols-2 gap-4 text-sm text-slate-400">
                                    <div className="bg-slate-900/50 p-4 rounded-xl border border-white/5 hover:border-white/10 transition-colors">
                                        <span className="block font-bold text-indigo-300 text-xs uppercase mb-2">Gearing Ratio</span>
                                        <div className="flex items-center gap-2 mb-2">
                                            <code className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-300 font-mono border border-slate-700">Debt ÷ Equity</code>
                                        </div>
                                        <p className="text-xs leading-relaxed opacity-80">1.0 အထက်ဆိုလျှင် အကြွေးပမာဏသည် ပိုင်ဆိုင်မှုထက် များနေသည်ဟု သတ်မှတ်သည်။</p>
                                    </div>
                                    <div className="bg-slate-900/50 p-4 rounded-xl border border-white/5 hover:border-white/10 transition-colors">
                                        <span className="block font-bold text-purple-300 text-xs uppercase mb-2">Debt Ratio</span>
                                        <div className="flex items-center gap-2 mb-2">
                                            <code className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-300 font-mono border border-slate-700">Debt ÷ Total Capital</code>
                                        </div>
                                        <p className="text-xs leading-relaxed opacity-80">လုပ်ငန်း၏ Assets အားလုံးတွင် အကြွေးပါဝင်မှု ရာခိုင်နှုန်းကို ပြသသည်။</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Sticky Dashboard */}
                        <div className="lg:col-span-4 relative">
                            <div className="lg:sticky lg:top-8 space-y-6">
                                
                                {/* Main Result Card */}
                                <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/40 text-white rounded-[2.5rem] p-8 border border-white/10 shadow-2xl relative overflow-hidden flex flex-col min-h-[420px]">
                                    
                                    {/* Glowing Orbs */}
                                    <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-600/20 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
                                    <div className="absolute bottom-0 left-0 w-64 h-64 bg-rose-600/10 rounded-full blur-[80px] translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

                                    <div className="relative z-10 flex flex-col h-full justify-between">
                                        <div>
                                            <div className="flex justify-between items-start mb-8">
                                                <h2 className="text-lg font-bold text-slate-200 flex items-center gap-2">
                                                    <Icon name="Activity" size={18} className="text-indigo-400" /> 
                                                    Ratio Analysis
                                                </h2>
                                                <div className="flex items-center gap-2">
                                                    <span className="relative flex h-2 w-2">
                                                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                                    </span>
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Live</span>
                                                </div>
                                            </div>

                                            <div className="flex flex-col items-center mb-8">
                                                <div className="relative mb-8 group cursor-default">
                                                    {/* Chart Glow Effect */}
                                                    <div className={`absolute inset-0 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-700 ${analysis.color === 'rose' ? 'bg-rose-500' : analysis.color === 'amber' ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                                                    
                                                    <DonutChart value={totalDebt} total={totalCapital} colorClass="rose" size={180} />
                                                    
                                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none mt-14">
                                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Debt Ratio</span>
                                                    </div>
                                                </div>
                                                
                                                <div className="text-center">
                                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Debt to Equity Ratio</p>
                                                    <div className="flex items-center justify-center gap-2">
                                                        <span className={`text-6xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 drop-shadow-sm`}>
                                                            {ratio1}
                                                        </span>
                                                        <span className="text-2xl text-slate-600 font-light mt-4">x</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Status Box */}
                                        <div className={`backdrop-blur-xl border p-5 rounded-2xl transition-all duration-500 ${analysis.bg}/10 ${analysis.border}`}>
                                            <div className="flex items-center gap-3 mb-2">
                                                <div className={`p-2 rounded-lg ${analysis.bg} text-white shadow-lg`}>
                                                    <Icon name={analysis.icon} size={18} />
                                                </div>
                                                <h3 className={`font-bold text-lg ${analysis.text}`}>
                                                    {analysis.status}
                                                </h3>
                                            </div>
                                            <p className="text-sm text-slate-300 leading-relaxed opacity-90 font-medium">
                                                {analysis.desc}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Quick Stats (Dark) */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="glass-card-dark p-4 rounded-2xl text-center">
                                        <p className="text-xs font-bold text-slate-500 uppercase mb-1">Total Capital</p>
                                        <p className="text-xl font-bold text-indigo-300">{(totalCapital/1000).toFixed(1)}k</p>
                                    </div>
                                    <div className="glass-card-dark p-4 rounded-2xl text-center">
                                        <p className="text-xs font-bold text-slate-500 uppercase mb-1">Risk Level</p>
                                        <div className="flex justify-center mt-1 space-x-1">
                                            <div className={`h-1.5 w-4 rounded-full ${ratio1 <= 0.5 ? 'bg-emerald-500' : 'bg-slate-700'}`}></div>
                                            <div className={`h-1.5 w-4 rounded-full ${ratio1 > 0.5 && ratio1 <= 1 ? 'bg-amber-500' : 'bg-slate-700'}`}></div>
                                            <div className={`h-1.5 w-4 rounded-full ${ratio1 > 1 ? 'bg-rose-500' : 'bg-slate-700'}`}></div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
