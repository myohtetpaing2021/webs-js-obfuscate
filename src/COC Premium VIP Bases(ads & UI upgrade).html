        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [loadProgress, setLoadProgress] = useState(30);
            const [toasts, setToasts] = useState([]);
            const [clock, setClock] = useState(Date.now());

            const showToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);

            useEffect(() => {
                const interval = setInterval(() => setClock(Date.now()), 1000);
                return () => clearInterval(interval);
            }, []);

            const initUser = async () => {
                let deviceId = localStorage.getItem('coc_device_id');
                if (!deviceId) {
                    deviceId = 'dev_' + Math.random().toString(36).substring(2, 11);
                    localStorage.setItem('coc_device_id', deviceId);
                }
                setUser({ uid: deviceId });
                setLoadProgress(50);

                try {
                    const res = await apiFetch('init_user', { uid: deviceId });
                    console.log('init_user response:', res);

                    if (res.success && res.profile) {
                        setProfile(res.profile);
                        console.log('Profile loaded:', res.profile);
                    } else {
                        console.log('No existing profile found, showing activation screen');
                    }
                } catch (err) {
                    console.error('init_user failed:', err);
                }

                setLoadProgress(100);
                setTimeout(() => setLoading(false), 500);
            };

            useEffect(() => {
                initUser();
            }, []);

            const handleLogoutSystem = async () => {
                if (user?.uid) {
                    try { await apiFetch('logout', { uid: user.uid }); } catch(e) {}
                }
                localStorage.removeItem('coc_device_id');
                setProfile(null);

                const newDeviceId = 'dev_' + Math.random().toString(36).substring(2, 11);
                localStorage.setItem('coc_device_id', newDeviceId);
                setUser({ uid: newDeviceId });

                showToast("Logged out successfully 👋");
            };

            const daysLeft = useMemo(() => {
                if (!profile || !profile.vipExpiry) return 0;
                const msLeft = profile.vipExpiry - clock;
                return Math.max(0, Math.ceil(msLeft / (1000 * 60 * 60 * 24)));
            }, [profile, clock]);

            const remainingTime = useMemo(() => {
                if (!profile || !profile.vipExpiry) return 'Expired';
                const msLeft = Math.max(0, profile.vipExpiry - clock);
                const totalSeconds = Math.floor(msLeft / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                return `${days}d ${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            }, [profile, clock]);

            // CRITICAL FIX: Explicit boolean check for admin
            const isVip = useMemo(() => {
                const isAdmin = profile && (profile.isAdmin === true || profile.isAdmin === 1 || profile.isAdmin === '1');
                const hasTime = daysLeft > 0;
                console.log('VIP Check - isAdmin:', isAdmin, 'daysLeft:', daysLeft, 'isVip:', isAdmin || hasTime);
                return isAdmin || hasTime;
            }, [profile, daysLeft]);

            if (loading) return <PreloaderScreen progress={loadProgress} />;

            return (
                <div className="min-h-screen bg-obsidian text-slate-100 font-sans relative">
                    <FloatingOrbs />
                    <div className="bg-noise"></div>
                    <ToastManager toasts={toasts} />
                    {!isVip ? (
                        <ActivationScreen user={user} showToast={showToast} setProfile={setProfile} />
                    ) : (
                        <MainApp 
                            user={user} 
                            profile={profile} 
                            setProfile={setProfile} 
                            showToast={showToast} 
                            daysLeft={daysLeft} 
                            remainingTime={remainingTime}
                            onLogout={handleLogoutSystem}
                        />
                    )}
                </div>
            );
        }

                            <div>

                        <form onSubmit={handleActivate} className="space-y-4">

                                        Verifying...

                        <div className="pt-4 border-t border-slate-800/50">
                            <div className="text-[10px] text-slate-600 font-mono tracking-wider uppercase">Device ID</div>
                            <div className="text-[11px] text-slate-500 font-mono mt-1">{user?.uid}</div>
                        </div>

                    <div className="w-full max-w-md mt-6">
                        <SmartLinkAd />

                    <div className="mt-8 text-center space-y-1">

                        <p className="text-[10px] text-slate-700">Premium Content. Authorized Access Only.</p>
                    </div>
                </div>

                            </div>
                            <div>
                                <label className="text-[11px] text-slate-400 mb-1.5 block font-medium uppercase tracking-wider">Image Direct Link</label>
                                <input 
                                    type="text" 
                                    placeholder="https://i.imgur.com/..." 
                                    value={imageUrl} 
                                    onChange={e => setImageUrl(e.target.value)} 
                                    className="w-full input-luxury p-3 rounded-xl text-xs text-white" 
                                />
                            </div>
                            <div>
                                <label className="text-[11px] text-slate-400 mb-1.5 block font-medium uppercase tracking-wider">CoC In-game Copy Link</label>
                                <input 
                                    type="text" 
                                    placeholder="https://link.clashofclans.com/..." 
                                    value={baseLink} 
                                    onChange={e => setBaseLink(e.target.value)} 
                                    className="w-full input-luxury p-3 rounded-xl text-xs text-white" 
                                />
                            </div>
                            <div>
                                <label className="text-[11px] text-slate-400 mb-1.5 block font-medium uppercase tracking-wider">Recommended CC Troops</label>
                                <input 
                                    type="text" 
                                    placeholder="e.g. 1 Super Minion, 2 Headhunters" 
                                    value={ccTroops} 
                                    onChange={e => setCcTroops(e.target.value)} 
                                    className="w-full input-luxury p-3 rounded-xl text-xs text-white" 
                                />
                            </div>
                            <button 
                                type="submit" 
                                disabled={isAdding}
                                className="btn-gold py-3.5 px-4 rounded-xl text-xs font-bold w-full mt-2 disabled:opacity-50"
                            >
                                {isAdding ? (
                                    <span className="flex items-center justify-center gap-2">
                                        <div className="w-3 h-3 border-2 border-black/30 border-t-black rounded-full animate-spin"></div>
                                        Publishing...
                                    </span>
                                ) : (
                                    'Publish Base Layout'
                                )}
                            </button>
                        </form>
                    </div>

                    {/* Codes Manager */}
                    <div className="glass-panel p-6 rounded-3xl border border-slate-800/50 space-y-5">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-cyan-500/10 border border-cyan-500/20 rounded-xl flex items-center justify-center">
                                    <Icons.Key className="w-5 h-5 text-cyan-400" />
                                </div>
                                <div>
                                    <h3 className="text-base font-bold text-white">VIP Codes</h3>
                                    <p className="text-[11px] text-slate-500">Manage activation codes</p>
                                </div>
                            </div>
                            <button 
                                onClick={handleGenerateCode} 
                                className="btn-gold px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5"
                            >
                                <Icons.Plus className="w-3.5 h-3.5" />
                                Generate
                            </button>
                        </div>

                        <div className="space-y-2 max-h-[400px] overflow-y-auto pr-1">
                            {codes.length === 0 ? (
                                <div className="text-center py-8 text-slate-600 text-xs">No codes generated yet.</div>
                            ) : (
                                codes.map(c => (
                                    <div key={c.id} className="flex justify-between items-center p-3.5 bg-slate-900/40 rounded-xl text-xs border border-slate-800/50 hover:border-slate-700/50 transition-all group">
                                        <div className="flex items-center gap-3">
                                            <button 
                                                onClick={() => copyCode(c.id)}
                                                className="p-1.5 bg-slate-800/50 rounded-lg text-slate-500 hover:text-amber-400 hover:bg-amber-500/10 transition-all"
                                                title="Copy code"
                                            >
                                                <Icons.Copy className="w-3.5 h-3.5" />
                                            </button>
                                            <div>
                                                <div className="font-mono text-amber-300 font-bold tracking-wider">{c.id}</div>
                                                <div className="text-[10px] text-slate-600">{new Date(c.createdAt).toLocaleDateString()}</div>
                                            </div>
                                        </div>
                                        <span className={`px-3 py-1 rounded-full text-[10px] font-bold border ${c.used ? 'bg-red-950/30 text-red-400 border-red-800/30' : 'bg-emerald-950/30 text-emerald-400 border-emerald-800/30'}`}>
                                            {c.used ? `Used` : 'Active'}
                                        </span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function BaseCard({ base, isFav, onToggleFav, isAdmin, onDelete, onImageClick, index }) {
            const fallbackImage = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='600' height='400' fill='%231e293b'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23f59e0b' font-size='20' font-family='sans-serif'>Invalid Image Link</text></svg>";
            const [imgLoaded, setImgLoaded] = useState(false);

            return (
                <div 
                    className="glass-card rounded-2xl overflow-hidden flex flex-col border border-slate-800/50 hover:border-slate-700/50 transition-all stagger-in"
                    style={{animationDelay: `${index * 0.05}s`}}
                >
                    <div 
                        onClick={() => onImageClick(base.imageUrl)}
                        className="relative w-full h-56 sm:h-64 bg-slate-950 overflow-hidden cursor-pointer group flex items-center justify-center image-shine"
                    >
                        {!imgLoaded && <div className="skeleton absolute inset-0 z-10"></div>}
                        <img 
                            src={base.imageUrl || fallbackImage} 
                            alt="Base Layout" 
                            className={`w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ${imgLoaded ? 'opacity-100' : 'opacity-0'}`}
                            referrerPolicy="no-referrer"
                            onLoad={() => setImgLoaded(true)}
                            onError={(e) => {
                                e.target.onerror = null; 
                                e.target.src = fallbackImage;
                                setImgLoaded(true);
                            }}
                        />
                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                            <span className="bg-slate-900/90 text-amber-400 text-xs px-4 py-2 rounded-xl backdrop-blur-md border border-amber-500/30 font-bold shadow-lg flex items-center gap-2">
                                <Icons.Eye className="w-3.5 h-3.5" />
                                View Full Screen
                            </span>
                        </div>
                        <button 
                            onClick={(e) => { e.stopPropagation(); onToggleFav(); }} 
                            className="absolute top-3 right-3 p-2.5 bg-slate-900/80 backdrop-blur-md rounded-full border border-slate-700/60 shadow-lg z-10 hover:bg-slate-800 transition-all heart-beat"
                        >
                            <Icons.Heart filled={isFav} className="w-4 h-4" />
                        </button>
                    </div>

                    <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div className="space-y-2">
                            <div className="flex items-center justify-between">
                                <span className="category-tag text-[10px] uppercase font-bold text-amber-400 px-2.5 py-1 rounded-lg">{base.type}</span>
                            </div>
                            <p className="text-xs text-slate-400 leading-relaxed">
                                <span className="text-slate-500 font-semibold">CC Troops:</span> {base.ccTroops || 'Any / Not specified'}
                            </p>
                        </div>
                        <div className="flex gap-2.5">
                            <a 
                                href={base.baseLink} 
                                target="_blank" 
                                rel="noreferrer" 
                                className="btn-gold copy-link-btn text-center py-3 flex-1 rounded-xl text-xs font-bold shadow-md"
                            >
                                Copy Base Link
                            </a>
                            {isAdmin && (
                                <button 
                                    onClick={onDelete} 
                                    className="delete-btn p-3 rounded-xl hover:scale-105 transition-transform"
                                    title="Delete Layout"
                                >
                                    <Icons.Trash className="w-4 h-4 text-red-400" />
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"71e03a4d3f5e43339e70bc5e8b919da6","r":1}' crossorigin="anonymous"></script>
</body>
</html>
