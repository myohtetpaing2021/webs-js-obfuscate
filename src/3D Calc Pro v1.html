<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lottery Flow - Ultimate Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Padauk', 'sans-serif'],
                        num: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#020617', // Deep Space
                            900: '#0f172a',
                            800: '#1e293b',
                        },
                        primary: {
                            400: '#38bdf8', // Sky
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out infinite 4s',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        slideUp: {
                            'from': { opacity: 0, transform: 'translateY(20px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            'from': { opacity: 0 },
                            'to': { opacity: 1 },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Remove Spinners from Number Inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Premium Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.6) 100%);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(56, 189, 248, 0.1);
        }
        
        .glass-card:hover::before {
            opacity: 1;
        }

        /* Input Styling */
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
        }

        /* Number Tags in Results */
        .num-tag {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(56, 189, 248, 0.05);
            transition: all 0.2s ease;
        }
        .num-tag:hover {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3), inset 0 0 10px rgba(56, 189, 248, 0.2);
            transform: scale(1.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .text-neon-blue {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <!-- PRELOADER -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020617] flex flex-col items-center justify-center transition-all duration-1000 ease-out overflow-hidden">
        <div class="absolute inset-0 opacity-20" 
             style="background-image: radial-gradient(#38bdf8 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(20deg);">
        </div>

        <div class="relative flex flex-col items-center">
            <div class="relative w-40 h-40 flex items-center justify-center mb-10">
                <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-cyan-500 border-l-cyan-500/30 animate-[spin_2s_linear_infinite] shadow-[0_0_30px_rgba(6,182,212,0.2)]"></div>
                <div class="absolute inset-3 rounded-full border-2 border-transparent border-b-violet-500 border-r-violet-500/30 animate-[spin_3s_linear_infinite_reverse]"></div>
                <div class="relative z-10 w-20 h-20 bg-gradient-to-br from-cyan-950 to-slate-900 rounded-full flex items-center justify-center border border-white/10 shadow-[0_0_50px_rgba(6,182,212,0.4)] animate-pulse">
                    <div class="absolute inset-0 bg-cyan-500/20 rounded-full blur-xl animate-pulse"></div>
                    <i data-lucide="crosshair" class="text-white w-8 h-8 relative z-10 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]"></i>
                </div>
            </div>
            
            <div class="w-64 space-y-4">
                <div class="text-center">
                    <h2 class="text-3xl font-bold tracking-[0.2em] text-white font-num mb-1">LOTTERY<span class="text-cyan-400">CALC</span></h2>
                    <p class="text-[10px] text-cyan-500/70 font-num tracking-[0.4em] uppercase">System Initializing</p>
                </div>
                <div class="h-1 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 relative">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-500 w-0 shadow-[0_0_20px_rgba(6,182,212,0.8)] relative">
                        <div class="absolute right-0 top-0 bottom-0 w-2 bg-white/50 blur-[2px]"></div>
                    </div>
                </div>
                <div class="flex justify-between text-[10px] font-num text-slate-400 font-medium tracking-wider">
                    <span class="animate-pulse">LOADING LOGIC...</span>
                    <span id="progress-text" class="text-cyan-400 font-bold">0%</span>
                </div>
            </div>
        </div>
        <div class="absolute bottom-8 text-[9px] text-slate-600 font-num tracking-widest uppercase">
            v3.0 Ultimate Edition
        </div>
    </div>

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-cyan-600/10 rounded-full blur-[120px] animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-violet-600/10 rounded-full blur-[120px] animate-float-delayed"></div>
        <div class="absolute top-[30%] left-[40%] w-[40%] h-[40%] bg-fuchsia-600/5 rounded-full blur-[100px] animate-pulse-slow"></div>
        <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>
    </div>

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-[#020617]/80 backdrop-blur-xl border-b border-white/5 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20 border border-cyan-400/20">
                <i data-lucide="crosshair" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-white font-num tracking-wide">THAI<span class="text-cyan-400">LOTTERY</span></h1>
                <p class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Calculator Pro</p>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 relative z-10 pt-24 pb-12 min-h-screen">
        <div class="max-w-[1400px] mx-auto px-4 md:px-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- LEFT: CONTROLS PANEL (8 Columns) -->
            <div class="lg:col-span-8 space-y-6 animate-slide-up" style="animation-delay: 0.1s">
                
                <!-- 2D Patterns -->
                <div class="glass-card rounded-3xl p-6 border border-cyan-500/10">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-5">
                        <i data-lucide="grid" class="w-4 h-4 text-cyan-400"></i> 2D အကွက်များ
                    </h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                        <button onclick="showPattern('power')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm">
                            ပါဝါ
                        </button>
                        <button onclick="showPattern('nakhat')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm">
                            နက္ခတ်
                        </button>
                        <button onclick="showPattern('brother')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm">
                            ညီအစ်ကို
                        </button>
                        <button onclick="showPattern('double')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm">
                            အပူး
                        </button>
                        <button onclick="showPattern('evenDouble')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm">
                            စုံပူး
                        </button>
                        <button onclick="showPattern('oddDouble')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm">
                            မပူး
                        </button>
                        <button onclick="showPattern('padaythar')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-cyan-500/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-all flex items-center justify-center gap-2 group shadow-sm sm:col-span-3 md:col-span-2">
                            ပဒေသာ
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Head / Tail / Round -->
                    <div class="glass-card rounded-3xl p-6 border border-emerald-500/10">
                        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-5">
                            <i data-lucide="target" class="w-4 h-4 text-emerald-400"></i> ထိပ် / ပိတ် / ပတ်
                        </h3>
                        <div class="flex flex-col gap-4">
                            <div class="relative">
                                <input type="number" id="digit" placeholder="0-9 အတွင်းရိုက်ထည့်ပါ" min="0" max="9" class="input-field w-full bg-slate-900/60 border border-white/10 rounded-xl px-5 py-3.5 text-base text-white placeholder-slate-500 focus:outline-none text-center font-num font-bold">
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <button onclick="showHead()" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-emerald-500/10 hover:border-emerald-500/30 hover:text-emerald-400 transition-all shadow-sm">ထိပ်</button>
                                <button onclick="showTail()" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-emerald-500/10 hover:border-emerald-500/30 hover:text-emerald-400 transition-all shadow-sm">ပိတ်</button>
                                <button onclick="showRound()" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-emerald-500/10 hover:border-emerald-500/30 hover:text-emerald-400 transition-all shadow-sm">ပတ်</button>
                            </div>
                        </div>
                    </div>

                    <!-- Khway -->
                    <div class="glass-card rounded-3xl p-6 border border-rose-500/10 flex flex-col">
                        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-5">
                            <i data-lucide="shuffle" class="w-4 h-4 text-rose-400"></i> အပူးပါခွေ
                        </h3>
                        <div class="grid grid-cols-1 gap-3 flex-1">
                            <button onclick="showKhway('012')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-base font-bold text-slate-300 hover:bg-rose-500/10 hover:border-rose-500/30 hover:text-rose-400 transition-all shadow-sm font-num flex-1">012 ခွေ</button>
                            <button onclick="showKhway('0123')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-base font-bold text-slate-300 hover:bg-rose-500/10 hover:border-rose-500/30 hover:text-rose-400 transition-all shadow-sm font-num flex-1">0123 ခွေ</button>
                            <button onclick="showKhway('01234')" class="p-3 rounded-xl bg-slate-800/50 border border-white/5 text-base font-bold text-slate-300 hover:bg-rose-500/10 hover:border-rose-500/30 hover:text-rose-400 transition-all shadow-sm font-num flex-1">01234 ခွေ</button>
                        </div>
                    </div>
                </div>

                <!-- Brakes -->
                <div class="glass-card rounded-3xl p-6 border border-orange-500/10">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-5">
                        <i data-lucide="hash" class="w-4 h-4 text-orange-400"></i> ဘရိတ် (Brakes)
                    </h3>
                    <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
                        <button onclick="showBrake(1)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">1B</button>
                        <button onclick="showBrake(2)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">2B</button>
                        <button onclick="showBrake(3)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">3B</button>
                        <button onclick="showBrake(4)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">4B</button>
                        <button onclick="showBrake(5)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">5B</button>
                        <button onclick="showBrake(6)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">6B</button>
                        <button onclick="showBrake(7)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">7B</button>
                        <button onclick="showBrake(8)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">8B</button>
                        <button onclick="showBrake(9)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">9B</button>
                        <button onclick="showBrake(0)" class="p-2.5 rounded-xl bg-slate-800/50 border border-white/5 text-sm font-bold text-slate-300 hover:bg-orange-500/10 hover:border-orange-500/30 hover:text-orange-400 transition-all shadow-sm font-num">0B</button>
                    </div>
                </div>

                <!-- 3D Calculator -->
                <div class="glass-card rounded-3xl p-6 border border-violet-500/20 bg-gradient-to-br from-violet-900/10 to-transparent relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-violet-500/10 rounded-full blur-[80px] pointer-events-none -mr-20 -mt-20 animate-pulse-slow"></div>
                    <div class="relative z-10">
                        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-5">
                            <i data-lucide="layers" class="w-4 h-4 text-violet-400"></i> 3D တွက်စက်
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                            <input type="text" id="r1" placeholder="Draw 1" maxlength="3" class="input-field w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-center text-white focus:outline-none font-num font-bold text-lg tracking-widest placeholder-slate-600">
                            <input type="text" id="r2" placeholder="Draw 2" maxlength="3" class="input-field w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-center text-white focus:outline-none font-num font-bold text-lg tracking-widest placeholder-slate-600">
                            <input type="text" id="r3" placeholder="Draw 3" maxlength="3" class="input-field w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-center text-white focus:outline-none font-num font-bold text-lg tracking-widest placeholder-slate-600">
                            <input type="text" id="r4" placeholder="Draw 4" maxlength="3" class="input-field w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-3 text-center text-white focus:outline-none font-num font-bold text-lg tracking-widest placeholder-slate-600">
                        </div>
                        <button onclick="calc3D()" class="w-full bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white shadow-[0_0_20px_rgba(139,92,246,0.4)] border border-violet-400/20 px-8 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 text-base">
                            <i data-lucide="calculator" class="w-5 h-5"></i> 3D ခန့်မှန်းတွက်ချက်မည်
                        </button>
                    </div>
                </div>

            </div>

            <!-- RIGHT: RESULTS PANEL (4 Columns) -->
            <div id="results-panel" class="lg:col-span-4 lg:sticky lg:top-24 animate-slide-up" style="animation-delay: 0.2s">
                <div class="glass-card rounded-3xl p-6 border border-cyan-500/20 min-h-[500px] flex flex-col bg-gradient-to-b from-[#0f172a]/80 to-[#020617]/90 shadow-2xl">
                    
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-cyan-500/10 text-cyan-400 flex items-center justify-center border border-cyan-500/20 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                                <i data-lucide="award" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 id="title" class="text-base font-bold text-white tracking-wide">ရလဒ်များ</h3>
                                <p class="text-[10px] text-slate-400 font-num tracking-widest uppercase">Output</p>
                            </div>
                        </div>
                        <span id="count" class="px-3 py-1 bg-slate-800 rounded-full border border-white/10 text-xs font-bold text-cyan-400 font-num">0 ကွက်</span>
                    </div>

                    <div id="results" class="flex-1 flex flex-wrap gap-3 align-start content-start overflow-y-auto custom-scrollbar pr-2 mb-6">
                        <div class="w-full h-full flex flex-col items-center justify-center text-slate-500 opacity-50 space-y-3">
                            <i data-lucide="inbox" class="w-12 h-12"></i>
                            <p class="text-sm">ရလဒ်ပြသရန် ရွေးချယ်ပါ</p>
                        </div>
                    </div>

                    <button id="copyBtn" onclick="copyToClipboard()" class="hidden w-full bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white shadow-[0_0_20px_rgba(16,185,129,0.4)] border border-emerald-400/20 px-6 py-3.5 rounded-xl font-bold items-center justify-center gap-2 transition-all active:scale-95 text-sm group">
                        <i data-lucide="copy" class="w-4 h-4 group-hover:scale-110 transition-transform"></i> ကူးယူမည် (Copy)
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-notification" class="fixed top-24 right-4 z-[70] hidden transition-all duration-500 translate-x-full">
        <div class="glass-panel px-5 py-4 rounded-xl border border-emerald-500/20 shadow-2xl flex items-center gap-4 bg-[#020617]/90 backdrop-blur-xl">
            <div id="toast-icon-container" class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                <i id="toast-icon" data-lucide="check" class="w-4 h-4"></i>
            </div>
            <div>
                <h4 id="toast-title" class="text-sm font-bold text-white">အောင်မြင်ပါသည်</h4>
                <p class="text-xs text-slate-400" id="toast-message">လုပ်ဆောင်ချက် ပြီးစီးပါပြီ။</p>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // --- Preloader Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const progress = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            const preloader = document.getElementById('preloader');
            let width = 0;

            const interval = setInterval(() => {
                width += Math.random() * 8; 
                if (width > 100) width = 100;
                
                if (progress) progress.style.width = width + '%';
                if (text) text.innerText = Math.floor(width) + '%';

                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if(preloader) {
                            preloader.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
                            setTimeout(() => preloader.remove(), 700);
                        }
                    }, 500); 
                }
            }, 50); 
        });

        // --- Custom Toast System ---
        let toastTimer;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast-notification');
            const msgEl = document.getElementById('toast-message');
            const titleEl = document.getElementById('toast-title');
            const iconContainer = document.getElementById('toast-icon-container');
            const iconEl = document.getElementById('toast-icon');
            
            msgEl.textContent = message;
            
            if(type === 'error') {
                titleEl.textContent = "သတိပြုရန်";
                iconContainer.className = "w-8 h-8 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center border border-rose-500/20";
                iconEl.setAttribute('data-lucide', 'alert-circle');
            } else {
                titleEl.textContent = "အောင်မြင်ပါသည်";
                iconContainer.className = "w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20";
                iconEl.setAttribute('data-lucide', 'check');
            }
            lucide.createIcons();
            
            toast.classList.remove('hidden', 'translate-x-full');
            
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.classList.add('hidden'), 500);
            }, 3000);
        }

        // --- Calculator Logic ---
        const patterns = {
            power: ["05", "16", "27", "38", "49"],
            nakhat: ["18", "24", "35", "70", "96"],
            brother: ["01", "12", "23", "34", "45", "56", "67", "78", "89", "90"],
            double: ["00", "11", "22", "33", "44", "55", "66", "77", "88", "99"],
            evenDouble: ["00", "22", "44", "66", "88"],
            oddDouble: ["11", "33", "55", "77", "99"],
            padaythar: ["13", "14", "15", "17", "25", "26", "29", "36", "39", "47", "48", "57", "58", "59", "68", "79"]
        };

        const nakhatMap = {"0":"7", "7":"0", "1":"8", "8":"1", "2":"4", "4":"2", "3":"5", "5":"3", "6":"9", "9":"6"};

        function reverse(num) {
            if (num[0] === num[1]) return [num];
            return [num, num[1] + num[0]];
        }

        function scrollToResults() {
            if (window.innerWidth < 1024) {
                document.getElementById('results-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function display(title, numbers) {
            const unique = [...new Set(numbers)].sort();
            document.getElementById('title').textContent = title;
            document.getElementById('count').textContent = unique.length + " ကွက်";
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            const copyBtn = document.getElementById('copyBtn');
            
            if (unique.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center text-slate-500 opacity-50 space-y-3">
                        <i data-lucide="inbox" class="w-12 h-12"></i>
                        <p class="text-sm">ရလဒ်မရှိပါ</p>
                    </div>`;
                lucide.createIcons();
                copyBtn.classList.remove('flex');
                copyBtn.classList.add('hidden');
            } else {
                unique.forEach(num => {
                    const tag = document.createElement('div');
                    tag.className = 'num-tag px-4 py-2 text-white font-num font-bold rounded-lg text-center tracking-widest text-lg';
                    tag.textContent = num;
                    resultsDiv.appendChild(tag);
                });
                copyBtn.classList.remove('hidden');
                copyBtn.classList.add('flex');
                copyBtn.dataset.text = unique.join(', ');
            }
            scrollToResults();
        }

        function showPattern(key) {
            let results = [];
            patterns[key].forEach(num => {
                if (['double', 'evenDouble', 'oddDouble'].includes(key)) {
                    results.push(num);
                } else {
                    results.push(...reverse(num));
                }
            });
            const titles = {
                power: "ပါဝါ", nakhat: "နက္ခတ်", brother: "ညီအစ်ကို", 
                double: "အပူး", evenDouble: "စုံပူး", oddDouble: "မပူး", padaythar: "ပဒေသာ"
            };
            display(titles[key] + " အကွက်များ", results);
        }

        function showBrake(b) {
            let results = [];
            for (let i = 0; i <= 99; i++) {
                let s = i.toString().padStart(2, '0');
                let sum = (parseInt(s[0]) + parseInt(s[1])) % 10;
                if (sum === b) results.push(s);
            }
            display(b + " ဘရိတ် (Brake)", results);
        }

        function showHead() {
            const d = document.getElementById('digit').value;
            if (d === "" || isNaN(d) || d < 0 || d > 9) {
                showToast("၀ ကနေ ၉ အတွင်း ဂဏန်းရိုက်ထည့်ပါ", "error");
                return;
            }
            let results = [];
            for (let i = 0; i <= 9; i++) {
                results.push(d + i);
            }
            display(d + " ထိပ်စီး", results);
        }

        function showTail() {
            const d = document.getElementById('digit').value;
            if (d === "" || isNaN(d) || d < 0 || d > 9) {
                showToast("၀ ကနေ ၉ အတွင်း ဂဏန်းရိုက်ထည့်ပါ", "error");
                return;
            }
            let results = [];
            for (let i = 0; i <= 9; i++) {
                results.push(i + d);
            }
            display(d + " နောက်ပိတ်", results);
        }

        function showRound() {
            const d = document.getElementById('digit').value;
            if (d === "" || isNaN(d) || d < 0 || d > 9) {
                showToast("၀ ကနေ ၉ အတွင်း ဂဏန်းရိုက်ထည့်ပါ", "error");
                return;
            }
            let results = [];
            for (let i = 0; i <= 9; i++) {
                results.push(d + i);
                if (d !== i.toString()) results.push(i + d);
            }
            display(d + " ပတ်သီး", results);
        }

        function showKhway(type) {
            let digits = type.split('');
            let results = [];
            for (let i = 0; i < digits.length; i++) {
                for (let j = 0; j < digits.length; j++) {
                    results.push(digits[i] + digits[j]);
                }
            }
            display(type + " အပူးပါခွေ", results);
        }

        function calc3D() {
            const r1 = document.getElementById('r1').value.trim();
            const r2 = document.getElementById('r2').value.trim();
            const r3 = document.getElementById('r3').value.trim();
            const r4 = document.getElementById('r4').value.trim();

            if (r1.length !== 3 || r2.length !== 3 || r3.length !== 3 || r4.length !== 3) {
                showToast("ဂဏန်း ၃ လုံးစီ အပြည့်အစုံ ရိုက်ထည့်ပါ", "error");
                return;
            }

            try {
                let hSum = (parseInt(r3[0]) + parseInt(r3[1]) + parseInt(r4[2])) % 10;
                let head = nakhatMap[hSum.toString()] || hSum;

                let m1 = (parseInt(r1[1]) + parseInt(r3[1])) % 10;
                let m2 = (parseInt(r2[1]) + parseInt(r4[1])) % 10;
                let targetM = (m2 + 1) % 10;
                let middle = (targetM - parseInt(r3[1]) + 10) % 10;

                let tSum = (parseInt(r3[2]) + parseInt(r4[2])) % 10;
                let tail = (tSum - middle + 10) % 10;

                display("3D ခန့်မှန်းချက်", ["" + head + middle + tail]);
            } catch (e) {
                showToast("တွက်ချက်မှုတွင် အမှားရှိပါသည်", "error");
            }
        }

        function copyToClipboard() {
            const btn = document.getElementById('copyBtn');
            const text = btn.dataset.text;
            
            // iFrame တွင်လုံခြုံစွာ Copy ကူးနိုင်ရန်
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast("ဂဏန်းများကို ကူးယူပြီးပါပြီ");
            } catch (err) {
                showToast("ကူးယူရာတွင် အမှားရှိပါသည်", "error");
            }
            
            document.body.removeChild(textArea);
        }
    </script>

</body>
</html>
