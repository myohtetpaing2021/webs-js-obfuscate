<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D/3D Ledger - Ultimate Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Padauk', 'sans-serif'],
                        num: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                        },
                        primary: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out infinite 4s',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) translateZ(0)' },
                            '50%': { transform: 'translateY(-20px) translateZ(0)' },
                        },
                        slideUp: {
                            'from': { opacity: 0, transform: 'translateY(15px) translateZ(0)' },
                            'to': { opacity: 1, transform: 'translateY(0) translateZ(0)' },
                        },
                        fadeIn: {
                            'from': { opacity: 0 },
                            'to': { opacity: 1 },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            color-scheme: dark; /* Forces native dropdowns and datepickers to dark mode */
        }

        /* Fix Browser Autofill White Background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: #f8fafc !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Remove Spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Hardware Accelerated Classes for better mobile performance */
        .gpu-accelerated {
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-2px) translateZ(0);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .input-field { transition: border-color 0.2s ease, background-color 0.2s ease; }
        .input-field:focus {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
            outline: none;
        }

        select.input-field option, select option { background-color: #0f172a; color: #fff; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
        
        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        
        .text-neon-cyan { text-shadow: 0 0 8px rgba(6, 182, 212, 0.4); }
        .text-neon-emerald { text-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
        .text-neon-rose { text-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <!-- HIDDEN IMPORT INPUT -->
    <input type="file" id="import-file" style="display:none" accept=".json" onchange="importDataJSON(event)" />

    <!-- PRELOADER -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020617] flex flex-col items-center justify-center transition-opacity duration-500 ease-out overflow-hidden gpu-accelerated">

            <div class="w-16 h-16 border-4 border-slate-800 border-t-cyan-500 rounded-full animate-spin mb-6 shadow-[0_0_15px_rgba(6,182,212,0.3)]"></div>

                    <!-- Settings Hover Menu -->
                    <div class="mt-auto px-4 pb-6 relative group/settings">
                        <div class="absolute bottom-[calc(100%-1.5rem)] left-4 w-60 pb-2 opacity-0 pointer-events-none group-hover/settings:pointer-events-auto group-hover/settings:opacity-100 transition-all duration-200 translate-y-2 scale-95 group-hover/settings:translate-y-0 group-hover/settings:scale-100 origin-bottom-left z-[100] gpu-accelerated">
                            <div class="glass-panel rounded-2xl p-2 flex flex-col gap-1 border border-white/10 shadow-2xl bg-slate-900/95">
                                <button onclick="exportDataJSON()" class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-slate-300 text-xs font-bold transition-colors hover:text-white">
                                    <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i> <span class="whitespace-nowrap">Backup Data (JSON)</span>
                                </button>

                                    <i data-lucide="upload" class="w-4 h-4 text-violet-400"></i> <span class="whitespace-nowrap">Restore Data (JSON)</span>

                                <button onclick="openExportModal()" class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-slate-300 text-xs font-bold transition-colors hover:text-white">

                            </div>

                        <div class="glass-card p-3 rounded-2xl border border-slate-500/20 bg-slate-800/40 relative overflow-hidden flex items-center group-hover/settings:bg-slate-800/80 transition-colors cursor-pointer z-50">
                            <div class="w-10 h-10 shrink-0 rounded-xl bg-slate-700/50 flex items-center justify-center text-slate-300 transition-colors">
                                <i data-lucide="settings" class="w-5 h-5 group-hover/settings:rotate-90 transition-transform duration-500"></i>
                            </div>
                            <div class="max-w-0 opacity-0 group-hover/sidebar:max-w-[200px] group-hover/sidebar:opacity-100 overflow-hidden transition-all duration-300 whitespace-nowrap ml-0 group-hover/sidebar:ml-3 flex flex-col justify-center text-left">
                                <h4 class="text-xs font-bold text-slate-300">Settings</h4>
                                <p class="text-[10px] text-slate-500 font-num">Data Management</p>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>

        <!-- MOBILE HEADER -->
        <div class="md:hidden fixed top-0 left-0 right-0 z-40 bg-[#020617]/90 backdrop-blur-lg border-b border-white/5 px-4 py-3 flex justify-between items-center shadow-md gpu-accelerated">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="calculator" class="text-white w-4 h-4"></i>
                </div>
                <span class="font-bold text-base text-white font-num">LEDGER<span class="text-cyan-400">PRO</span></span>

            <button onclick="toggleMobileSettings()" class="w-8 h-8 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-slate-400 active:scale-95 transition-transform">

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative z-10 pt-20 md:pt-4 md:px-0 pb-28 md:pb-4 h-screen overflow-y-auto custom-scrollbar scroll-smooth">
            <div id="app-content" class="max-w-7xl mx-auto px-4 md:px-8 space-y-6 pb-10">

        <!-- MOBILE SETTINGS MODAL -->
        <div id="mobile-settings-panel" class="fixed inset-0 z-[60] hidden bg-black/80 backdrop-blur-sm flex flex-col justify-end gpu-accelerated transition-opacity duration-200 opacity-0 pointer-events-none">
            <div class="bg-[#0f172a] rounded-t-3xl border-t border-white/10 p-6 shadow-2xl transform transition-transform duration-300 translate-y-full" id="mobile-settings-content">

                    <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5 text-slate-400"></i> Settings & Data</h3>

                </div>

                    <button onclick="exportDataJSON(); toggleMobileSettings();" class="flex items-center gap-4 bg-slate-900 border border-white/5 p-4 rounded-2xl text-left text-sm font-bold text-slate-200">
                        <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400"><i data-lucide="download" class="w-5 h-5"></i></div> Backup Data (JSON)

                    <button onclick="triggerImport(); toggleMobileSettings();" class="flex items-center gap-4 bg-slate-900 border border-white/5 p-4 rounded-2xl text-left text-sm font-bold text-slate-200">

                    <button onclick="openExportModal(); toggleMobileSettings();" class="flex items-center gap-4 bg-slate-900 border border-white/5 p-4 rounded-2xl text-left text-sm font-bold text-slate-200">

        <!-- EXPORT MODAL -->
        <div id="export-modal" class="fixed inset-0 z-[75] hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4 opacity-0 pointer-events-none transition-opacity duration-200 gpu-accelerated">
            <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative border border-white/10 shadow-2xl text-center transform scale-95 transition-transform duration-200" id="export-box">
                <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-3">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="file-text" class="w-5 h-5 text-blue-400"></i> Export Report</h3>
                    <button onclick="closeExportModal()" class="text-slate-400 hover:text-white bg-white/5 p-1 rounded-full transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="text-left mb-6">
                    <label class="text-[11px] font-bold text-slate-400 mb-2 block uppercase tracking-wider">မည်သူ့စာရင်းကို ထုတ်ယူမည်နည်း?</label>
                    <div class="relative">
                        <select id="export-target-select" class="w-full bg-slate-900/80 border border-white/10 rounded-xl pl-4 pr-10 py-3 text-sm text-white focus:border-cyan-500 focus:outline-none appearance-none">

                    </div>

                <div class="flex gap-3">
                    <button onclick="closeExportModal()" class="flex-1 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/10 text-sm font-bold transition-colors">ပိတ်မည်</button>
                    <button onclick="executeExport()" class="flex-1 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">

        <!-- CUSTOM CONFIRM MODAL -->
        <div id="confirm-modal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4 opacity-0 pointer-events-none transition-opacity duration-200 gpu-accelerated">
            <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative border border-white/10 shadow-2xl text-center transform scale-95 transition-transform duration-200" id="confirm-box">
                <div class="w-16 h-16 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center mx-auto mb-4 border border-red-500/20">
                    <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-2">သေချာပါသလား?</h3>
                <p class="text-sm text-slate-400 mb-6 font-padauk" id="confirm-message">ဤလုပ်ဆောင်မှုကို ပြန်ပြင်၍မရပါ။</p>
                <div class="flex justify-center gap-3">
                    <button onclick="closeConfirmModal()" class="px-5 py-2.5 rounded-xl text-slate-300 hover:bg-white/10 text-sm font-bold transition-colors">မလုပ်တော့ပါ</button>
                    <button id="confirm-yes-btn" onclick="executeConfirm()" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-transform">အတည်ပြုမည်</button>
                </div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION -->
        <div id="toast-notification" class="fixed top-4 right-4 z-[80] transition-all duration-300 translate-x-[120%] gpu-accelerated">
            <div class="glass-panel px-5 py-4 rounded-xl border border-emerald-500/20 shadow-xl flex items-center gap-4 bg-[#020617]/90">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                    <i data-lucide="check" class="w-4 h-4"></i>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-white">အောင်မြင်ပါသည်</h4>
                    <p class="text-xs text-slate-400" id="toast-message">လုပ်ဆောင်မှု ပြီးစီးပါပြီ。</p>
                </div>
            </div>
        </div>

        <!-- MOBILE BOTTOM NAV -->
        <div class="md:hidden fixed bottom-4 left-4 right-4 h-[65px] glass-panel rounded-2xl border border-white/10 z-50 flex items-center justify-between px-2 shadow-lg gpu-accelerated" id="mobile-nav">
            <!-- Nav Injected -->
        </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- State Management ---
        let initialRecords = [];
        try {
            const stored = localStorage.getItem('lottery_records_ultimate');
            if (stored) {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) initialRecords = parsed;
            }
        } catch (error) { console.error("LS Error", error); }

        const state = {
            activeTab: 'dashboard',
            records: initialRecords,
            filterName: 'ALL',
            searchQuery: '',
            sortMode: 'newest', 
            currentPage: 1,
            itemsPerPage: 10
        };

        let pendingConfirmAction = null;
        let searchTimeout = null; 

        // --- Core Helpers ---
        const formatMoney = (amount) => Number(amount).toLocaleString() + " Ks";
        const getTodayDate = () => {
            const d = new Date();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`; 
        };
        const formatDateDisplay = (dateStr) => {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dateStr;
        };

        const calculateBalances = () => {
            const balances = {};
            let totalReceivable = 0, totalPayable = 0;    
            state.records.forEach(r => {
                if (!balances[r.name]) balances[r.name] = 0;
                balances[r.name] += r.netBalance;
            });
            Object.values(balances).forEach(amt => {
                if (amt > 0) totalReceivable += amt;
                else totalPayable += Math.abs(amt);
            });
            return { balances, totalReceivable, totalPayable };
        };

        // --- Modals & UI Toggles ---
        function toggleMobileSettings() {
            const panel = document.getElementById('mobile-settings-panel');
            const content = document.getElementById('mobile-settings-content');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                void panel.offsetWidth;
                panel.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('translate-y-full');
            } else {
                content.classList.add('translate-y-full');
                panel.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => panel.classList.add('hidden'), 300);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('translate-x-[120%]');
            setTimeout(() => toast.classList.add('translate-x-[120%]'), 2500);
        }

        function showConfirm(message, actionCallback) {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            document.getElementById('confirm-message').textContent = message;
            pendingConfirmAction = actionCallback;
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            box.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 200);
            pendingConfirmAction = null;
        }

        function executeConfirm() {
            if (pendingConfirmAction) pendingConfirmAction();
            closeConfirmModal();
        }

        // --- Export Modal Logic ---
        function openExportModal() {
            const modal = document.getElementById('export-modal');
            const box = document.getElementById('export-box');
            const select = document.getElementById('export-target-select');

            // Populate names dynamically
            const uniqueNames = [...new Set(state.records.map(r => r.name))];
            let optionsHTML = `<option value="ALL">အားလုံး (All Data)</option>`;
            uniqueNames.forEach(n => {
                optionsHTML += `<option value="${n}">${n} သီးသန့် (Only)</option>`;
            });
            select.innerHTML = optionsHTML;

            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            lucide.createIcons({ root: modal });
        }

        function closeExportModal() {
            const modal = document.getElementById('export-modal');
            const box = document.getElementById('export-box');
            box.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function executeExport() {
            const targetName = document.getElementById('export-target-select').value;
            exportReportTXT(targetName);
        }

        // --- Data Features ---
        function saveData() { localStorage.setItem('lottery_records_ultimate', JSON.stringify(state.records)); }

        function triggerImport() { document.getElementById('import-file').click(); }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        state.records = data;
                        saveData();
                        state.currentPage = 1;
                        renderApp();
                        showToast("Data အောင်မြင်စွာ Restore လုပ်ပြီးပါပြီ။");
                    } else showToast("ဖိုင်အမျိုးအစား မှားယွင်းနေပါသည်။");
                } catch (err) { showToast("JSON ဖိုင်ဖတ်ရာတွင် အမှားအယွင်းရှိပါသည်။"); }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function exportDataJSON() {
            const jsonStr = JSON.stringify(state.records, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Lottery_Backup_${getTodayDate()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Backup ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ။");
        }

        function exportReportTXT(targetName = 'ALL') {
            const recordsToExport = targetName === 'ALL' ? state.records : state.records.filter(r => r.name === targetName);

            if (recordsToExport.length === 0) {
                showToast("မှတ်တမ်းမရှိသေးပါ။");
                closeExportModal();
                return;
            }

            let report = `======================================\n`;
            report += `       2D/3D LOTTERY LEDGER REPORT      \n`;
            report += `======================================\n`;
            report += `Date: ${new Date().toLocaleString()}\n`;
            report += `Target: ${targetName === 'ALL' ? 'All Customers' : targetName + ' (Only)'}\n\n`;
            
            // Calculate balances just for the exported subset
            let totalReceivable = 0, totalPayable = 0;
            const balances = {};
            recordsToExport.forEach(r => {
                if (!balances[r.name]) balances[r.name] = 0;
                balances[r.name] += r.netBalance;
            });

            Object.values(balances).forEach(amt => {
                if (amt > 0) totalReceivable += amt;
                else totalPayable += Math.abs(amt);
            });

            report += `[ အချုပ်စာရင်း ]\n--------------------------------------\n`;
            report += `ရရန်ရှိငွေ : ${formatMoney(totalReceivable)}\n`;
            report += `ပေးရန်ရှိငွေ : ${formatMoney(totalPayable)}\n`;
            report += `အသားတင်  : ${formatMoney(totalReceivable - totalPayable)}\n\n`;
            
            if (targetName === 'ALL') {
                report += `[ တစ်ဦးချင်းစီ လက်ကျန်ငွေ ]\n--------------------------------------\n`;
                for (const [name, amt] of Object.entries(balances)) {
                    report += `${name.padEnd(15, ' ')} : ${amt >= 0 ? '+' : ''}${formatMoney(amt)}\n`;
                }
                report += `\n`;
            }
            
            report += `[ မှတ်တမ်းများ ]\n--------------------------------------\n`;
            recordsToExport.forEach((r, idx) => {
                 report += `${idx+1}. Date: ${r.date} | ${r.session} | Name: ${r.name}\n`;
                 report += `   Bet: ${r.betAmount} | Win: ${r.totalWin} | Repay: ${r.repayment} | Exp: ${r.expense}\n`;
                 report += `   Net: ${r.netBalance >= 0 ? '+' : ''}${r.netBalance} Ks\n\n`;
            });
            
            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // Clean filename by replacing spaces with underscore if needed
            const safeName = targetName.replace(/\s+/g, '_');
            a.download = `Lottery_Report_${safeName}_${getTodayDate()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Report ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ။");
            closeExportModal();
        }

        // --- Records Logic ---
        
        function updateDynamicDropdowns() {
            const uniqueNames = [...new Set(state.records.map(r => r.name))];
            
            const dataList = document.getElementById('nameList');
            if(dataList) {
                dataList.innerHTML = uniqueNames.map(n => `<option value="${n}"></option>`).join('');
            }
            
            const filterSelect = document.getElementById('filterSelect');
            if(filterSelect) {
                const currentVal = filterSelect.value;
                filterSelect.innerHTML = `<option value="ALL">အားလုံးပြပါ (All)</option>` + 
                                       uniqueNames.map(n => `<option value="${n}">${n}</option>`).join('');
                if(uniqueNames.includes(currentVal)) filterSelect.value = currentVal;
                else state.filterName = 'ALL';
            }
        }

        function handleAddRecord(e) {
            e.preventDefault();
            const name = document.getElementById('record-name').value.trim();
            const date = document.getElementById('record-date').value;
            const session = document.getElementById('record-session').value;
            
            const betAmount = parseFloat(document.getElementById('record-bet').value) || 0;
            const winBase = parseFloat(document.getElementById('record-win').value) || 0;
            const multiplier = parseFloat(document.getElementById('record-multiplier').value) || 80;
            const repayment = parseFloat(document.getElementById('record-repay').value) || 0;
            const expense = parseFloat(document.getElementById('record-expense').value) || 0;

            const totalWin = winBase * multiplier;
            const netBalance = (betAmount + expense) - (totalWin + repayment);

            state.records.unshift({ id: Date.now(), name, date, session, betAmount, winBase, multiplier, totalWin, repayment, expense, netBalance });
            state.currentPage = 1; 
            saveData();
            
            ['record-bet', 'record-win', 'record-repay', 'record-expense'].forEach(id => document.getElementById(id).value = '');
            
            updateDynamicDropdowns();
            renderTableAndPagination();
            showToast("စာရင်းသွင်းပြီးပါပြီ။");
        }

            showConfirm("ဤမှတ်တမ်းကို ဖျက်ရန် သေချာပါသလား?", () => {
                state.records = state.records.filter(r => r.id !== id);
                saveData();
                updateDynamicDropdowns();
                renderTableAndPagination(); 
                showToast("မှတ်တမ်း ဖျက်ပြီးပါပြီ။");
            });
        }

        function renderTableAndPagination() {
            const container = document.getElementById('records-table-container');
            if (!container) return;

            let display = state.records.filter(r => {
                const matchN = state.filterName === 'ALL' || r.name === state.filterName;
                const search = state.searchQuery.toLowerCase();
                const matchS = r.name.toLowerCase().includes(search) || r.session.toLowerCase().includes(search) || r.date.includes(search);
                return matchN && matchS;
            });

            display.sort((a, b) => {
                if (state.sortMode === 'newest') return b.id - a.id;
                if (state.sortMode === 'oldest') return a.id - b.id;
                if (state.sortMode === 'high_net') return b.netBalance - a.netBalance;
                return 0;
            });

            const total = display.length;
            const totalPages = Math.ceil(total / state.itemsPerPage) || 1;
            if (state.currentPage > totalPages) state.currentPage = totalPages;
            if (state.currentPage < 1) state.currentPage = 1;
            
            const paginated = display.slice((state.currentPage - 1) * state.itemsPerPage, state.currentPage * state.itemsPerPage);

            if (paginated.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-500 glass-card rounded-2xl">မှတ်တမ်း မရှိပါ</div>`;
                return;
            }

            let deskHTML = `<div class="hidden md:block glass-card rounded-2xl overflow-hidden mb-4"><table class="w-full text-left text-sm"><thead class="bg-slate-900/80 text-slate-400 text-[10px] uppercase border-b border-white/5"><tr><th class="p-3">Date</th><th class="p-3">Name</th><th class="p-3 text-right">Bet</th><th class="p-3 text-right">Win</th><th class="p-3 text-right">Ex/Re</th><th class="p-3 text-right">Net</th><th class="p-3"></th></tr></thead><tbody class="divide-y divide-white/5">`;
            
            let mobHTML = `<div class="md:hidden space-y-3 mb-4">`;

            paginated.forEach(r => {
                const isRecv = r.netBalance >= 0;
                const cColor = isRecv ? 'text-emerald-400' : 'text-rose-400';
                const sColor = isRecv ? 'border-l-emerald-500' : 'border-l-rose-500';
                
                let win = r.totalWin > 0 ? `<span class="text-rose-400">${r.totalWin}</span><br><span class="text-[9px] text-slate-500">(${r.winBase}x${r.multiplier})</span>` : '-';
                let exRe = (r.repayment>0?`<span class="text-cyan-400 text-[10px]">ဆပ်:${r.repayment}</span><br>`:'') + (r.expense>0?`<span class="text-orange-400 text-[10px]">စ:${r.expense}</span>`:'') || '-';

                deskHTML += `<tr class="hover:bg-white/5"><td class="p-3 font-num"><span class="block">${formatDateDisplay(r.date)}</span><span class="text-[9px] text-slate-400">${r.session}</span></td><td class="p-3 font-bold">${r.name}</td><td class="p-3 text-right font-num text-emerald-400">${r.betAmount||'-'}</td><td class="p-3 text-right font-num">${win}</td><td class="p-3 text-right">${exRe}</td><td class="p-3 text-right font-bold font-num ${cColor}">${r.netBalance}</td><td class="p-3 text-right"><button onclick="deleteRecord(${r.id})" class="text-slate-500 hover:text-rose-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`;

                mobHTML += `<div class="glass-card p-3 rounded-2xl border-l-4 ${sColor}"><div class="flex justify-between items-center border-b border-white/5 pb-2 mb-2"><div class="font-bold text-sm text-white">${r.name} <span class="text-[10px] text-slate-500 font-normal ml-2">${formatDateDisplay(r.date)}</span></div><button onclick="deleteRecord(${r.id})" class="text-slate-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div><div class="grid grid-cols-2 gap-2 text-xs mb-2"><div class="bg-slate-900/50 p-1.5 rounded"><span class="text-slate-500 text-[10px] block">ထိုးကြေး</span><span class="text-emerald-400">${r.betAmount||'-'}</span></div><div class="bg-slate-900/50 p-1.5 rounded"><span class="text-slate-500 text-[10px] block">ပေါက်ကြေး</span><span class="text-rose-400">${r.totalWin||'-'}</span></div></div><div class="flex justify-between items-end"><div class="text-[10px]">${exRe}</div><div class="text-right text-base font-bold ${cColor}">${r.netBalance} Ks</div></div></div>`;
            });

            deskHTML += `</tbody></table></div>`;
            mobHTML += `</div>`;

            const pageHTML = total > 0 ? `
                <div class="flex justify-between items-center bg-slate-900/40 p-3 rounded-xl border border-white/5 text-xs">
                    <span class="text-slate-400">Total: ${total}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="changePage(-1)" ${state.currentPage===1?'disabled':''} class="p-1 rounded bg-white/5 disabled:opacity-30"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <span class="text-cyan-400">${state.currentPage} / ${totalPages}</span>
                        <button onclick="changePage(1)" ${state.currentPage===totalPages?'disabled':''} class="p-1 rounded bg-white/5 disabled:opacity-30"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>` : '';

            container.innerHTML = deskHTML + mobHTML + pageHTML;
            lucide.createIcons({ root: container });
        }

        function renderApp() {
            renderNavigation();
            const content = document.getElementById('app-content');
            
            if (state.activeTab === 'dashboard') {
                content.innerHTML = renderDashboard();
                lucide.createIcons({ root: content });
            } else if (state.activeTab === 'records') {
                content.innerHTML = renderRecordsShell();
                lucide.createIcons({ root: content });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderApp();
            setTimeout(() => {
                const p = document.getElementById('preloader');
                if(p) { p.classList.add('opacity-0'); setTimeout(() => p.remove(), 500); }
            }, 600);
        });

    </script>
</body>
</html>
