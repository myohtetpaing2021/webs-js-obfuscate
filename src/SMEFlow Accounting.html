<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SME Flow - Ultimate Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Padauk', 'sans-serif'],
                        num: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#020617', // Deep Space
                            900: '#0f172a',
                            800: '#1e293b',
                        },
                        primary: {
                            400: '#38bdf8', // Sky
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out infinite 4s',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'spin-slow': 'spin 3s linear infinite',
                        'spin-reverse': 'spin-reverse 4s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        slideUp: {
                            'from': { opacity: 0, transform: 'translateY(20px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            'from': { opacity: 0 },
                            'to': { opacity: 1 },
                        },
                        'spin-reverse': {
                            'from': { transform: 'rotate(360deg)' },
                            'to': { transform: 'rotate(0deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Remove Spinners from Number Inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Premium Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.6) 100%);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(56, 189, 248, 0.1); /* Subtle blue glow */
        }
        
        .glass-card:hover::before {
            opacity: 1;
        }

        /* Input Styling */
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        
        /* Neon text utility */
        .text-neon-blue {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <!-- PRELOADER -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020617] flex flex-col items-center justify-center transition-all duration-1000 ease-out overflow-hidden">
        <!-- Background Grid Animation -->
        <div class="absolute inset-0 opacity-20" 
             style="background-image: radial-gradient(#38bdf8 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(20deg);">
        </div>

        <div class="relative flex flex-col items-center">
            <!-- Central Tech Spinner -->
            <div class="relative w-40 h-40 flex items-center justify-center mb-10">
                <!-- Outer Ring -->
                <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-cyan-500 border-l-cyan-500/30 animate-[spin_2s_linear_infinite] shadow-[0_0_30px_rgba(6,182,212,0.2)]"></div>
                <!-- Inner Ring -->
                <div class="absolute inset-3 rounded-full border-2 border-transparent border-b-violet-500 border-r-violet-500/30 animate-[spin_3s_linear_infinite_reverse]"></div>
                <!-- Core -->
                <div class="relative z-10 w-20 h-20 bg-gradient-to-br from-cyan-950 to-slate-900 rounded-full flex items-center justify-center border border-white/10 shadow-[0_0_50px_rgba(6,182,212,0.4)] animate-pulse">
                    <div class="absolute inset-0 bg-cyan-500/20 rounded-full blur-xl animate-pulse"></div>
                    <i data-lucide="zap" class="text-white w-8 h-8 relative z-10 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]"></i>
                </div>
            </div>
            
            <!-- Text & Progress -->
            <div class="w-64 space-y-4">
                <div class="text-center">
                    <h2 class="text-3xl font-bold tracking-[0.2em] text-white font-num mb-1">SME<span class="text-cyan-400">FLOW</span></h2>
                    <p class="text-[10px] text-cyan-500/70 font-num tracking-[0.4em] uppercase">System Initializing</p>
                </div>
                
                <!-- Progress Bar Container -->
                <div class="h-1 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 relative">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-500 w-0 shadow-[0_0_20px_rgba(6,182,212,0.8)] relative">
                        <div class="absolute right-0 top-0 bottom-0 w-2 bg-white/50 blur-[2px]"></div>
                    </div>
                </div>
                
                <!-- Stats Row -->
                <div class="flex justify-between text-[10px] font-num text-slate-400 font-medium tracking-wider">
                    <span class="animate-pulse">LOADING ASSETS...</span>
                    <span id="progress-text" class="text-cyan-400 font-bold">0%</span>
                </div>
            </div>
        </div>
        
        <!-- Bottom Version -->
        <div class="absolute bottom-8 text-[9px] text-slate-600 font-num tracking-widest uppercase">
            v2.5 Ultimate Edition
        </div>
    </div>

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- Deep gradients -->
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px] animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-600/10 rounded-full blur-[120px] animate-float-delayed"></div>
        <div class="absolute top-[30%] left-[40%] w-[40%] h-[40%] bg-violet-600/5 rounded-full blur-[100px] animate-pulse-slow"></div>
        
        <!-- Tech Grid -->
        <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>
    </div>

    <div class="min-h-screen flex flex-col md:flex-row relative z-10">
        
        <!-- SIDEBAR (Desktop) -->
        <aside class="hidden md:flex w-72 glass-panel border-r border-white/5 flex-col m-4 rounded-3xl h-[calc(100vh-2rem)] sticky top-4 shadow-2xl z-20 transition-all">
            <div class="p-8 pb-6">
                <div class="flex items-center gap-3 mb-1">
                    <div class="w-12 h-12 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] border border-white/10 relative overflow-hidden group">
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                        <i data-lucide="zap" class="text-white w-6 h-6 relative z-10"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight font-num">SME<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Flow</span></h1>
                        <p class="text-[10px] text-slate-400 font-medium tracking-[0.2em] uppercase">Accounting</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2 mt-4" id="desktop-nav">
                <!-- Nav items injected by JS -->
            </nav>

            <div class="p-6 mt-auto">
                <div class="glass-card p-4 rounded-2xl border border-emerald-500/20 bg-emerald-500/5 relative overflow-hidden group cursor-default">
                    <div class="absolute inset-0 bg-emerald-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div class="flex items-center gap-3 relative z-10">
                        <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)] animate-pulse"></div>
                        <div>
                            <h4 class="text-xs font-bold text-emerald-300">System Online</h4>
                            <p class="text-[10px] text-emerald-400/60 font-num">v2.5 Ultimate</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MOBILE HEADER -->
        <div class="md:hidden fixed top-0 left-0 right-0 z-40 bg-[#020617]/80 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="zap" class="text-white w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg text-white font-num">SME<span class="text-cyan-400">Flow</span></span>
            </div>
            <div class="w-9 h-9 rounded-full bg-slate-800/80 border border-white/10 flex items-center justify-center text-slate-400 relative backdrop-blur-md">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full absolute top-0 right-0 border-2 border-[#020617] shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                <i data-lucide="bell" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative z-10 pt-20 md:pt-4 md:px-0 pb-28 md:pb-4 h-screen overflow-y-auto custom-scrollbar scroll-smooth">
            <div id="app-content" class="max-w-7xl mx-auto px-4 md:px-8 space-y-8 animate-slide-up pb-10">
                <!-- Dynamic Content injected here -->
            </div>
        </main>

        <!-- EDIT MODAL OVERLAY (Responsive) -->
        <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
            <!-- Modal Container: Full width on mobile, max-xl on desktop -->
            <div class="glass-panel w-full max-w-xl rounded-3xl p-6 md:p-8 relative border border-white/10 shadow-2xl overflow-y-auto max-h-[90vh]">
                <button onclick="closeModal()" class="absolute right-5 top-5 p-2 rounded-full bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <h3 class="text-xl font-bold text-white mb-2 flex items-center gap-2" id="modal-title">
                    <i data-lucide="edit-3" class="w-5 h-5 text-cyan-400"></i> Edit Entry
                </h3>
                <p class="text-xs text-slate-400 mb-6">စာရင်းအချက်အလက်များကို ပြင်ဆင်ရန်</p>
                <div id="modal-content">
                    <!-- Dynamic Inputs will be injected here -->
                </div>
            </div>
        </div>

        <!-- MOBILE BOTTOM NAV -->
        <div class="md:hidden fixed bottom-6 left-4 right-4 h-[70px] glass-panel rounded-2xl border border-white/10 z-50 flex items-center justify-between px-2 shadow-[0_10px_30px_rgba(0,0,0,0.5)]" id="mobile-nav">
            <!-- Mobile nav items injected by JS -->
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- State Management ---
        const state = {
            activeTab: 'dashboard',
            sales: [
                { id: 1, date: '02-02-2024', customer: 'Shop A', item: 'Soft Drink', qty: 100, price: 5000, paid: 200000 },
                { id: 2, date: '02-02-2024', customer: 'Shop B', item: 'Beer', qty: 50, price: 5000, paid: 150000 },
                { id: 3, date: '04-02-2024', customer: 'Shop C', item: 'Snacks', qty: 30, price: 5000, paid: 150000 },
            ],
            purchases: [
                { id: 1, date: '01-02-2024', supplier: 'Wholesaler One', item: 'Mixed Items', qty: 500, cost: 4000, paid: 2000000 },
            ],
            expenses: [
                { id: 1, date: '01-02-2024', description: 'Labor Charges', amount: 18000 },
                { id: 2, date: '02-02-2024', description: 'Transportation', amount: 50000 },
            ],
            initialCash: 4000000
        };

        // --- Helper Functions ---
        const formatMoney = (amount) => Number(amount).toLocaleString();
        
        // Helper to get today's date in DD-MM-YYYY format
        const getTodayDate = () => {
            const d = new Date();
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}-${month}-${year}`;
        };

        // FIX: Ensure formatDate is defined
        const formatDate = (dateString) => {
            if (!dateString) return '';
            // If it matches YYYY-MM-DD (4 digits start), convert. Else return.
            if (dateString.includes('-') && dateString.split('-')[0].length === 4) {
                 const [year, month, day] = dateString.split('-');
                 return `${day}-${month}-${year}`;
            }
            return dateString;
        };
        
        const calculateMetrics = () => {
            const totalSalesAmount = state.sales.reduce((acc, curr) => acc + (curr.qty * curr.price), 0);
            const totalSalesReceived = state.sales.reduce((acc, curr) => acc + curr.paid, 0);
            const totalReceivable = totalSalesAmount - totalSalesReceived;

            const totalPurchaseAmount = state.purchases.reduce((acc, curr) => acc + (curr.qty * curr.cost), 0);
            const totalPurchasePaid = state.purchases.reduce((acc, curr) => acc + curr.paid, 0);

            const totalItemsPurchased = state.purchases.reduce((acc, curr) => acc + curr.qty, 0);
            const totalItemsSold = state.sales.reduce((acc, curr) => acc + curr.qty, 0);
            const currentInventoryQty = totalItemsPurchased - totalItemsSold;
            
            const averageCost = totalItemsPurchased > 0 ? totalPurchaseAmount / totalItemsPurchased : 0;
            const inventoryValue = currentInventoryQty * averageCost;

            const totalExpenses = state.expenses.reduce((acc, curr) => acc + curr.amount, 0);
            const cashBalance = state.initialCash + totalSalesReceived - totalPurchasePaid - totalExpenses;

            const cogs = totalItemsSold * averageCost;
            const grossProfit = totalSalesAmount - cogs;
            const netProfit = grossProfit - totalExpenses;

            return { totalSalesAmount, totalReceivable, currentInventoryQty, inventoryValue, totalExpenses, cashBalance, netProfit, cogs };
        };

        // Get recent 5 transactions mixed
        const getRecentActivities = () => {
            const all = [
                ...state.sales.map(s => ({ ...s, type: 'sale', title: 'အရောင်း: ' + s.customer, amount: s.qty * s.price, color: 'blue', icon: 'shopping-cart' })),
                ...state.purchases.map(p => ({ ...p, type: 'purchase', title: 'အဝယ်: ' + p.supplier, amount: p.qty * p.cost, color: 'violet', icon: 'shopping-bag' })),
                ...state.expenses.map(e => ({ ...e, type: 'expense', title: 'စရိတ်: ' + e.description, amount: e.amount, color: 'rose', icon: 'file-text' }))
            ];
            // Sort by ID (timestamp) descending
            return all.sort((a, b) => b.id - a.id).slice(0, 5);
        };

        function exportReport() {
            const m = calculateMetrics();
            const date = new Date().toLocaleDateString();
            let report = `SME Flow - Accounting Report\nGenerated on: ${date}\n--------------------------------\n\n`;
            
            report += `=== FINANCIAL SUMMARY ===\n`;
            report += `Current Cash Balance : ${formatMoney(m.cashBalance)} Ks\n`;
            report += `Total Sales          : ${formatMoney(m.totalSalesAmount)} Ks\n`;
            report += `Total Expenses       : ${formatMoney(m.totalExpenses)} Ks\n`;
            report += `Net Profit           : ${formatMoney(Math.round(m.netProfit))} Ks\n`;
            
            report += `\n=== SALES HISTORY ===\n`;
            state.sales.forEach(s => {
                const total = s.qty * s.price;
                const due = total - s.paid;
                report += `${s.date} | ${s.customer} | ${s.item} x${s.qty} | Total: ${formatMoney(total)} | Paid: ${formatMoney(s.paid)}\n`;
            });

            const blob = new Blob([report], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SME_Report_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function resetData() {
            if(confirm('စာရင်းအားလုံးကို ဖျက်ပြီး မူလအစအတိုင်း ပြန်ထားရန် သေချာပါသလား?\n(All data will be permanently deleted)')) {
                state.sales = [];
                state.purchases = [];
                state.expenses = [];
                renderApp();
            }
        }

        // --- Render Functions ---

        function renderNavigation() {
            const tabs = [
                { id: 'dashboard', label: 'ပင်မ', labelDesk: 'ပင်မစာမျက်နှာ', icon: 'layout-dashboard' },
                { id: 'sales', label: 'အရောင်း', labelDesk: 'အရောင်းစာရင်း', icon: 'shopping-cart' },
                { id: 'add', label: 'Add', icon: 'plus', isAction: true },
                { id: 'purchases', label: 'အဝယ်', labelDesk: 'အဝယ်စာရင်း', icon: 'shopping-bag' },
                { id: 'expenses', label: 'စရိတ်', labelDesk: 'ကုန်ကျစရိတ်', icon: 'file-text' },
            ];

            // Desktop Nav
            const desktopNav = document.getElementById('desktop-nav');
            desktopNav.innerHTML = tabs.filter(t => !t.isAction).map(tab => `
                <button onclick="switchTab('${tab.id}')" 
                    class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-300 group relative overflow-hidden ${state.activeTab === tab.id ? 'text-white bg-white/5 border border-white/5 shadow-lg' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
                    ${state.activeTab === tab.id ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-cyan-400 to-blue-500 rounded-l-full"></div>' : ''}
                    <i data-lucide="${tab.icon}" class="w-5 h-5 relative z-10 transition-transform duration-300 ${state.activeTab === tab.id ? 'text-cyan-400 scale-110' : 'group-hover:scale-110'}"></i>
                    <span class="font-medium relative z-10 tracking-wide">${tab.labelDesk}</span>
                    ${state.activeTab === tab.id ? '<div class="absolute right-4 w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>' : ''}
                </button>
            `).join('');

            // Mobile Nav
            const mobileNav = document.getElementById('mobile-nav');
            mobileNav.innerHTML = tabs.map(tab => {
                if (tab.isAction) {
                    return `
                        <button onclick="switchTab('sales')" 
                            class="w-14 h-14 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-full -mt-12 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.5)] border-4 border-[#020617] cursor-pointer active:scale-95 transition-transform hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] group">
                            <i data-lucide="plus" class="text-white w-7 h-7 group-hover:rotate-90 transition-transform duration-300"></i>
                        </button>
                    `;
                }
                const isActive = state.activeTab === tab.id;
                return `
                    <button onclick="switchTab('${tab.id}')" class="flex-1 flex flex-col items-center justify-center h-full relative group">
                        <div class="absolute -top-1 w-8 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent rounded-full opacity-0 transition-opacity ${isActive ? 'opacity-100' : ''}"></div>
                        <div class="p-2 rounded-xl transition-all duration-300 ${isActive ? 'text-cyan-400 bg-cyan-500/10' : 'text-slate-500 group-hover:text-slate-300'}">
                            <i data-lucide="${tab.icon}" class="w-6 h-6 ${isActive ? 'fill-cyan-500/20' : ''}"></i>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function renderDashboard() {
            const m = calculateMetrics();
            const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            const recentItems = getRecentActivities();

            return `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl md:text-4xl font-bold text-white mb-1 font-num tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Dashboard</h2>
                        <p class="text-slate-400 text-sm flex items-center gap-2">
                             <i data-lucide="activity" class="w-3 h-3 text-emerald-400"></i> Live Overview
                        </p>
                    </div>
                    <div class="bg-white/5 backdrop-blur-md px-5 py-2.5 rounded-full border border-white/10 text-xs text-slate-300 font-num flex items-center gap-2 shadow-lg">
                        <i data-lucide="calendar" class="w-3 h-3 text-cyan-400"></i>
                        ${dateStr}
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5 mb-8">

                    ${state.expenses.map(ex => `
                        <div class="glass-card p-5 rounded-2xl flex justify-between items-center animate-slide-up hover:bg-white/5 cursor-pointer group">
                        <div class="flex gap-5 items-center">
                            <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-400 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                                <i data-lucide="receipt" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-base group-hover:text-rose-400 transition-colors">${ex.description}</h4>
                                <p class="text-xs text-slate-500 font-num mt-1">${ex.date}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 md:gap-6">
                            <div class="text-right">
                                <p class="font-bold text-white font-num text-lg">${formatMoney(ex.amount)}</p>
                                <p class="text-[10px] font-bold uppercase mt-1 text-rose-400">Expense</p>
                            </div>
                            <button onclick="openEditModal('expense', ${ex.id})" class="p-2 rounded-lg text-slate-600 hover:text-blue-400 hover:bg-blue-500/10 transition-all"><i data-lucide="pencil" class="w-5 h-5"></i></button>
                            <button onclick="deleteExpense(${ex.id})" class="p-2 rounded-lg text-slate-600 hover:text-red-400 hover:bg-red-500/10 transition-all"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                        </div>`
                    ).join('')}
                 </div>
            `;
        }

        // --- Component Generators ---

        function renderStatCard(title, value, subtext, icon, color, trend) {
             const colorStyles = {
                blue: "text-cyan-400 bg-cyan-500/10 border-cyan-500/20 shadow-[0_0_15px_rgba(6,182,212,0.15)]",
                emerald: "text-emerald-400 bg-emerald-500/10 border-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.15)]",
                orange: "text-orange-400 bg-orange-500/10 border-orange-500/20 shadow-[0_0_15px_rgba(249,115,22,0.15)]",
                purple: "text-violet-400 bg-violet-500/10 border-violet-500/20 shadow-[0_0_15px_rgba(139,92,246,0.15)]",
            };
            const c = colorStyles[color];

            return `
            <div class="glass-card p-6 rounded-3xl relative overflow-hidden group">
                <div class="absolute -right-6 -top-6 p-10 rounded-full ${c} opacity-10 blur-2xl transition-all duration-700 group-hover:opacity-20 group-hover:scale-125"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-6">
                        <div class="p-3.5 rounded-2xl ${c} transition-transform duration-300 group-hover:rotate-6">
                            <i data-lucide="${icon}" class="w-6 h-6"></i>
                        </div>
                        ${trend ? `<div class="flex items-center gap-1 text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20 shadow-sm"><i data-lucide="trending-up" class="w-3 h-3"></i> ${trend}</div>` : ''}
                    </div>
                    <h4 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">${title}</h4>
                    <h3 class="text-2xl md:text-3xl font-bold text-white font-num tracking-tight mb-1 text-neon-blue">${formatMoney(value)}</h3>
                    <p class="text-[11px] text-slate-500 font-medium">${subtext}</p>
                </div>
            </div>`;
        }

        function renderBar(label, value, width, color) {
            const gradient = color === 'blue' 
                ? 'from-cyan-500 via-blue-500 to-blue-600' 
                : 'from-rose-500 via-pink-500 to-purple-600';
            
            const shadow = color === 'blue'
                ? 'shadow-[0_0_20px_rgba(6,182,212,0.4)]'
                : 'shadow-[0_0_20px_rgba(244,63,94,0.4)]';

            return `
             <div class="group">
                <div class="flex justify-between text-xs mb-3 font-medium">
                    <span class="text-slate-300 group-hover:text-white transition-colors">${label}</span>
                    <span class="text-white font-num font-bold">${formatMoney(value)} Ks</span>
                </div>
                <div class="h-4 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 p-0.5">
                    <div class="h-full bg-gradient-to-r ${gradient} rounded-full ${shadow} transition-all duration-1000 ease-out relative overflow-hidden" style="width: ${width}">
                        <div class="absolute inset-0 bg-white/20 animate-[shimmer_2s_infinite] skew-x-12"></div>
                    </div>
                </div>
            </div>`;
        }

        function renderActivityItem(item) {
             const style = {
                 blue: { bg: 'bg-cyan-500/10', text: 'text-cyan-400', border: 'border-cyan-500/20' },
                 violet: { bg: 'bg-violet-500/10', text: 'text-violet-400', border: 'border-violet-500/20' },
                 rose: { bg: 'bg-rose-500/10', text: 'text-rose-400', border: 'border-rose-500/20' }
             }[item.color];

             return `
             <div class="flex gap-4 items-start group cursor-default relative z-10">
                <div class="w-10 h-10 rounded-xl ${style.bg} ${style.text} ${style.border} flex items-center justify-center shrink-0 border shadow-lg group-hover:scale-110 transition-transform duration-300 bg-slate-900">
                    <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-white group-hover:text-cyan-400 transition-colors truncate">${item.title}</p>
                    <div class="flex justify-between items-center mt-0.5">
                        <p class="text-[10px] text-slate-500 font-num">${formatDate(item.date)}</p>
                        <p class="text-xs font-bold font-num ${item.type === 'sale' ? 'text-emerald-400' : 'text-slate-300'}">${formatMoney(item.amount)}</p>
                    </div>
                </div>
            </div>`;
        }

        function renderInput(id, label, type, value, placeholder='') {
            const icon = type === 'number' ? 'hash' : (type === 'date' || id.includes('date') ? 'calendar' : 'type');
            return `
            <div class="flex flex-col gap-2.5 group">
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider pl-1 group-hover:text-cyan-400 transition-colors">${label}</label>
                <div class="relative transition-all duration-200">
                    <input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}" required
                        class="input-field w-full bg-slate-900/40 border border-white/10 rounded-xl px-5 py-3.5 text-sm text-white placeholder-slate-600 focus:outline-none transition-all font-num"
                    />
                    <div class="absolute right-4 top-3.5 text-slate-600 pointer-events-none group-hover:text-slate-400 transition-colors">
                        <i data-lucide="${icon}" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>`;
        }

        // --- Logic & Event Handlers (Same as before) ---

        function switchTab(tabId) {
            state.activeTab = tabId;
            renderApp();
        }

        function handleAddSale(e) {
            e.preventDefault();
            const newSale = {
                id: Date.now(),
                date: document.getElementById('sale-date').value,
                customer: document.getElementById('sale-customer').value,
                item: document.getElementById('sale-item').value,
                qty: Number(document.getElementById('sale-qty').value),
                price: Number(document.getElementById('sale-price').value),
                paid: Number(document.getElementById('sale-paid').value)
            };
            state.sales.unshift(newSale);
            renderApp();
        }

        function openEditModal(type, id) {
            const modal = document.getElementById('edit-modal');
            const content = document.getElementById('modal-content');
            const title = document.getElementById('modal-title');
            
            let html = '';
            
            if (type === 'sale') {
                const item = state.sales.find(s => s.id === id);
                if (!item) return;
                title.innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 text-cyan-400"></i> Edit Sale';
                html = `
                    <form onsubmit="saveEdit(event, 'sale', ${id})" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderInput('edit-date', 'Date', 'text', item.date, 'DD-MM-YYYY')}
                        ${renderInput('edit-customer', 'Customer', 'text', item.customer)}
                        ${renderInput('edit-item', 'Item', 'text', item.item)}
                        ${renderInput('edit-qty', 'Qty', 'number', item.qty)}
                        ${renderInput('edit-price', 'Price', 'number', item.price)}
                        ${renderInput('edit-paid', 'Paid', 'number', item.paid)}
                        <div class="md:col-span-2 flex justify-end gap-3 mt-4">
                            <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-slate-300 hover:bg-white/10 border border-transparent hover:border-white/10 transition-all font-medium text-sm">Cancel</button>
                            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-cyan-500/20">Update Change</button>
                        </div>
                    </form>
                `;
            } else if (type === 'purchase') {
                const item = state.purchases.find(p => p.id === id);
                if (!item) return;
                title.innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 text-violet-400"></i> Edit Purchase';
                html = `
                    <form onsubmit="saveEdit(event, 'purchase', ${id})" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderInput('edit-date', 'Date', 'text', item.date, 'DD-MM-YYYY')}
                        ${renderInput('edit-supplier', 'Supplier', 'text', item.supplier)}
                        ${renderInput('edit-item', 'Item', 'text', item.item)}
                        ${renderInput('edit-qty', 'Qty', 'number', item.qty)}
                        ${renderInput('edit-cost', 'Cost', 'number', item.cost)}
                        ${renderInput('edit-paid', 'Paid', 'number', item.paid)}
                        <div class="md:col-span-2 flex justify-end gap-3 mt-4">
                            <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-slate-300 hover:bg-white/10 border border-transparent hover:border-white/10 transition-all font-medium text-sm">Cancel</button>
                            <button type="submit" class="bg-violet-600 hover:bg-violet-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-violet-500/20">Update Change</button>
                        </div>
                    </form>
                `;
            } else if (type === 'expense') {
                const item = state.expenses.find(e => e.id === id);
                if (!item) return;
                title.innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 text-rose-400"></i> Edit Expense';
                html = `
                    <form onsubmit="saveEdit(event, 'expense', ${id})" class="grid grid-cols-1 gap-4">
                        ${renderInput('edit-date', 'Date', 'text', item.date, 'DD-MM-YYYY')}
                        ${renderInput('edit-desc', 'Description', 'text', item.description)}
                        ${renderInput('edit-amount', 'Amount', 'number', item.amount)}
                        <div class="flex justify-end gap-3 mt-4">
                            <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-slate-300 hover:bg-white/10 border border-transparent hover:border-white/10 transition-all font-medium text-sm">Cancel</button>
                            <button type="submit" class="bg-rose-600 hover:bg-rose-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-rose-500/20">Update Change</button>
                        </div>
                    </form>
                `;
            }

            content.innerHTML = html;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveEdit(e, type, id) {
            e.preventDefault();
            
            if (type === 'sale') {
                const index = state.sales.findIndex(s => s.id === id);
                if (index !== -1) {
                    state.sales[index] = {
                        id: id,
                        date: document.getElementById('edit-date').value,
                        customer: document.getElementById('edit-customer').value,
                        item: document.getElementById('edit-item').value,
                        qty: Number(document.getElementById('edit-qty').value),
                        price: Number(document.getElementById('edit-price').value),
                        paid: Number(document.getElementById('edit-paid').value)
                    };
                }
            } else if (type === 'purchase') {
                const index = state.purchases.findIndex(p => p.id === id);
                if (index !== -1) {
                    state.purchases[index] = {
                        id: id,
                        date: document.getElementById('edit-date').value,
                        supplier: document.getElementById('edit-supplier').value,
                        item: document.getElementById('edit-item').value,
                        qty: Number(document.getElementById('edit-qty').value),
                        cost: Number(document.getElementById('edit-cost').value),
                        paid: Number(document.getElementById('edit-paid').value)
                    };
                }
            } else if (type === 'expense') {
                const index = state.expenses.findIndex(ex => ex.id === id);
                if (index !== -1) {
                    state.expenses[index] = {
                        id: id,
                        date: document.getElementById('edit-date').value,
                        description: document.getElementById('edit-desc').value,
                        amount: Number(document.getElementById('edit-amount').value)
                    };
                }
            }
            
            closeModal();
            renderApp();
        }

        function deleteSale(id) {
            if(confirm('ဖျက်ရန် သေချာပါသလား?')) {
                state.sales = state.sales.filter(s => s.id !== id);
                renderApp();
            }
        }

        function handleAddPurchase(e) {
            e.preventDefault();
            const newPur = {
                id: Date.now(),
                date: document.getElementById('pur-date').value,
                supplier: document.getElementById('pur-supplier').value,
                item: document.getElementById('pur-item').value,
                qty: Number(document.getElementById('pur-qty').value),
                cost: Number(document.getElementById('pur-cost').value),
                paid: Number(document.getElementById('pur-paid').value)
            };
            state.purchases.unshift(newPur);
            renderApp();
        }

        function deletePurchase(id) {
            if(confirm('ဖျက်ရန် သေချာပါသလား?')) {
                state.purchases = state.purchases.filter(p => p.id !== id);
                renderApp();
            }
        }

         function handleAddExpense(e) {
            e.preventDefault();
            const newExp = {
                id: Date.now(),
                date: document.getElementById('exp-date').value,
                description: document.getElementById('exp-desc').value,
                amount: Number(document.getElementById('exp-amount').value),
            };
            state.expenses.unshift(newExp);
            renderApp();
        }

        function deleteExpense(id) {
             if(confirm('ဖျက်ရန် သေချာပါသလား?')) {
                state.expenses = state.expenses.filter(e => e.id !== id);
                renderApp();
            }
        }

        // --- Main Render Loop ---
        function renderApp() {
            renderNavigation();
            
            const content = document.getElementById('app-content');
            if (state.activeTab === 'dashboard') content.innerHTML = renderDashboard();
            else if (state.activeTab === 'sales') content.innerHTML = renderSales();
            else if (state.activeTab === 'purchases') content.innerHTML = renderPurchases();
            else if (state.activeTab === 'expenses') content.innerHTML = renderExpenses();
            
            lucide.createIcons();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            
            // Preloader logic
            const progress = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            const preloader = document.getElementById('preloader');
            let width = 0;

            const interval = setInterval(() => {
                width += Math.random() * 5; // Random speed
                if (width > 100) width = 100;
                
                if (progress) progress.style.width = width + '%';
                if (text) text.innerText = Math.floor(width) + '%';

                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if(preloader) {
                            preloader.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
                            setTimeout(() => preloader.remove(), 700);
                        }
                    }, 500); // Wait a bit at 100%
                }
            }, 50); // Update every 50ms
        });

    </script>
</body>
</html>
