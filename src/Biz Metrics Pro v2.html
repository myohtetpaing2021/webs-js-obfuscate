<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SME Business Metrics - Pro Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Padauk', 'sans-serif'],
                        num: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: {
                            950: '#030712', 
                            900: '#0f172a',
                            800: '#1e293b',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'pulse-result': 'pulseResult 0.5s cubic-bezier(0.4, 0, 0.2, 1)',
                        'slide-right': 'slideRight 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            'from': { opacity: 0, transform: 'translateY(15px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        },
                        pulseResult: {
                            '0%': { transform: 'scale(1)', filter: 'brightness(1)' },
                            '50%': { transform: 'scale(1.05)', filter: 'brightness(1.5)', textShadow: '0 0 20px rgba(52,211,153,0.8)' },
                            '100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                        },
                        slideRight: {
                            'from': { opacity: 0, transform: 'translateX(-10px)' },
                            'to': { opacity: 1, transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030712;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Prevent body scroll, everything scrolls inside containers */
        }

        /* Tech Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Premium Glass Effects */
        .glass-header {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 10px 40px -10px rgba(6, 182, 212, 0.15), inset 0 0 20px rgba(6, 182, 212, 0.05);
        }

        /* Result Container Styling */
        .result-hud {
            background: repeating-linear-gradient(
                45deg,
                rgba(15, 23, 42, 0.8),
                rgba(15, 23, 42, 0.8) 10px,
                rgba(30, 41, 59, 0.8) 10px,
                rgba(30, 41, 59, 0.8) 20px
            );
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.1), 0 0 20px rgba(16, 185, 129, 0.05);
        }

        /* Input Styling */
        .input-wrapper {
            position: relative;
            z-index: 1;
        }
        .input-wrapper::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 0.75rem;
            background: linear-gradient(to right, rgba(6,182,212,0.5), rgba(59,130,246,0.5));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .input-wrapper:focus-within::before {
            opacity: 1;
        }
        .input-field {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(3, 7, 18, 0.9);
            border-color: transparent;
            box-shadow: inset 0 0 15px rgba(6,182,212,0.1);
        }

        /* Nav Active State */
        .nav-btn.active {
            background: linear-gradient(90deg, rgba(6,182,212,0.15) 0%, rgba(59,130,246,0.0) 100%);
            border-color: rgba(6,182,212,0.4);
        }
        .nav-btn.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #06b6d4;
            box-shadow: 0 0 10px #06b6d4;
            border-radius: 4px 0 0 4px;
        }

        /* Custom Nav Button Tech Pattern Base64 */
        .bg-tech-dots {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=');
        }

        /* Custom Scrollbar for Main Content */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Hidden Scrollbar for Sidebar Menu */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen relative">

    <!-- Ambient Grid & Glows -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-grid"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[100px] will-change-transform"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-600/10 rounded-full blur-[100px] will-change-transform"></div>
    </div>

    <!-- HUD Tooltip Popup (Desktop Hover) -->
    <div id="desktopTooltip" class="fixed z-[100] opacity-0 pointer-events-none transition-all duration-200 transform translate-x-4 hidden lg:block">
        <div class="bg-[#0b1121] backdrop-blur-xl border border-cyan-500/40 shadow-[0_0_25px_rgba(6,182,212,0.3)] p-3.5 px-5 min-w-[200px] relative rounded-lg">
            <!-- Clock/HUD styling inner border -->
            <div class="absolute inset-0 border border-cyan-500/10 rounded-lg m-[3px] pointer-events-none"></div>
            <!-- Arrow left -->
            <div class="absolute -left-1.5 top-1/2 -translate-y-1/2 w-3 h-3 bg-[#0b1121] border-l border-b border-cyan-500/40 transform rotate-45 rounded-sm"></div>
            <!-- Dynamic Content -->
            <div id="tooltipContent" class="relative z-10 flex flex-col gap-1"></div>
        </div>
    </div>

    <!-- PRELOADER -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#030712] flex flex-col items-center justify-center transition-all duration-700 ease-out">
        <div class="relative w-24 h-24 flex items-center justify-center mb-6">
            <div class="absolute inset-0 rounded-xl border-2 border-cyan-500/30 animate-[spin_3s_linear_infinite] shadow-[0_0_30px_rgba(6,182,212,0.2)]"></div>
            <div class="absolute inset-2 rounded-xl border-2 border-violet-500/30 animate-[spin_2s_linear_infinite_reverse]"></div>
            <div class="relative z-10 w-12 h-12 bg-gradient-to-br from-cyan-600 to-blue-700 rounded-lg flex items-center justify-center shadow-lg">
                <i data-lucide="cpu" class="text-white w-6 h-6 animate-pulse"></i>
            </div>
        </div>
        <div class="text-center space-y-2">
            <h2 class="text-xl font-black tracking-[0.2em] text-white font-num">SYS<span class="text-cyan-400">INIT</span></h2>
            <div class="h-0.5 w-48 bg-slate-800 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-cyan-400 w-0 transition-all duration-100 shadow-[0_0_10px_#22d3ee]"></div>
            </div>
        </div>
    </div>

    <!-- Header (Fixed Top) -->
    <header class="glass-header h-[70px] fixed top-0 w-full px-4 md:px-6 flex justify-between items-center z-50">
        <div class="flex items-center gap-3 md:gap-4">
            <!-- Mobile Hamburger Toggle -->
            <button id="menuToggleBtn" class="lg:hidden w-10 h-10 flex items-center justify-center rounded-xl bg-slate-900 border border-white/10 text-cyan-400 hover:bg-slate-800 transition-colors focus:outline-none relative z-50">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            
            <div class="w-10 h-10 bg-slate-900 border border-white/10 rounded-xl hidden sm:flex items-center justify-center relative group overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/20 to-blue-600/20 group-hover:opacity-100 opacity-50 transition-opacity"></div>
                <i data-lucide="command" class="text-cyan-400 w-5 h-5 relative z-10"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight text-white font-num flex items-center gap-2">
                    BIZ<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">METRICS</span>
                    <span class="text-[8px] px-1.5 py-0.5 rounded border border-cyan-500/30 text-cyan-400 bg-cyan-500/10 tracking-widest hidden sm:inline-block">PRO</span>
                </h1>
                <p class="text-[9px] text-slate-400 font-num uppercase tracking-[0.2em] mt-0.5 hidden sm:block">Financial Analysis Engine</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 bg-slate-900/50 border border-white/5 px-3 py-1.5 rounded-lg">
                <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.8)] animate-pulse"></div>
                <span class="text-[9px] font-bold text-slate-300 tracking-widest font-num uppercase">System Online</span>
            </div>
        </div>
    </header>

    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[55] hidden lg:hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Sidebar (Fixed Width on Desktop, Drawer on Mobile) -->
    <aside id="sidebar" class="w-[300px] lg:w-[84px] fixed top-0 lg:top-[70px] left-0 h-full lg:h-[calc(100vh-70px)] z-[60] lg:z-40 bg-[#030712]/95 lg:bg-[#030712]/90 backdrop-blur-2xl border-r border-white/5 flex flex-col group/sidebar shadow-2xl lg:shadow-none -translate-x-full lg:translate-x-0 transition-transform duration-300">
        
        <!-- Mobile Sidebar Header -->
        <div class="flex items-center justify-between p-4 lg:hidden border-b border-white/5 shrink-0">
            <h2 class="text-xs font-black uppercase tracking-[0.3em] text-slate-400 font-num flex items-center gap-2">
                <i data-lucide="layers" class="w-4 h-4 text-cyan-500"></i> Modules
            </h2>
            <button id="closeMenuBtn" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Desktop Sidebar Header -->
        <div class="hidden lg:flex items-center justify-center h-16 border-b border-white/5 shrink-0 w-full relative">
            <div class="w-10 h-10 flex items-center justify-center shrink-0">
                <i data-lucide="layers" class="w-5 h-5 text-cyan-500 shrink-0"></i>
            </div>
        </div>

        <!-- Nav List inside Sidebar -->
        <div id="navList" class="flex flex-col gap-3 p-3 lg:p-4 overflow-y-auto hide-scroll flex-1 pb-24 lg:pb-8 min-h-0">
            <!-- Nav Items Injected by JS -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="mainContent" class="fixed top-[70px] left-0 lg:left-[84px] right-0 bottom-0 overflow-y-auto custom-scrollbar px-4 py-6 md:px-8 scroll-smooth z-10 transition-all duration-300">
        <div id="contentContainer" class="max-w-5xl mx-auto space-y-6 pb-20">
            <!-- Dynamic Content Will Render Here -->
        </div>
    </main>

    <script>
        const data = [
            {
                id: 'profit',
                icon: 'activity',
                title: '၁။ အမြတ်ငွေ တွက်ချက်ခြင်း',
                shortName: 'Profit Calculation',
                desc: 'လုပ်ငန်းများအတွက် အခြေခံအကျဆုံး တွက်ချက်မှုဖြစ်ပါတယ်။',
                formulaHTML: `
                    <span class="text-cyan-400">Profit</span> 
                    <span class="text-slate-500">=</span> 
                    <span class="text-emerald-400">Revenue</span> 
                    <span class="text-slate-500">-</span> 
                    <span class="text-rose-400">Cost</span>
                `,
                calcInputs: [
                    { id: 'rev', label: 'စုစုပေါင်းရောင်းရငွေ (ကျပ်)', icon: 'trending-up', color: 'text-emerald-400' },
                    { id: 'cost', label: 'ကုန်ကျစရိတ် (ကျပ်)', icon: 'trending-down', color: 'text-rose-400' }
                ],
                calcFn: (inputs) => inputs.rev - inputs.cost,
                resultLabel: 'အသားတင်အမြတ်ငွေ (Net Profit)',
                resultUnit: 'ကျပ်',
                exampleTitle: 'တွက်ချက်မှု ဥပမာ',
                exampleList: [
                    'ဘာဂါ ၅၀ ရောင်းရတယ် (၁ လုံး = ၃,၀၀၀ ကျပ်) <br><span class="text-slate-400 text-xs font-mono">Revenue = ၁၅၀,၀၀၀ ကျပ်</span>',
                    'ဘာဂါ ၁ လုံး အရင်းက ၂,၀၀၀ ကျပ် <br><span class="text-slate-400 text-xs font-mono">Cost = ၁၀၀,၀၀၀ ကျပ်</span>',
                    '<span class="text-emerald-400 font-bold">အမြတ်: ၁၅၀,၀၀၀ - ၁၀၀,၀၀၀ = ၅၀,၀၀၀ ကျပ်</span>'
                ],
                insight: 'ရောင်းအားဘယ်လောက်တက်တက် ကုန်ကျစရိတ် (အရင်း) ကို မထိန်းချုပ်နိုင်ရင် တကယ့်အမြတ်မကျန်ဘဲ "အမြတ်တု၊ တိုးတက်မှုအစစ်မဖြစ်" ဘူးဆိုတာ သတိပြုပါ။'
            },
            {
                id: 'margin',
                icon: 'percent',
                title: '၂။ အမြတ်ရာခိုင်နှုန်း',
                shortName: 'Profit Margin',
                desc: 'မိမိလုပ်ငန်းရဲ့ အမြတ်အစွန်း ကြီးထွားမှုကို တိုင်းတာရန်ဖြစ်ပါတယ်။',
                formulaHTML: `
                    <span class="text-cyan-400">Margin %</span> 
                    <span class="text-slate-500">=</span>
                    <span class="text-slate-500">(</span>
                    <span class="text-emerald-400">Profit</span>
                    <span class="text-slate-500">/</span>
                    <span class="text-blue-400">Revenue</span>
                    <span class="text-slate-500">)</span>
                    <span class="text-violet-400">× 100</span>
                `,
                calcInputs: [
                    { id: 'profit', label: 'အမြတ်ငွေ (ကျပ်)', icon: 'wallet', color: 'text-emerald-400' },
                    { id: 'rev', label: 'ရောင်းရငွေ (ကျပ်)', icon: 'coins', color: 'text-cyan-400' }
                ],
                calcFn: (inputs) => (inputs.profit / inputs.rev) * 100,
                resultLabel: 'အမြတ်ရာခိုင်နှုန်း (Margin)',
                resultUnit: '%',
                exampleTitle: 'တွက်ချက်မှု ဥပမာ',
                exampleList: [
                    'အင်္ကျီအဝယ်စျေး (အရင်း) = ၈,၀၀၀ ကျပ်',
                    'ရောင်းစျေး = ၁၂,၀၀၀ ကျပ်',
                    'အမြတ်ငွေ = ၄,၀၀၀ ကျပ်',
                    '<span class="text-emerald-400 font-bold">Margin: (၄,၀၀၀ / ၁၂,၀၀၀) × ၁၀၀ = ၃۳%</span>'
                ],
                insight: 'ဆိုင်အများစုက ဒီရာခိုင်နှုန်းကို သေချာမတွက်တတ်ကြပါဘူး။ ဒါကိုမသိရင် ဈေးမှားတင်မိတတ်ပြီး ရေရှည်မှာ အရှုံးပေါ်တတ်ပါတယ်။'
            },
            {
                id: 'price',
                icon: 'tag',
                title: '၃။ ရောင်းစျေး သတ်မှတ်ခြင်း',
                shortName: 'Pricing Strategy',
                desc: 'ကိုယ့်ပစ္စည်းကို ဘယ်လောက်နဲ့ရောင်းရင် လိုချင်တဲ့ အမြတ်ရာခိုင်နှုန်းရမလဲ တွက်တာပါ။',
                formulaHTML: `
                    <span class="text-cyan-400">Price</span> 
                    <span class="text-slate-500">=</span> 
                    <span class="text-rose-400">Cost</span> 
                    <span class="text-slate-500">×</span> 
                    <span class="text-slate-500">(</span>
                    <span class="text-slate-300">1</span>
                    <span class="text-slate-500">+</span>
                    <span class="text-emerald-400">Target Margin %</span>
                    <span class="text-slate-500">)</span>
                `,
                calcInputs: [
                    { id: 'cost', label: 'ပစ္စည်းအရင်း (ကျပ်)', icon: 'package', color: 'text-rose-400' },
                    { id: 'margin', label: 'လိုချင်သော အမြတ် %', icon: 'target', color: 'text-emerald-400' }
                ],
                calcFn: (inputs) => inputs.cost * (1 + (inputs.margin / 100)),
                resultLabel: 'သတ်မှတ်ရမည့် ရောင်းစျေး',
                resultUnit: 'ကျပ်',
                exampleTitle: 'တွက်ချက်မှု ဥပမာ',
                exampleList: [
                    'ဘိုဘာတီး ၁ ခွက် အရင်း = ၁,၅၀၀ ကျပ်',
                    'လိုချင်တဲ့ အမြတ် = ၅၀% (၀.၅)',
                    '<span class="text-emerald-400 font-bold">ရောင်းစျေး: ၁,၅၀၀ × (၁ + ၀.၅) = ၂,၂၅၀ ကျပ်</span>'
                ],
                insight: 'ဆိုင်အများစုက ရောင်းစျေးကို သူများဆိုင်တွေနဲ့ယှဉ်ပြီး ရမ်းသတ်မှတ်တတ်ကြပါတယ်။ အဲဒီလိုလုပ်ရင် ကိုယ့်အရင်းနဲ့မကိုက်ဘဲ အမြတ်ဆုံးရှုံးတတ်ပါတယ်။'
            },
            {
                id: 'bep',
                icon: 'anchor',

                btn.innerHTML = `
                    <div class="flex items-center gap-3 lg:gap-0 lg:justify-center w-full relative z-10">
                        <div class="w-10 h-10 shrink-0 rounded-lg lg:rounded-xl flex items-center justify-center transition-all duration-300 ${isSelected ? 'bg-cyan-500/20 border border-cyan-400/50 shadow-[0_0_15px_rgba(6,182,212,0.3)] lg:scale-110' : 'bg-slate-900/60 border border-white/5 group-hover/btn:border-cyan-500/30 group-hover/btn:bg-slate-800 lg:bg-transparent lg:border-transparent'}">
                            <i data-lucide="${item.icon}" class="w-5 h-5 lg:w-6 lg:h-6 ${iconColor}"></i>
                        </div>
                        
                        <!-- Mobile Details (Hidden on lg screens) -->
                        <div class="flex flex-col justify-center text-left lg:hidden whitespace-nowrap overflow-hidden flex-1">
                            <div class="flex justify-between items-center pr-2">
                                <div class="text-[9px] uppercase tracking-widest font-black font-num ${isSelected ? 'text-cyan-400 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]' : 'text-slate-500'}">MOD 0${index + 1}</div>
                                ${isSelected ? '<div class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] animate-pulse"></div>' : ''}
                            </div>
                            <div class="text-[13px] font-bold truncate w-full ${titleColor}">${item.shortName}</div>
                        </div>
                    </div>
                `;
                
                btn.onclick = () => selectItem(item.id);

                // Desktop Clock-Style Hover Tooltip Action
                btn.onmouseenter = () => {
                    if (window.innerWidth >= 1024) {
                        const tooltip = document.getElementById('desktopTooltip');
                        const tooltipContent = document.getElementById('tooltipContent');
                        const rect = btn.getBoundingClientRect();
                        
                        if(tooltip && tooltipContent) {
                            tooltip.style.top = Math.round(rect.top + (rect.height / 2)) + 'px';
                            tooltip.style.left = Math.round(rect.right + 12) + 'px';
                            tooltip.style.transform = 'translateY(-50%) translateX(0)';
                            tooltip.style.opacity = '1';
                            
                            tooltipContent.innerHTML = `
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-[10px] uppercase tracking-[0.2em] font-black font-num text-cyan-400 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">MODULE 0${index + 1}</span>
                                    <div class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#22d3ee]"></div>
                                </div>
                                <div class="text-[14px] font-bold text-white tracking-wide font-sans">${item.title}</div>
                                <div class="text-[11px] text-slate-400/80 mt-0.5 font-mono">${item.shortName}</div>
                            `;
                        }
                    }
                };

                btn.onmouseleave = () => {
                    if (window.innerWidth >= 1024) {
                        const tooltip = document.getElementById('desktopTooltip');
                        if(tooltip) {
                            tooltip.style.transform = 'translateY(-50%) translateX(10px)';
                            tooltip.style.opacity = '0';
                        }
                    }
                };

                navList.appendChild(btn);
            });
            lucide.createIcons();
        }

        function renderContent() {
            const item = data.find(d => d.id === activeItemId);
            if(!item) return;

            let inputsHTML = item.calcInputs.map(input => `
                <div class="mb-5">
                    <label class="flex items-center gap-2 text-[10px] uppercase tracking-[0.1em] font-bold text-slate-400 mb-2 font-num">
                        <i data-lucide="${input.icon}" class="w-3.5 h-3.5 ${input.color}"></i>
                        ${input.label}
                    </label>
                    <div class="input-wrapper rounded-xl relative">
                        <input type="number" id="input-${input.id}" oninput="calculateResult()" 
                               class="input-field w-full rounded-xl px-4 py-3.5 text-sm text-white outline-none font-mono font-bold placeholder-slate-600 relative z-10"
                               placeholder="0">
                    </div>
                </div>
            `).join('');

            let listHTML = item.exampleList.map(li => `
                <li class="mb-4 text-slate-300 flex items-start text-sm bg-slate-900/30 p-3 rounded-lg border border-white/5 hover:border-white/10 transition-colors animate-slide-right">
                    <div class="bg-cyan-500/10 p-1 rounded-md mr-3 mt-0.5 border border-cyan-500/20 shrink-0">
                        <i data-lucide="check" class="w-3.5 h-3.5 text-cyan-400"></i>
                    </div>
                    <div class="leading-relaxed flex-1">${li}</div>
                </li>
            `).join('');

            const contentHTML = `
                <div class="space-y-6 animate-fade-in relative pb-4">
                    <!-- Title Section -->
                    <div class="flex items-center gap-4 mb-8">
                        <div class="w-14 h-14 shrink-0 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 shadow-xl flex items-center justify-center relative overflow-hidden">
                            <div class="absolute inset-0 bg-cyan-500/20 blur-xl"></div>
                            <i data-lucide="${item.icon}" class="w-7 h-7 text-cyan-400 relative z-10"></i>
                        </div>
                        <div>
                            <h2 class="text-xl md:text-2xl font-black tracking-tight text-white mb-1 font-sans leading-tight">${item.title}</h2>
                            <p class="text-xs text-slate-400 tracking-wide">${item.desc}</p>
                        </div>
                    </div>

                    <!-- Layout Grid -->
                    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
                        
                        <!-- Left Column (Calculator Inputs Only) -->
                        <div class="xl:col-span-7 space-y-6 flex flex-col">
                            
                            <!-- Calculator Inputs -->
                            <div class="glass-card p-5 md:p-8 rounded-[2rem] flex-1">
                                <div class="flex items-center justify-between mb-6 border-b border-white/5 pb-4">
                                    <h3 class="text-[11px] uppercase tracking-widest font-black text-white font-num flex items-center gap-2">
                                        <i data-lucide="cpu" class="w-4 h-4 text-cyan-400"></i> Variables Input
                                    </h3>
                                    <span class="text-[9px] font-mono text-cyan-500/70 bg-cyan-500/10 px-2 py-1 rounded border border-cyan-500/20">LIVE_CALC</span>
                                </div>
                                <div class="space-y-2">
                                    ${inputsHTML}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Right Column (Result & Info) -->
                        <div class="xl:col-span-5 space-y-6 flex flex-col">
                            
                            <!-- Premium Result HUD -->
                            <div class="result-hud rounded-[2rem] p-6 md:p-8 flex flex-col justify-center items-center text-center relative overflow-hidden group min-h-[200px]">
                                <div class="absolute inset-0 bg-gradient-to-t from-emerald-500/10 to-transparent"></div>
                                
                                <div class="absolute top-4 left-4 flex gap-1">
                                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                                    <div class="w-1.5 h-1.5 bg-emerald-500/50 rounded-full"></div>
                                </div>
                                <div class="absolute top-4 right-4 text-[8px] font-mono text-emerald-500/50 border border-emerald-500/20 px-1 rounded">OUTPUT</div>

                                <span class="text-[10px] uppercase tracking-[0.2em] font-bold text-emerald-400/80 mb-4 font-num relative z-10">${item.resultLabel}</span>
                                <div id="result-container" class="text-3xl md:text-4xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-emerald-200 break-all relative z-10 font-mono tracking-tight drop-shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                                    <span id="calc-result">0</span> 
                                    <span class="text-base md:text-xl text-emerald-400/50 font-sans ml-1">${item.resultUnit}</span>
                                </div>
                            </div>

                            <!-- Insight Card -->
                            <div class="glass-card p-5 md:p-6 rounded-[2rem] border-l-4 border-l-amber-500/80 bg-gradient-to-r from-amber-900/20 to-transparent flex-1 relative overflow-hidden">
                                <i data-lucide="lightbulb" class="absolute -right-4 -bottom-4 w-24 h-24 text-amber-500/10 rotate-12"></i>
                                <h3 class="text-[10px] uppercase tracking-widest font-black text-amber-400 mb-3 font-num flex items-center gap-2 relative z-10">
                                    <i data-lucide="zap" class="w-3.5 h-3.5"></i> Pro Insight
                                </h3>
                                <p class="text-sm text-slate-300 leading-relaxed relative z-10 font-medium">${item.insight}</p>
                            </div>

                        </div>
                    </div>

                    <!-- Examples -->
                    <div class="mt-8 glass-card p-5 md:p-6 rounded-2xl border-white/5">
                        <h3 class="text-[11px] uppercase tracking-widest font-black text-slate-400 mb-5 font-num flex items-center gap-2">
                            <i data-lucide="book-open" class="w-4 h-4 text-blue-400"></i> ${item.exampleTitle}
                        </h3>
                        <ul class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${listHTML}
                        </ul>
                    </div>
                </div>
            `;
            
            const container = document.getElementById('contentContainer');
            if(container) {
                container.innerHTML = contentHTML;
                lucide.createIcons();
                
                // Staggered animation for example list
                const listItems = container.querySelectorAll('.animate-slide-right');
                listItems.forEach((li, idx) => {
                    li.style.animationDelay = `${idx * 0.1}s`;
                });
            }
        }

        // Calculation function attached to Window
        window.calculateResult = function() {
            const item = data.find(d => d.id === activeItemId);
            if(!item) return;

            const inputs = {};
            let allFilled = true;

            item.calcInputs.forEach(input => {
                const el = document.getElementById(`input-${input.id}`);
                if(el) {
                    const val = parseFloat(el.value);
                    if(isNaN(val)) {
                        allFilled = false;
                    }
                    inputs[input.id] = val;
                }
            });

            const resultEl = document.getElementById('calc-result');
            const resultContainer = document.getElementById('result-container');
            
            if(allFilled && resultEl) {
                const result = item.calcFn(inputs);
                resultEl.textContent = formatNumber(result);
                
                if(resultContainer) {
                    resultContainer.classList.remove('animate-pulse-result');
                    void resultContainer.offsetWidth; // Trigger reflow
                    resultContainer.classList.add('animate-pulse-result');
                }
            } else if(resultEl) {
                resultEl.textContent = '0';
            }
        }

        function selectItem(id) {
            activeItemId = id;
            initNavigation(); // Updates active state UI
            renderContent();
            
            // Auto close mobile menu on selection
            if(window.innerWidth < 1024) {
                toggleMobileMenu(true);
            }
            
            // Scroll main content to top smoothly
            const mainContent = document.getElementById('mainContent');
            if(mainContent) {
                mainContent.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Mobile Toggle Function
        function toggleMobileMenu(forceClose = false) {
            const sidebar = document.getElementById('sidebar');
            const mobileOverlay = document.getElementById('mobileOverlay');
            
            if(!sidebar || !mobileOverlay) return;
            
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed && !forceClose) {
                // Open menu
                sidebar.classList.remove('-translate-x-full');
                mobileOverlay.classList.remove('hidden');
                setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
            } else {
                // Close menu
                sidebar.classList.add('-translate-x-full');
                mobileOverlay.classList.add('opacity-0');
                setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
            }
        }

        // Run Initialization
        document.addEventListener('DOMContentLoaded', () => {
            initNavigation();
            renderContent();
            
            // Setup Mobile Toggle Events safely
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const closeMenuBtn = document.getElementById('closeMenuBtn');
            const mobileOverlay = document.getElementById('mobileOverlay');
            
            if(menuToggleBtn) menuToggleBtn.addEventListener('click', () => toggleMobileMenu());
            if(closeMenuBtn) closeMenuBtn.addEventListener('click', () => toggleMobileMenu(true));
            if(mobileOverlay) mobileOverlay.addEventListener('click', () => toggleMobileMenu(true));

            // Fast Tech Preloader
            const progress = document.getElementById('progress-bar');
            const preloader = document.getElementById('preloader');
            let width = 0;

            const interval = setInterval(() => {
                width += Math.random() * 20; 
                if (width > 100) width = 100;
                
                if (progress) progress.style.width = width + '%';

                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if(preloader) {
                            preloader.classList.add('-translate-y-full', 'opacity-0');
                            setTimeout(() => preloader.remove(), 700);
                        }
                    }, 300); 
                }
            }, 30); 
        });

    </script>
</body>
</html>
