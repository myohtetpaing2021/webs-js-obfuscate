<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Flow - Ultimate Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Padauk', 'sans-serif'],
                        num: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                        },
                        primary: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out infinite 4s',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        slideUp: {
                            'from': { opacity: 0, transform: 'translateY(20px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            'from': { opacity: 0 },
                            'to': { opacity: 1 },
                        },
                        slideInRight: {
                            'from': { opacity: 0, transform: 'translateX(100%)' },
                            'to': { opacity: 1, transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Remove Spinners from Number Inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Premium Glass Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.6) 100%);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(56, 189, 248, 0.1);
        }
        
        .glass-card:hover::before {
            opacity: 1;
        }

        /* Input Styling */
        .input-field {
            transition: all 0.3s ease;
            color-scheme: dark;
        }
        .input-field:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3), 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.5);
        }
        
        select.input-field option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
        
        /* Neon text utility */
        .text-neon-blue {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <!-- PRELOADER -->
    <div id="preloader" class="fixed inset-0 z-[100] bg-[#020617] flex flex-col items-center justify-center transition-all duration-1000 ease-out overflow-hidden">
        <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#38bdf8 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(20deg);"></div>
        <div class="relative flex flex-col items-center">
            <div class="relative w-40 h-40 flex items-center justify-center mb-10">
                <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-cyan-500 border-l-cyan-500/30 animate-[spin_2s_linear_infinite] shadow-[0_0_30px_rgba(6,182,212,0.2)]"></div>
                <div class="absolute inset-3 rounded-full border-2 border-transparent border-b-violet-500 border-r-violet-500/30 animate-[spin_3s_linear_infinite_reverse]"></div>
                <div class="relative z-10 w-20 h-20 bg-gradient-to-br from-cyan-950 to-slate-900 rounded-full flex items-center justify-center border border-white/10 shadow-[0_0_50px_rgba(6,182,212,0.4)] animate-pulse">
                    <div class="absolute inset-0 bg-cyan-500/20 rounded-full blur-xl animate-pulse"></div>
                    <i data-lucide="package" class="text-white w-8 h-8 relative z-10 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]"></i>
                </div>
            </div>
            <div class="w-64 space-y-4">
                <div class="text-center">
                    <h2 class="text-3xl font-bold tracking-[0.2em] text-white font-num mb-1">INV<span class="text-cyan-400">FLOW</span></h2>
                    <p class="text-[10px] text-cyan-500/70 font-num tracking-[0.4em] uppercase">System Initializing</p>
                </div>
                <div class="h-1 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 relative">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-500 w-0 shadow-[0_0_20px_rgba(6,182,212,0.8)] relative">
                        <div class="absolute right-0 top-0 bottom-0 w-2 bg-white/50 blur-[2px]"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px] animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-600/10 rounded-full blur-[120px] animate-float-delayed"></div>
        <div class="absolute top-[30%] left-[40%] w-[40%] h-[40%] bg-violet-600/5 rounded-full blur-[100px] animate-pulse-slow"></div>
        <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>
    </div>

    <div class="min-h-screen flex flex-col md:flex-row relative z-10">
        
        <!-- SIDEBAR WRAPPER (Desktop) -->
        <div class="hidden md:block w-24 shrink-0 mx-4 my-4 relative z-50">
            <aside class="absolute left-0 top-0 w-24 hover:w-[280px] glass-panel border border-white/5 flex-col rounded-3xl h-[calc(100vh-2rem)] shadow-[0_0_40px_rgba(0,0,0,0.5)] transition-all duration-300 ease-in-out group/sidebar overflow-hidden flex bg-slate-950/80 hover:bg-slate-900/90 backdrop-blur-2xl">
                <div class="p-6 pb-4 flex items-center gap-4 shrink-0">
                    <div class="w-12 h-12 shrink-0 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] border border-white/10 relative overflow-hidden group">
                        <i data-lucide="package" class="text-white w-6 h-6 relative z-10"></i>
                    </div>
                    <div class="opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 whitespace-nowrap">
                        <h1 class="text-2xl font-bold text-white tracking-tight font-num">INV<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Flow</span></h1>
                        <p class="text-[10px] text-slate-400 font-medium tracking-[0.2em] uppercase">Inventory</p>
                    </div>
                </div>
                
                <!-- Fixed overflow to allow scrolling if screen is too small -->
                <nav class="flex-1 px-3 space-y-1.5 mt-2 overflow-y-auto overflow-x-hidden custom-scrollbar" id="desktop-nav"></nav>
                
                <!-- Settings & Actions (Toggle Panel) -->
                <div class="p-4 mt-auto shrink-0 flex flex-col gap-1.5 border-t border-white/5 pt-3 bg-slate-950/50">
                    
                    <!-- Toggle Button -->
                    <button onclick="toggleDesktopSettingsPanel()" class="w-full py-3 px-0 rounded-xl bg-slate-800/40 hover:bg-slate-800/80 text-xs font-bold text-slate-300 transition-all flex items-center gap-4 group/btn relative overflow-hidden">
                        <div class="w-12 flex justify-center shrink-0 relative z-10">
                            <i data-lucide="settings" id="settings-spin-icon" class="w-5 h-5 transition-transform duration-500"></i>
                        </div>
                        <span class="whitespace-nowrap opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 relative z-10 flex-1 text-left font-padauk tracking-wide">ဆက်တင်များ</span>
                        <div class="w-8 shrink-0 opacity-0 group-hover/sidebar:opacity-100 transition-opacity duration-300 flex justify-center">
                            <i data-lucide="chevron-down" id="settings-chevron" class="w-4 h-4 transition-transform duration-300 text-slate-500"></i>
                        </div>
                    </button>

                    <!-- Hidden Collapsible Panel -->
                    <div id="desktop-settings-panel" class="hidden flex-col gap-1.5 mt-1 transition-all duration-300">
                        <button onclick="exportReport()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-emerald-600/10 to-green-600/10 hover:from-emerald-600/20 hover:to-green-600/20 text-xs font-bold text-emerald-400 border border-emerald-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">
                                <i data-lucide="file-text" class="w-5 h-5 group-hover/action:scale-110 transition-transform"></i>
                            </div>
                            <span class="whitespace-nowrap opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 relative z-10 font-padauk tracking-wide">Export Report</span>
                        </button>

                        <button onclick="exportDataJSON()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-cyan-600/10 to-blue-600/10 hover:from-cyan-600/20 hover:to-blue-600/20 text-xs font-bold text-cyan-400 border border-cyan-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">
                                <i data-lucide="download-cloud" class="w-5 h-5 group-hover/action:scale-110 transition-transform"></i>
                            </div>
                            <span class="whitespace-nowrap opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 relative z-10 font-padauk tracking-wide">Backup Data</span>
                        </button>

                        <button onclick="triggerImport()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-violet-600/10 to-purple-600/10 hover:from-violet-600/20 hover:to-purple-600/20 text-xs font-bold text-violet-400 border border-violet-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">
                                <i data-lucide="upload-cloud" class="w-5 h-5 group-hover/action:scale-110 transition-transform"></i>
                            </div>
                            <span class="whitespace-nowrap opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 relative z-10 font-padauk tracking-wide">Restore Data</span>
                        </button>

                        <button onclick="resetData()" class="w-full py-3 px-0 rounded-xl bg-gradient-to-r from-rose-600/10 to-red-600/10 hover:from-rose-600/20 hover:to-red-600/20 text-xs font-bold text-rose-400 border border-rose-500/20 transition-all flex items-center gap-4 group/action relative overflow-hidden mt-1">
                            <div class="w-12 flex justify-center shrink-0 relative z-10">
                                <i data-lucide="trash-2" class="w-5 h-5 group-hover/action:rotate-12 transition-transform"></i>
                            </div>
                            <span class="whitespace-nowrap opacity-0 group-hover/sidebar:opacity-100 transition-all duration-300 translate-x-2 group-hover/sidebar:translate-x-0 relative z-10 font-padauk tracking-wide">ဒေတာအားလုံးဖျက်မည်</span>
                        </button>
                    </div>

                </div>
            </aside>
        </div>

        <!-- MOBILE HEADER -->
        <div class="md:hidden fixed top-0 left-0 right-0 z-40 bg-[#020617]/80 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="package" class="text-white w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg text-white font-num">INV<span class="text-cyan-400">Flow</span></span>
            </div>
            <button onclick="toggleMobileSettings()" class="w-9 h-9 rounded-full bg-slate-800/80 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors relative backdrop-blur-md">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative z-10 pt-20 md:pt-4 md:px-0 pb-28 md:pb-4 h-screen overflow-y-auto custom-scrollbar scroll-smooth">
            <div id="app-content" class="max-w-7xl mx-auto px-4 md:px-8 space-y-8 animate-slide-up pb-10">
                <!-- Dynamic Content injected here -->
            </div>
        </main>

        <!-- MOBILE SETTINGS MODAL -->
        <div id="mobile-settings-modal" class="fixed inset-0 z-[60] hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in" onclick="if(event.target === this) toggleMobileSettings()">
            <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative border border-white/10 shadow-2xl animate-slide-up mb-20 sm:mb-0">
                <button onclick="toggleMobileSettings()" class="absolute right-5 top-5 p-2 rounded-full bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2 font-padauk">
                    <i data-lucide="settings" class="w-5 h-5 text-cyan-400"></i> ဆက်တင်များ
                </h3>
                <div class="flex flex-col gap-3 font-padauk">
                    <button onclick="exportReport(); toggleMobileSettings()" class="w-full py-3 px-4 rounded-xl bg-emerald-500/10 text-sm font-bold text-emerald-400 border border-emerald-500/20 flex items-center justify-between transition-colors hover:bg-emerald-500/20">
                        <span>Export Report (.txt)</span> <i data-lucide="file-text" class="w-4 h-4"></i>
                    </button>
                    <button onclick="exportDataJSON(); toggleMobileSettings()" class="w-full py-3 px-4 rounded-xl bg-cyan-500/10 text-sm font-bold text-cyan-400 border border-cyan-500/20 flex items-center justify-between transition-colors hover:bg-cyan-500/20">
                        <span>Backup Data (.json)</span> <i data-lucide="download-cloud" class="w-4 h-4"></i>
                    </button>
                    <button onclick="triggerImport(); toggleMobileSettings()" class="w-full py-3 px-4 rounded-xl bg-violet-500/10 text-sm font-bold text-violet-400 border border-violet-500/20 flex items-center justify-between transition-colors hover:bg-violet-500/20">
                        <span>Restore Data (.json)</span> <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                    </button>
                    <div class="h-px w-full bg-white/10 my-1"></div>
                    <button onclick="resetData(); toggleMobileSettings()" class="w-full py-3 px-4 rounded-xl bg-rose-500/10 text-sm font-bold text-rose-400 border border-rose-500/20 flex items-center justify-between transition-colors hover:bg-rose-500/20">
                        <span>ဒေတာအားလုံးဖျက်မည်</span> <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- CUSTOM CONFIRM MODAL -->
        <div id="confirm-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
            <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative border border-white/10 shadow-2xl text-center">
                <div class="w-16 h-16 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center mx-auto mb-4 border border-red-500/20 shadow-[0_0_20px_rgba(239,68,68,0.2)]">
                    <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-2 font-padauk">သေချာပါသလား?</h3>
                <p class="text-xs text-slate-400 mb-6 font-padauk leading-relaxed" id="confirm-message">ဤလုပ်ဆောင်မှုကို ပြန်ပြင်၍မရပါ။</p>
                <div class="flex justify-center gap-3">
                    <button onclick="closeConfirmModal()" class="px-5 py-2.5 rounded-xl text-slate-300 hover:bg-white/10 text-sm font-bold border border-transparent hover:border-white/10 transition-colors font-padauk">မလုပ်တော့ပါ</button>
                    <button id="confirm-yes-btn" onclick="executeConfirm()" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-red-600/30 font-padauk">အတည်ပြုမည်</button>
                </div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION -->
        <div id="toast-notification" class="fixed top-4 right-4 z-[70] hidden transition-all duration-500 translate-x-full">
            <div class="glass-panel px-5 py-4 rounded-xl border border-white/10 shadow-2xl flex items-center gap-4 bg-[#020617]/90 backdrop-blur-xl" id="toast-bg">
                <div class="w-8 h-8 rounded-full flex items-center justify-center border shrink-0" id="toast-icon-bg">
                    <i data-lucide="info" class="w-4 h-4" id="toast-icon"></i>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-white font-padauk" id="toast-title">Notification</h4>
                    <p class="text-xs text-slate-400 font-padauk" id="toast-message">Operation completed.</p>
                </div>
            </div>
        </div>

        <!-- HIDDEN IMPORT INPUT -->
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importDataJSON(event)" />

        <!-- MOBILE BOTTOM NAV -->
        <div class="md:hidden fixed bottom-6 left-4 right-4 h-[70px] glass-panel rounded-2xl border border-white/10 z-50 flex items-center justify-between px-2 shadow-[0_10px_30px_rgba(0,0,0,0.5)]" id="mobile-nav">
            <!-- Mobile nav items injected by JS -->
        </div>
    </div>

    <!-- Hidden Datalist for autocomplete -->
    <datalist id="item-list"></datalist>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- State Management ---
        let state = JSON.parse(localStorage.getItem('inventory_flow_data')) || {
            activeTab: 'dashboard',
            transactions: [], // { id, date, name, qty, type: 'IN'|'OUT', isOpening: bool }
            items: [] // unique item names
        };

        // Pagination State
        let currentPage = 1;
        const itemsPerPage = 10;

        const saveState = () => {
            localStorage.setItem('inventory_flow_data', JSON.stringify(state));
        };

        let pendingConfirmAction = null;
        let toastTimeout = null; // Bug Fix: To manage toast overlapping

        // --- Settings / Modal Toggles ---
        window.toggleDesktopSettingsPanel = function() {
            const panel = document.getElementById('desktop-settings-panel');
            const chevron = document.getElementById('settings-chevron');
            const spinIcon = document.getElementById('settings-spin-icon');
            
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                chevron.classList.add('rotate-180');
                spinIcon.classList.add('rotate-90');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
                chevron.classList.remove('rotate-180');
                spinIcon.classList.remove('rotate-90');
            }
        };

        window.toggleMobileSettings = function() {
            const m = document.getElementById('mobile-settings-modal');
            if (m.classList.contains('hidden')) {
                m.classList.remove('hidden');
                m.classList.add('flex');
                lucide.createIcons();
            } else {
                m.classList.add('hidden');
                m.classList.remove('flex');
            }
        };

        // --- Helper Functions ---
        // Bug Fix: XSS Protection for rendering user inputs securely
        const escapeHTML = (str) => {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        };

        const formatNumber = (num) => Number(num).toLocaleString(undefined, { maximumFractionDigits: 3 });

        // Bug Fix: Ensure proper Local Time formatting instead of UTC which can shift to yesterday
        const getTodayDate = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDateDisplay = (dateStr) => {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        };

        // Custom Toast System (Fixed Overlap Bug)
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast-notification');
            const msgEl = document.getElementById('toast-message');
            const titleEl = document.getElementById('toast-title');
            const bgEl = document.getElementById('toast-bg');
            const iconBgEl = document.getElementById('toast-icon-bg');
            const iconEl = document.getElementById('toast-icon');
            
            msgEl.textContent = message;
            
            if (type === 'success') {
                titleEl.textContent = "အောင်မြင်ပါသည်";
                bgEl.className = "glass-panel px-5 py-4 rounded-xl border border-emerald-500/20 shadow-2xl flex items-center gap-4 bg-[#020617]/90 backdrop-blur-xl";
                iconBgEl.className = "w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20 shrink-0";
                iconEl.setAttribute('data-lucide', 'check');
            } else {
                titleEl.textContent = "သတိပြုရန်";
                bgEl.className = "glass-panel px-5 py-4 rounded-xl border border-rose-500/20 shadow-2xl flex items-center gap-4 bg-[#020617]/90 backdrop-blur-xl";
                iconBgEl.className = "w-8 h-8 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center border border-rose-500/20 shrink-0";
                iconEl.setAttribute('data-lucide', 'alert-circle');
            }
            
            lucide.createIcons();
            
            // Clear existing timeout if multiple toasts are triggered
            if(toastTimeout) clearTimeout(toastTimeout);
            
            toast.classList.remove('hidden', 'translate-x-full');
            
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.classList.add('hidden'), 500);
            }, 3000);
        }

        // Custom Confirm System
        function showConfirm(message, actionCallback) {
            const modal = document.getElementById('confirm-modal');
            const msgEl = document.getElementById('confirm-message');
            msgEl.textContent = message;
            pendingConfirmAction = actionCallback;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingConfirmAction = null;
        }

        function executeConfirm() {
            if (pendingConfirmAction) pendingConfirmAction();
            closeConfirmModal();
        }

        function updateItemOptions() {
            const dataList = document.getElementById('item-list');
            if(dataList) {
                dataList.innerHTML = state.items.map(i => `<option value="${escapeHTML(i)}">`).join('');
            }
        }

        // --- Pagination Logic ---
        window.changePage = (page) => {
            currentPage = page;
            renderApp();
            // Scroll to top of table
            const content = document.getElementById('app-content');
            content.scrollIntoView({ behavior: 'smooth' });
        };

        function renderPaginationControls(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return '';
            
            let btns = '';
            for (let i = 1; i <= totalPages; i++) {
                btns += `<button onclick="changePage(${i})" class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-sm font-num transition-all ${currentPage === i ? 'bg-cyan-500 text-white shadow-[0_0_10px_rgba(6,182,212,0.5)] border-transparent' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border border-white/5'}">${i}</button>`;

                    <p class="text-xs text-slate-500 font-num">Showing ${(currentPage-1)*itemsPerPage + 1} to ${Math.min(currentPage*itemsPerPage, totalItems)} of ${totalItems} entries</p>

                        ${btns}
                        <button onclick="changePage(${Math.min(totalPages, currentPage + 1)})" class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed border border-white/5" ${currentPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `;
        }

        // --- Core Inventory Logic ---
        const calculateBalanceData = () => {
            return state.items.map(itemName => {
                const itemTrans = state.transactions.filter(t => t.name === itemName);
                const opening = Number(itemTrans.filter(t => t.isOpening).reduce((sum, t) => sum + t.qty, 0).toFixed(4));
                const totalIn = Number(itemTrans.filter(t => t.type === 'IN' && !t.isOpening).reduce((sum, t) => sum + t.qty, 0).toFixed(4));
                const totalOut = Number(itemTrans.filter(t => t.type === 'OUT').reduce((sum, t) => sum + t.qty, 0).toFixed(4));
                const balance = Number(((opening + totalIn) - totalOut).toFixed(4));

                return { itemName, opening, totalIn, totalOut, balance };
            });
        };

        const getDashboardMetrics = () => {
            const today = getTodayDate();
            const todayIn = Number(state.transactions
                .filter(t => t.date === today && t.type === 'IN' && !t.isOpening)
                .reduce((sum, t) => sum + t.qty, 0).toFixed(4));
            
            const todayOut = Number(state.transactions
                .filter(t => t.date === today && t.type === 'OUT')
                .reduce((sum, t) => sum + t.qty, 0).toFixed(4));
                
            const balanceData = calculateBalanceData();
            const totalStockQty = Number(balanceData.reduce((sum, item) => sum + item.balance, 0).toFixed(4));

            return {
                totalItems: state.items.length,
                todayIn,
                todayOut,
                totalStockQty
            };
        };

        // --- Settings & File Operations ---
        function exportReport() {
            const m = getDashboardMetrics();
            const date = new Date().toLocaleDateString('en-GB');
            let report = `Inventory Flow - Ultimate Report\nGenerated on: ${date}\n--------------------------------\n\n`;
            
            report += `=== DASHBOARD OVERVIEW ===\n`;
            report += `Total Items Registered : ${m.totalItems}\n`;
            report += `Total Stock Quantity   : ${m.totalStockQty}\n`;
            report += `Today's Stock In       : ${m.todayIn}\n`;
            report += `Today's Stock Out      : ${m.todayOut}\n\n`;

            report += `=== STOCK BALANCE ===\n`;
            const balanceData = calculateBalanceData();
            if(balanceData.length === 0) report += "No items available.\n";
            balanceData.forEach(b => {
                report += `${b.itemName} | Opening: ${b.opening} | In: ${b.totalIn} | Out: ${b.totalOut} | Balance: ${b.balance}\n`;
            });

            report += `\n=== RECENT TRANSACTIONS ===\n`;
            const recent = [...state.transactions].reverse().slice(0, 100); // Last 100 max
            if(recent.length === 0) report += "No transactions available.\n";
            recent.forEach(t => {
                const type = t.isOpening ? 'OPENING' : (t.type === 'IN' ? 'IN' : 'OUT');
                report += `${formatDateDisplay(t.date)} | ${t.name} | [${type}] | Qty: ${t.qty}\n`;
            });

            const blob = new Blob([report], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Inventory_Report_${getTodayDate()}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
            showToast("Report ဒေါင်းလုတ်ဆွဲပြီးပါပြီ");
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "Inventory_Backup_" + getTodayDate() + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            showToast("Backup ဖိုင် ဒေါင်းလုတ်ဆွဲပြီးပါပြီ");
        }

        function triggerImport() {
            document.getElementById('import-file').click();
        }

        function importDataJSON(event) {
            const fileObj = event.target.files[0];
            if (!fileObj) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const newData = JSON.parse(content);
                    
                    if(Array.isArray(newData.transactions) && Array.isArray(newData.items)) {
                        state = newData;
                        state.activeTab = 'dashboard'; // Bug Fix: Force set tab to ensure UI renders properly
                        saveState();
                        currentPage = 1;
                        renderApp();
                        showToast("ဒေတာများ အောင်မြင်စွာ Restore လုပ်ပြီးပါပြီ");
                    } else {
                        showToast("Backup ဖိုင်အမျိုးအစား မှားယွင်းနေပါသည်", 'error');
                    }
                } catch (error) {
                    showToast("ဖိုင်ဖတ်ရာတွင် အမှားအယွင်းရှိပါသည်", 'error');
                }
            };
            reader.readAsText(fileObj);
            event.target.value = ''; 
        }

        const resetData = () => {
            showConfirm("ဒေတာအားလုံးကို ဖျက်ပစ်ရန် သေချာပါသလား?", () => {
                state.transactions = [];
                state.items = [];
                state.activeTab = 'dashboard';

                renderApp();

            });
        };

                    <form onsubmit="handleStockIn(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 relative z-10">
                        <div class="sm:col-span-1">${renderInput('in-date', 'ရက်စွဲ', 'date', getTodayDate())}</div>
                        <div class="sm:col-span-2">${renderInput('in-name', 'ပစ္စည်းအမည်', 'text', '', 'ပစ္စည်းအမည် ရိုက်ထည့်ပါ', 'list="item-list"')}</div>
                        <div class="sm:col-span-1">${renderInput('in-qty', 'အရေအတွက် (Qty)', 'number', '', '1', 'min="0.01" step="0.01"')}</div>
                        
                        <div class="sm:col-span-2 lg:col-span-2 flex items-center">
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative flex items-center justify-center">
                                    <input type="checkbox" id="in-is-opening" class="peer sr-only">
                                    <div class="w-6 h-6 rounded bg-slate-900/50 border border-white/20 peer-checked:bg-cyan-500 peer-checked:border-cyan-400 transition-all flex items-center justify-center shadow-inner">
                                        <i data-lucide="check" class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-300"></i>
                                    </div>
                                </div>
                                <span class="text-sm text-slate-300 group-hover:text-cyan-300 transition-colors font-padauk">အဖွင့်လက်ကျန် (Opening Stock) အဖြစ် သတ်မှတ်ရန်</span>
                            </label>
                        </div>
                        
                        <div class="sm:col-span-2 lg:col-span-2 flex justify-end">
                             <button type="submit" class="w-full sm:w-auto bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-[0_0_20px_rgba(16,185,129,0.4)] border border-emerald-400/20 px-8 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 group font-padauk">
                                <i data-lucide="save" class="w-4 h-4 group-hover:scale-110 transition-transform"></i> သိမ်းမည်
                             </button>
                        </div>
                    </form>
                </div>

                 <div class="glass-card rounded-2xl overflow-hidden p-0 border border-white/5 flex flex-col">
                     <div class="hidden md:block">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-900/80 text-slate-400 uppercase text-[10px] font-bold tracking-widest border-b border-white/5 backdrop-blur-md">
                                <tr>
                                    <th class="p-5 font-num">Date</th>
                                    <th class="p-5">Item Name</th>
                                    <th class="p-5">Type</th>
                                    <th class="p-5 text-right">Qty</th>
                                    <th class="p-5"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5 text-slate-300 font-padauk">
                                 ${recent.map(t => `
                                    <tr class="hover:bg-white/[0.03] transition-colors group">
                                        <td class="p-5 font-num text-slate-400">${formatDateDisplay(t.date)}</td>
                                        <td class="p-5 font-bold text-white">${escapeHTML(t.name)}</td>
                                        <td class="p-5">
                                            <span class="px-2.5 py-1 rounded-md text-xs font-bold ${t.isOpening ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                                                ${t.isOpening ? 'OPENING' : 'STOCK IN'}
                                            </span>
                                        </td>
                                        <td class="p-5 text-right font-num font-bold text-emerald-400">+${t.qty}</td>
                                        <td class="p-5 text-right">
                                            <button onclick="deleteTransaction('${t.id}')" class="p-2 rounded-lg text-slate-600 hover:text-rose-400 hover:bg-rose-500/10 transition-all opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </td>
                                    </tr>`
                                ).join('')}
                                ${recent.length === 0 ? '<tr><td colspan="5" class="p-8 text-center text-slate-500 font-padauk italic">မှတ်တမ်းမရှိသေးပါ။</td></tr>' : ''}
                            </tbody>
                        </table>
                     </div>

                     <!-- Mobile List -->
                     <div class="md:hidden space-y-3 p-4">
                        ${recent.map(t => `
                            <div class="bg-white/[0.02] p-4 rounded-xl flex justify-between items-center border border-white/5 border-l-2 ${t.isOpening ? 'border-l-blue-500' : 'border-l-emerald-500'}">
                                <div>
                                    <h4 class="font-bold text-white text-base font-padauk">${escapeHTML(t.name)}</h4>
                                    <p class="text-xs text-slate-500 font-num mt-1">${formatDateDisplay(t.date)} <span class="${t.isOpening ? 'text-blue-400' : 'text-emerald-400'} text-[10px] ml-2">${t.isOpening ? 'OPENING' : 'IN'}</span></p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <p class="font-bold text-emerald-400 font-num text-lg">+${t.qty}</p>
                                    <button onclick="deleteTransaction('${t.id}')" class="p-2 rounded-lg text-slate-500 hover:text-rose-400 bg-white/5"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>`
                        ).join('')}
                     </div>

                     ${renderPaginationControls(totalItems)}
                 </div>
            `;
        }

        function renderStockOut() {
            const allRecent = state.transactions.filter(t => t.type === 'OUT').reverse();
            const totalItems = allRecent.length;
            
            let totalPages = Math.ceil(totalItems / itemsPerPage);
            if(totalPages === 0) totalPages = 1;
            if(currentPage > totalPages) currentPage = totalPages;

            const recent = allRecent.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            const selectOptions = state.items.map(i => `<option value="${escapeHTML(i)}">${escapeHTML(i)}</option>`).join('');

            return `
                 <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                    <div>
                      <h2 class="text-3xl font-bold text-white tracking-tight font-num">Stock Out</h2>
                      <p class="text-xs text-slate-400 mt-1 font-padauk">ပစ္စည်းအထွက်/အရောင်းစာရင်း မှတ်သားရန်</p>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-5 md:p-8 border border-rose-500/20 bg-gradient-to-br from-rose-900/10 to-transparent relative overflow-hidden mb-8">
                    <div class="absolute top-0 right-0 w-96 h-96 bg-rose-500/10 rounded-full blur-[100px] pointer-events-none -mr-32 -mt-32 animate-pulse-slow"></div>
                    <div class="flex items-center justify-between mb-8 relative z-10">
                        <h3 class="text-rose-400 font-bold flex items-center gap-3 text-lg font-padauk">
                            <div class="p-2 bg-rose-500/20 rounded-lg shadow-[0_0_15px_rgba(244,63,94,0.3)]"><i data-lucide="package-minus" class="w-5 h-5"></i></div> 
                            ပစ္စည်းထုတ်ယူမည်
                        </h3>
                    </div>
                    <form onsubmit="handleStockOut(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 relative z-10">
                        <div class="sm:col-span-1">${renderInput('out-date', 'ရက်စွဲ', 'date', getTodayDate())}</div>
                        <div class="sm:col-span-2">${renderSelect('out-name', 'ပစ္စည်းအမည်', selectOptions)}</div>
                        <div class="sm:col-span-1">${renderInput('out-qty', 'အရေအတွက် (Qty)', 'number', '', '1', 'min="0.01" step="0.01"')}</div>
                        
                        <div class="sm:col-span-2 lg:col-span-4 flex justify-end mt-2">
                             <button type="submit" class="w-full sm:w-auto bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white shadow-[0_0_20px_rgba(244,63,94,0.4)] border border-rose-400/20 px-8 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 group font-padauk">
                                <i data-lucide="external-link" class="w-4 h-4 group-hover:-translate-y-1 group-hover:translate-x-1 transition-transform"></i> ထုတ်မည်
                             </button>
                        </div>
                    </form>
                </div>

                 <div class="glass-card rounded-2xl overflow-hidden p-0 border border-white/5 flex flex-col">
                     <div class="hidden md:block">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-900/80 text-slate-400 uppercase text-[10px] font-bold tracking-widest border-b border-white/5 backdrop-blur-md">
                                <tr>
                                    <th class="p-5 font-num">Date</th>
                                    <th class="p-5">Item Name</th>
                                    <th class="p-5 text-right">Qty</th>
                                    <th class="p-5"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5 text-slate-300 font-padauk">
                                 ${recent.map(t => `
                                    <tr class="hover:bg-white/[0.03] transition-colors group">
                                        <td class="p-5 font-num text-slate-400">${formatDateDisplay(t.date)}</td>
                                        <td class="p-5 font-bold text-white">${escapeHTML(t.name)}</td>
                                        <td class="p-5 text-right font-num font-bold text-rose-400">-${t.qty}</td>
                                        <td class="p-5 text-right">
                                            <button onclick="deleteTransaction('${t.id}')" class="p-2 rounded-lg text-slate-600 hover:text-rose-400 hover:bg-rose-500/10 transition-all opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </td>
                                    </tr>`
                                ).join('')}
                                ${recent.length === 0 ? '<tr><td colspan="4" class="p-8 text-center text-slate-500 font-padauk italic">မှတ်တမ်းမရှိသေးပါ။</td></tr>' : ''}
                            </tbody>
                        </table>
                     </div>

                     <!-- Mobile List -->
                     <div class="md:hidden space-y-3 p-4">
                        ${recent.map(t => `
                            <div class="bg-white/[0.02] p-4 rounded-xl flex justify-between items-center border border-white/5 border-l-2 border-l-rose-500">
                                <div>
                                    <h4 class="font-bold text-white text-base font-padauk">${escapeHTML(t.name)}</h4>
                                    <p class="text-xs text-slate-500 font-num mt-1">${formatDateDisplay(t.date)} <span class="text-rose-400 text-[10px] ml-2">OUT</span></p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <p class="font-bold text-rose-400 font-num text-lg">-${t.qty}</p>
                                    <button onclick="deleteTransaction('${t.id}')" class="p-2 rounded-lg text-slate-500 hover:text-rose-400 bg-white/5"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>`
                        ).join('')}
                     </div>

                     ${renderPaginationControls(totalItems)}
                 </div>
            `;
        }

        function renderBalance() {
            const allData = calculateBalanceData();
            const totalItems = allData.length;

            let totalPages = Math.ceil(totalItems / itemsPerPage);
            if(totalPages === 0) totalPages = 1;
            if(currentPage > totalPages) currentPage = totalPages;

            const data = allData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            
            return `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                    <div>
                      <h2 class="text-3xl font-bold text-white tracking-tight font-num">Stock Balance</h2>
                      <p class="text-xs text-slate-400 mt-1 font-padauk">ကုန်ပစ္စည်းလက်ကျန် အခြေအနေ</p>
                    </div>
                </div>

                <div class="glass-card rounded-2xl overflow-hidden p-0 border border-white/5 pb-safe md:pb-0 flex flex-col">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-sm min-w-[600px]">
                            <thead class="bg-slate-900/80 text-slate-400 uppercase text-[10px] font-bold tracking-widest border-b border-white/5 backdrop-blur-md">
                                <tr>
                                    <th class="p-5 font-padauk">ပစ္စည်းအမည်</th>
                                    <th class="p-5 text-right font-padauk">အဖွင့် (Opening)</th>
                                    <th class="p-5 text-right font-padauk">စုစုပေါင်းအဝင်</th>
                                    <th class="p-5 text-right font-padauk">စုစုပေါင်းအထွက်</th>
                                    <th class="p-5 text-right font-padauk text-cyan-400">လက်ကျန် (Balance)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5 text-slate-300 font-padauk">
                                ${data.length > 0 ? data.map(d => `
                                    <tr class="hover:bg-white/[0.03] transition-colors">
                                        <td class="p-5 font-bold text-white whitespace-nowrap">${escapeHTML(d.itemName)}</td>
                                        <td class="p-5 text-right font-num text-blue-400">${formatNumber(d.opening)}</td>
                                        <td class="p-5 text-right font-num text-emerald-400">${formatNumber(d.totalIn)}</td>
                                        <td class="p-5 text-right font-num text-rose-400">${formatNumber(d.totalOut)}</td>
                                        <td class="p-5 text-right font-num">
                                            <span class="inline-flex items-center justify-center min-w-[2.5rem] px-2.5 py-1 rounded-lg text-sm font-bold shadow-sm border
                                                ${d.balance <= 5 
                                                    ? 'bg-rose-500/20 text-rose-400 border-rose-500/30 shadow-[0_0_10px_rgba(244,63,94,0.2)]' 
                                                    : 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30 shadow-[0_0_10px_rgba(6,182,212,0.2)]'
                                                }">
                                                ${formatNumber(d.balance)}
                                            </span>
                                        </td>
                                    </tr>`
                                ).join('') : '<tr><td colspan="5" class="p-8 text-center text-slate-500 font-padauk italic">လက်ကျန်စာရင်းများ မရှိသေးပါ။</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    
                    ${renderPaginationControls(totalItems)}
                 </div>
            `;
        }


        // --- Actions Handlers ---
        
        function switchTab(tabId) {
            state.activeTab = tabId;
            currentPage = 1; // Reset pagination on tab change
            renderApp();
        }

        function handleStockIn(e) {
            e.preventDefault();
            const date = document.getElementById('in-date').value;
            const rawName = document.getElementById('in-name').value.trim();
            const qty = parseFloat(document.getElementById('in-qty').value);
            const isOpening = document.getElementById('in-is-opening').checked;

            // Bug Fix: Basic validation for qty
            if (isNaN(qty) || qty <= 0) {
                return showToast("အရေအတွက် မှားယွင်းနေပါသည်", 'error');
            }

            if (rawName && date) {
                state.transactions.push({
                    id: Date.now().toString() + Math.floor(Math.random() * 1000).toString(), 
                    date, 
                    name: rawName, 
                    qty, 
                    type: 'IN', 
                    isOpening
                });
                
                if (!state.items.includes(rawName)) {
                    state.items.push(rawName);
                }
                
                saveState();
                currentPage = 1; 
                showToast("ပစ္စည်းအဝင် စာရင်းသွင်းပြီးပါပြီ");
                renderApp();
            }
        }

        function handleStockOut(e) {
            e.preventDefault();
            const date = document.getElementById('out-date').value;
            const name = document.getElementById('out-name').value;
            const qty = parseFloat(document.getElementById('out-qty').value);

            if (!name) return showToast("ပစ္စည်းအမည် ရွေးချယ်ပါ", 'error');
            
            // Bug Fix: Basic validation for qty
            if (isNaN(qty) || qty <= 0) {
                return showToast("အရေအတွက် မှားယွင်းနေပါသည်", 'error');
            }

            const itemTrans = state.transactions.filter(t => t.name === name);
            const opening = Number(itemTrans.filter(t => t.isOpening).reduce((sum, t) => sum + t.qty, 0).toFixed(4));
            const totalIn = Number(itemTrans.filter(t => t.type === 'IN' && !t.isOpening).reduce((sum, t) => sum + t.qty, 0).toFixed(4));
            const totalOut = Number(itemTrans.filter(t => t.type === 'OUT').reduce((sum, t) => sum + t.qty, 0).toFixed(4));
            const currentBalance = Number(((opening + totalIn) - totalOut).toFixed(4));

            if (qty > currentBalance) {
                return showToast(`လက်ကျန်မလောက်ပါ။ လက်ရှိလက်ကျန်မှာ ${formatNumber(currentBalance)} သာရှိပါသည်။`, 'error');
            }

            if (name && date) {
                state.transactions.push({
                    id: Date.now().toString() + Math.floor(Math.random() * 1000).toString(),
                    date, 
                    name, 
                    qty, 
                    type: 'OUT', 
                    isOpening: false
                });
                
                saveState();
                currentPage = 1;
                showToast("ပစ္စည်းအထွက် စာရင်းသွင်းပြီးပါပြီ");
                renderApp();
            }
        }


        // --- Main Render Loop ---
        function renderApp() {
            renderNavigation();
            updateItemOptions();
            
            const content = document.getElementById('app-content');
            if (state.activeTab === 'dashboard') content.innerHTML = renderDashboard();
            else if (state.activeTab === 'stock-in') content.innerHTML = renderStockIn();
            else if (state.activeTab === 'stock-out') content.innerHTML = renderStockOut();
            else if (state.activeTab === 'balance') content.innerHTML = renderBalance();
            
            lucide.createIcons();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            
            const progress = document.getElementById('progress-bar');
            const preloader = document.getElementById('preloader');
            let width = 0;

            const interval = setInterval(() => {
                width += Math.random() * 8;
                if (width > 100) width = 100;
                
                if (progress) progress.style.width = width + '%';

                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if(preloader) {
                            preloader.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
                            setTimeout(() => preloader.remove(), 700);
                        }
                    }, 400); 
                }
            }, 30);
        });

    </script>
</body>
</html>
